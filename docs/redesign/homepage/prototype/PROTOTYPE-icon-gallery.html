<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — icon gallery (throwaway)</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../../home.css">
  <style>
    body.home { padding: 24px; }
    .proto-banner { margin-bottom: 18px; padding: 10px 14px; border: 1px dashed var(--coral-ink); border-radius: 10px; font: 600 13px/1.4 var(--font-mono); color: var(--coral-ink); background: var(--card); }
    h2.g { font-size: 20px; margin: 22px 0 10px; }
    .ref { display: flex; gap: 16px; flex-wrap: wrap; }
    .crop { width: 200px; height: 156px; border: 1px solid var(--line); border-radius: 12px; background-image: url("../mockups/direction-c-recall-path-desktop-1792x1024.png"); background-repeat: no-repeat; }
    .crop.cards { background-position: -150px -722px; }
    .crop.map { background-position: -672px -722px; }
    .crop.chain { background-position: -1185px -722px; }
    .strip { display: flex; flex-wrap: wrap; gap: 12px; }
    .strip figure { margin: 0; display: grid; justify-items: center; gap: 6px; width: 132px; padding: 12px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
    .strip figcaption { font: 500 10px/1.3 var(--font-mono); color: var(--muted); text-align: center; word-break: break-all; }
    .row { display: grid; grid-template-columns: 170px repeat(6, auto); align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .row .meta { font: 600 12px/1.35 var(--font-body); }
    .row .meta small { display: block; font: 500 10px/1.3 var(--font-mono); color: var(--muted); }
    .cell { display: grid; place-items: center; border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px; }
    .cell.tint { background: var(--tint); border-color: color-mix(in oklab, var(--accent) 22%, transparent); }
    .cell.ink { background: var(--ink-800); border-color: var(--ink-600); }
    .cell.old { opacity: .9; border-style: dashed; }
    .cell svg.xl { width: 180px; height: 144px; }
    .cell svg.md { width: 96px; height: 77px; }
    .cell svg.sm { width: 40px; height: 32px; }
    .strip svg { width: 96px; height: 77px; }
    .old .sketch { stroke: var(--accent-ink); stroke-width: 2; }
    .old .sketch * { vector-effect: none; }
    .missing { font: 600 11px var(--font-mono); color: var(--danger); }
  </style>
</head>
<body class="home">
  <p class="proto-banner">PROTOTYPE — throwaway, không dùng trong production. Tham số: ?batch=golden|a|b|c|all &amp;compare=1 (hiện icon cũ). Icon nháp nạp từ icons-*.js cạnh file này.</p>

  <h2 class="g">Tham chiếu: mockup hướng C (crop 1:1)</h2>
  <div class="ref">
    <div class="crop cards" title="TOEIC 600 — thẻ xếp lớp"></div>
    <div class="crop map" title="Vocabulary Atlas — bản đồ gấp"></div>
    <div class="crop chain" title="Phrasal verbs — mắt xích"></div>
  </div>

  <h2 class="g" id="strip-title">Dải đồng bộ (96px trên card)</h2>
  <div class="strip" id="strip"></div>

  <h2 class="g">Từng icon: 180px · 96px · 40px (icon-sm) · trên tint · trên mực · (cũ)</h2>
  <div id="rows"></div>

  <script src="../../../../data/documents.js"></script>
  <script src="../../../../home-icons.js"></script>
  <script src="icons-golden.js"></script>
  <script src="icons-batch-a.js"></script>
  <script src="icons-batch-b.js"></script>
  <script src="icons-batch-c.js"></script>
  <script>
    const DRAFTS = window.ICON_DRAFTS || { resources: {}, categories: {}, extras: {} };
    const OLD = window.ENGLISH101_HOME_ICONS || { resources: {}, categories: {} };
    const DOCS = window.ENGLISH_101_DOCUMENTS || [];
    const slug = { Vocabulary: "vocabulary", Grammar: "grammar", Writing: "writing", Verb: "verb", Guide: "guide", Blog: "blog" };
    const BATCHES = {
      golden: { resources: ["toeic-600", "vocabulary-atlas", "phrasal-verbs"], categories: [] },
      a: { resources: ["personal-flashcards", "vocab-1-2", "vocab-3-4", "vocab-5-6", "vocab-writing", "reading-translation", "confusing-words", "root-atlas", "c1-vocabulary", "ielts-collocations", "hiking-collocations"], categories: ["Vocabulary"] },
      b: { resources: ["grammar-handbook", "conjunctions", "suffix-lab", "prepositions", "parts-of-speech", "tense-quiz", "essay-guide", "writing-pipeline"], categories: ["Grammar", "Writing"] },
      c: { resources: ["english-verbs", "verb-forms", "paraphrase", "deep-reading", "english-grammar-notes", "english-learning-101", "blog-active-recall"], categories: ["Verb", "Guide", "Blog"], extras: ["empty"] }
    };
    const params = new URLSearchParams(location.search);
    const pick = params.get("batch") || "all";
    const compare = params.has("compare");
    const only = params.get("ids") ? params.get("ids").split(",") : null;
    const names = pick === "all" ? Object.keys(BATCHES) : pick.split(",");
    const items = [];
    for (const name of names) {
      const b = BATCHES[name];
      if (!b) continue;
      for (const id of b.resources) {
        const doc = DOCS.find((d) => d.id === id);
        items.push({ key: id, title: doc ? doc.title : id, topic: doc ? slug[doc.category] : "all", draft: DRAFTS.resources[id], old: OLD.resources[id], label: doc ? doc.category : "?" });
      }
      for (const cat of b.categories) items.push({ key: "category:" + cat, title: "Chủ đề " + cat, topic: slug[cat], draft: DRAFTS.categories[cat], old: OLD.categories[cat], label: "category" });
      for (const ex of b.extras || []) items.push({ key: "extra:" + ex, title: "Empty state", topic: "all", draft: (DRAFTS.extras || {})[ex], old: "", label: "extra" });
    }
    if (only) items.splice(0, items.length, ...items.filter((it) => only.includes(it.key)));
    const svg = (body, cls, extra = "") => body ? `<svg class="sketch ${cls} ${extra}" viewBox="0 0 120 96" aria-hidden="true">${body}</svg>` : `<span class="missing">thiếu</span>`;
    document.getElementById("strip").innerHTML = items.map((it) => `<figure data-topic="${it.topic}">${svg(it.draft, "")}<figcaption>${it.key}</figcaption></figure>`).join("");
    document.getElementById("rows").innerHTML = items.map((it) => `
      <div class="row" data-topic="${it.topic}">
        <div class="meta">${it.title}<small>${it.key} · ${it.label}</small></div>
        <div class="cell">${svg(it.draft, "xl icon-lg")}</div>
        <div class="cell">${svg(it.draft, "md")}</div>
        <div class="cell">${svg(it.draft, "sm icon-sm")}</div>
        <div class="cell tint">${svg(it.draft, "md")}</div>
        <div class="cell ink">${svg(it.draft, "md on-ink")}</div>
        ${compare ? `<div class="cell old">${svg(it.old, "md")}</div>` : ""}
      </div>`).join("");
  </script>
</body>
</html>
