ervention helped stabilize markets.", "Sự can thiệp của chính phủ giúp ổn định thị trường."], ["The crisis required urgent intervention.", "Cuộc khủng hoảng đòi hỏi sự can thiệp khẩn cấp."], ["Early intervention improved outcomes.", "Sự can thiệp sớm cải thiện kết quả."]]], ["Infrastructure", "n", "C1", "/ˈɪnfrəstrʌktʃər/", "cơ sở hạ tầng", "Nhóm VI", [["The government invested in infrastructure.", "Chính phủ đầu tư vào cơ sở hạ tầng."], ["Aging infrastructure needs repair.", "Cơ sở hạ tầng lão hóa cần được sửa chữa."], ["Digital infrastructure supports remote work.", "Cơ sở hạ tầng số hỗ trợ làm việc từ xa."]]], ["Legislation", "n", "C1", "/ˌlɛdʒɪsˈleɪʃən/", "luật pháp", "Nhóm VI", [["Congress passed new legislation on trade.", "Quốc hội thông qua đạo luật mới về thương mại."], ["The legislation faced strong opposition.", "Đạo luật này vấp phải sự phản đối mạnh mẽ."], ["They lobbied for tax legislation.", "Họ vận động hành lang cho đạo luật thuế."]]], ["Socioeconomic", "adj", "C1", "/ˌsoʊsioʊˌɛkəˈnɑːmɪk/", "kinh tế – xã hội", "Nhóm VI", [["Socioeconomic status affects access to healthcare.", "Địa vị kinh tế – xã hội ảnh hưởng đến khả năng tiếp cận chăm sóc sức khỏe."], ["The study examined socioeconomic factors.", "Nghiên cứu xem xét các yếu tố kinh tế – xã hội."], ["Socioeconomic inequality remains a challenge.", "Bất bình đẳng kinh tế – xã hội vẫn là một thách thức."]]], ["Prevalence", "n", "C1", "/ˈprɛvələns/", "mức độ phổ biến", "Nhóm VI", [["The prevalence of the disease increased.", "Mức độ phổ biến của căn bệnh đã tăng lên."], ["Studies measured the prevalence of poverty.", "Các nghiên cứu đo lường mức độ phổ biến của nghèo đói."], ["The prevalence of remote work grew.", "Mức độ phổ biến của làm việc từ xa đã tăng lên."]]]];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function speak(w){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w.replace(/\s*\([^)]*\)/g,''));u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')})
let gf='ALL'; $('#chips').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;gf=b.dataset.g;$$('#chips .chip').forEach(x=>x.classList.toggle('active',x===b));render()};
$('#search').oninput=render;
function render(){let q=$('#search').value.trim().toLowerCase();let rows=DATA.filter(x=>(gf==='ALL'||x[5]===gf)&&(!q||[x[0],x[4],x[1],x[2],x[5]].join(' ').toLowerCase().includes(q)));$('#count').textContent=`${rows.length} / ${DATA.length} từ`;$('#cards').innerHTML=rows.map((x,i)=>`<div class="card"><div class="head"><div><div class="word">${esc(x[0])}</div><div class="meta">${esc(x[3])} · ${esc(x[1])}</div></div><button class="speak" data-w="${esc(x[0])}">▶</button></div><div class="meaning">${esc(x[4])}</div><div class="badges"><span class="badge">C1</span><span class="badge">${esc(x[5])}</span></div><button class="toggle">+ 3 VÍ DỤ</button><div class="examples">${x[6].map(e=>`<div class="ex">${esc(e[0])}<small>${esc(e[1])}</small></div>`).join('')}</div></div>`).join('');$$('.speak').forEach(b=>b.onclick=()=>speak(b.dataset.w));$$('.toggle').forEach(b=>b.onclick=()=>{b.nextElementSibling.classList.toggle('open');b.textContent=b.nextElementSibling.classList.contains('open')?'− ẨN VÍ DỤ':'+ 3 VÍ DỤ'})}
render();

let quiz=[],qi=0,correct=0,answered=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#start').onclick=()=>{let g=$('#qgroup').value,p=DATA.filter(x=>g==='ALL'||x[5]===g),n=Math.min(parseInt($('#num').value),p.length);quiz=shuffle([...p]).slice(0,n);qi=0;correct=0;$('#qsetup').style.display='none';$('#qplay').style.display='block';show()};
function show(){answered=false;let x=quiz[qi],d=$('#dir').value;$('#qmeta').textContent=`Câu ${qi+1} / ${quiz.length} · Đúng ${correct}`;$('#bar').style.width=`${qi/quiz.length*100}%`;$('#prompt').textContent=d==='envi'?x[0]:x[4];$('#hint').textContent=d==='envi'?`${x[3]} · ${x[1]} · ${x[5]}`:`${x[1]} · ${x[5]}`;$('#answer').value='';$('#answer').disabled=false;$('#fb').className='feedback';$('#fb').innerHTML='';$('#check').style.display='';$('#next').style.display='none';$('#answer').focus()}
function check(){if(answered)return;let raw=$('#answer').value.trim();if(!raw){$('#answer').focus();return}answered=true;let x=quiz[qi],d=$('#dir').value,a=raw.toLowerCase(),t=(d==='envi'?x[4]:x[0]).toLowerCase(),ok=d==='vien'?a===t:(a&& (t.includes(a)||a.includes(t)));$('#answer').disabled=true;let f=$('#fb');if(ok){correct++;f.className='feedback ok';f.innerHTML='✓ Đúng'}else{f.className='feedback bad';f.innerHTML=`✗ ${esc(x[0])} — ${esc(x[4])}`}$('#check').style.display='none';$('#next').style.display=''}
$('#check').onclick=check;$('#listen').onclick=()=>speak(quiz[qi][0]);$('#next').onclick=()=>{qi++;if(qi>=quiz.length){$('#qplay').style.display='none';$('#qend').style.display='block';$('#score').textContent=`${correct} / ${quiz.length}`;$('#endtxt').textContent='Hoàn thành bài luyện C1.'}else show()};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#qplay').style.display==='block'){e.preventDefault();answered?$('#next').click():check()}});$('#again').onclick=()=>{$('#qend').style.display='none';$('#qsetup').style.display='block'};
</script></body></html>
