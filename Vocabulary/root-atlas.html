const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='root-atlas-v1';let state={items:{},attempts:0,correct:0};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)state={...state,...s}}catch(e){}let tab='library',queue=[],idx=0,revealed=false,answered=false,score=0,answeredCount=0,direction='forward',limit=10,choices=[];
function item(id){return state.items[id]||(state.items[id]={level:0,due:0,star:false,wrong:0,note:''})}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Không lưu được trong trình duyệt này. Hãy Xuất tiến độ.')}stats()}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500)}
function stats(){const vals=DATA.map(d=>item(d.id));$('#stats').innerHTML=[['116','Gốc từ & phụ tố'],[vals.filter(x=>x.level>=3).length,'Đã thuộc'],[vals.filter(x=>x.level>0&&x.due<=Date.now()).length,'Đến hạn ôn'],[state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—','Đúng · '+state.attempts+' lượt kiểm tra']].map(([n,t])=>`<div class="stat"><b>${n}</b><small>${t}</small></div>`).join('')}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
function filtered(){const q=norm($('#search').value),p=$('#priority').value,g=$('#group').value,t=$('#status').value;return DATA.filter(d=>{const s=item(d.id);return(!q||norm(d.root+' '+d.vi+' '+d.en+' '+d.examples.join(' ')).includes(q))&&(!p||d.p==p)&&(!g||d.g==g)&&(!t||({new:s.level===0,learning:s.level>0&&s.level<3,known:s.level>=3,due:s.level>0&&s.due<=Date.now(),star:s.star,wrong:s.wrong>0})[t])})}
function statusText(d){let x=item(d.id);return x.level>=3?'✓ Đã thuộc':x.level?'◐ Đang học':'○ Chưa học'}
function detail(d){return `<details><summary>Nguồn gốc & họ từ</summary><p><b>Nguồn gốc:</b> ${esc(d.origin)}.</p><p class="note">${esc(d.note)}</p><ul class="examples">${d.examples.map(e=>`<li>${esc(e)}</li>`).join('')}</ul><a href="https://www.etymonline.com/word/${encodeURIComponent(d.lookup)}" target="_blank" rel="noopener">Tra nguồn gốc “${esc(d.lookup)}” ↗</a><p><label>Ghi chú / câu tự đặt<textarea data-note="${d.id}" placeholder="Viết một câu với từ trong họ này…">${esc(item(d.id).note||'')}</textarea></label></p></details>`}
function card(d){return `<article class="card"><div class="cardtop"><span class="symbol" aria-hidden="true">${d.symbol}</span><span class="badge">P${d.p} · ${d.new?'BỔ SUNG':'DANH SÁCH GỐC'}</span><button class="star" data-star="${d.id}" aria-label="Gắn sao ${esc(d.root)}" aria-pressed="${item(d.id).star}">${item(d.id).star?'★':'☆'}</button></div><h3>${esc(d.root)}</h3><p class="meaning">${esc(d.vi)}</p><small>${esc(d.en)} · ${d.type}</small><p class="muted" style="font-size:14px">${esc(d.examples[0])}</p>${detail(d)}<div class="actions"><button data-known="${d.id}">${statusText(d)}</button><button data-learn="${d.id}">Ôn riêng</button></div></article>`}
function library(){const list=filtered();$('#content').innerHTML=list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="card center">Không có mục phù hợp. Hãy đổi bộ lọc.</div>'}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){stats();$('#controls').classList.toggle('hidden',tab==='guide');$('#count').textContent=filtered().length+' mục phù hợp · Sắp theo ưu tiên → nhóm';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='library')library();else if(tab==='guide')guide();else setup()}
function setup(){queue=[];$('#content').innerHTML=`<div class="study card"><span class="badge">${tab==='flash'?'FLASHCARD':'KIỂM TRA HAI CHIỀU'}</span><h2>${tab==='flash'?'Nhớ trước khi lật thẻ':'Gọi lại kiến thức, không chỉ nhận mặt chữ'}</h2><p class="muted">Phiên học dùng ${filtered().length} mục theo bộ lọc phía trên. Chọn nhóm nhỏ để tránh quá tải.</p><div class="split"><label>Chiều học<select id="direction"><option value="forward">Gốc → nghĩa ${tab==='quiz'?'(chọn đáp án)':''}</option><option value="reverse">Nghĩa → gốc ${tab==='quiz'?'(tự gõ)':''}</option><option value="mixed">Trộn hai chiều</option></select></label><label>Số mục<select id="limit"><option value="10">10 mục</option><option value="20">20 mục</option><option value="999">Tất cả mục đang lọc</option></select></label></div><div class="actions"><button class="primary" id="start">Bắt đầu phiên học</button><button id="dueStart">Ôn các mục đến hạn</button></div><p><small>${tab==='flash'?'Enter: lật thẻ; sau khi lật, chọn Chưa nhớ hoặc Đã nhớ để ghi tiến độ.':'Enter: kiểm tra / hiện đáp án, nhấn lần nữa để chuyển câu. Gợi ý làm lượt trả lời này thành lượt luyện, không tính điểm.'}</small></p></div>`;$('#direction').value=direction;$('#limit').value=String(limit)}
let qdir='forward',hinted=false;
function start(due=false,only=null){direction=$('#direction')?.value||direction;limit=Number($('#limit')?.value||limit);let list=only||filtered();if(due)list=list.filter(d=>item(d.id).level&&item(d.id).due<=Date.now());queue=shuffle(list).slice(0,limit);idx=0;score=0;answeredCount=0;if(!queue.length){toast('Chưa có mục cho phiên này. Hãy đổi bộ lọc.');return}nextCard()}
function nextCard(){if(idx>=queue.length){finish();return}revealed=false;answered=false;hinted=false;qdir=direction==='mixed'?(Math.random()<.5?'forward':'reverse'):direction;drawStudy()}
function drawStudy(){let d=queue[idx];$('#content').innerHTML=`<div class="study"><div class="toolbar"><b>${tab==='flash'?'Flashcard':'Kiểm tra'} · ${idx+1} / ${queue.length}</b><button id="end">Kết thúc phiên</button></div><div class="progress"><span style="width:${idx/queue.length*100}%"></span></div><article class="card"><div class="cardtop"><span class="badge">${GROUPS[d.g]} · P${d.p}</span><button class="star" data-star="${d.id}" aria-label="Gắn sao">${item(d.id).star?'★':'☆'}</button></div><small>${qdir==='forward'?'Gốc / phụ tố này gợi nghĩa gì?':'Nghĩa này ứng với gốc / phụ tố nào?'}</small><div class="prompt">${esc(qdir==='forward'?d.root:d.vi)}</div>${qdir==='reverse'?`<p class="muted">${d.type} · ${esc(d.origin.startsWith('Hy Lạp')?'Hy Lạp':d.origin.startsWith('Latin')?'Latin':'Tiếng Anh cổ')}</p>`:''}<div id="exercise"></div><div id="answer" aria-live="polite"></div></article></div>`;
if(tab==='flash')$('#exercise').innerHTML='<button class="primary" id="flip">Lật thẻ ↵</button>';else if(qdir==='forward'){const unique=new Map(DATA.filter(x=>x.vi!==d.vi).map(x=>[x.vi,x]));choices=shuffle([d,...shuffle([...unique.values()]).slice(0,3)]);$('#exercise').innerHTML=choices.map((c,i)=>`<button class="choice" data-choice="${i}">${i+1}. ${esc(c.vi)}</button>`).join('')+'<button id="showAnswer">Chưa biết — xem đáp án</button>'}else{$('#exercise').innerHTML='<input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ một dạng gốc, ví dụ: tract" aria-label="Câu trả lời"><div class="actions"><button class="primary" id="check">Kiểm tra ↵</button><button id="hint">Gợi ý chữ đầu</button><button id="showAnswer">Chưa biết</button></div><p id="hintText" class="muted"></p>';$('#typed').focus()}}
function revealFlash(){if(revealed)return;revealed=true;let d=queue[idx];$('#exercise').innerHTML='';$('#answer').innerHTML=`<span class="symbol">${d.symbol}</span><h2>${esc(qdir==='forward'?d.vi:d.root)}</h2><p>${esc(d.en)}</p>${detail(d)}<div class="actions"><button id="again">1 · Chưa nhớ</button><button class="primary" id="remember">2 · Đã nhớ</button></div>`}
function schedule(d,good){let s=item(d.id);s.level=good?Math.min(6,s.level+1):1;s.due=Date.now()+(good?[0,1,3,7,14,30,60][s.level]*86400000:600000);save()}
function grade(good){if(answered)return;answered=true;answeredCount++;const d=queue[idx];if(!hinted){state.attempts++;if(good){state.correct++;score++}else item(d.id).wrong++;schedule(d,good)}else{item(d.id).level=Math.max(1,item(d.id).level);item(d.id).due=Date.now()+600000;save()}$('#exercise').querySelectorAll('button,input').forEach(b=>b.disabled=true);$('#answer').innerHTML=`<div class="feedback ${good?'':'wrong'}"><b>${hinted?'Lượt luyện có gợi ý':good?'✓ Chính xác':'Cần ôn lại'}</b><p><b>${esc(d.root)}</b> → ${esc(d.vi)}<br><small>${esc(d.en)}</small></p></div>${detail(d)}<div class="actions"><button class="primary" id="next">Câu tiếp ↵</button></div>`}
function check(){const d=queue[idx],v=norm($('#typed').value).replace(/[^a-z]/g,'');grade(d.aliases.some(a=>norm(a).replace(/[^a-z]/g,'')===v))}
function finish(){let total=queue.length;$('#content').innerHTML=`<div class="study card center"><span class="symbol">✓</span><h2>Đã hoàn thành phiên học</h2><p>${tab==='quiz'?`${score} câu đúng không dùng gợi ý / ${answeredCount} câu đã làm.`:`Đã ôn ${idx} / ${total} thẻ.`}</p><p class="muted">Ôn lại mục khó sau 10 phút. Các mục nhớ được sẽ giãn lịch 1 → 3 → 7 → 14 → 30 → 60 ngày.</p><div class="actions" style="justify-content:center"><button class="primary" id="restart">Chọn phiên mới</button><button data-tab="library">Về thư viện</button></div></div>`;queue=[];stats()}
function guide(){$('#content').innerHTML=`<div class="guide"><div class="card"><span class="badge">LỘ TRÌNH ĐỀ XUẤT</span><h2>Học 10 mục, dùng được một họ từ.</h2><p><b>1. Thư viện (5 phút):</b> chọn P1 và một nhóm. Đọc nghĩa, mở nguồn gốc, chọn hai ví dụ quen thuộc. Ký hiệu là mẹo nhớ do tài liệu thiết kế, không phải ký hiệu từ nguyên chuẩn.</p><p><b>2. Flashcard (5 phút):</b> nhìn gốc, tự nói nghĩa trước khi lật; sau đó đổi sang nghĩa → gốc.</p><p><b>3. Kiểm tra (5 phút):</b> tự gõ gốc từ tiếng Việt. Khi sai, đọc lại họ từ và lưu một câu vào ghi chú.</p><p><b>4. Áp dụng (5 phút):</b> lấy hai từ ví dụ, viết câu thật về học tập, công việc hoặc xã hội. Ghi chú không tự chấm ngữ pháp.</p><p class="note">Ưu tiên 1 = nền tảng, dễ tái sử dụng; 2 = mở rộng đọc học thuật; 3 = chuyên biệt hơn. Đây là thứ tự biên soạn theo tính hữu ích, không phải thống kê tần suất đề IELTS.</p></div><div class="split"><div class="card"><h3>Ba loại cần phân biệt</h3><p><b>Gốc:</b> phần mang ý nghĩa chính, như tract “kéo”. Các dạng mit/miss có quan hệ lịch sử, không phải lỗi chính tả.</p><p><b>Tiền tố:</b> đứng trước, thường đổi nghĩa: re- + build → rebuild.</p><p><b>Hậu tố:</b> đứng sau, thường gợi từ loại: develop + -ment → development (danh từ).</p><p><b>Yếu tố kết hợp:</b> bio-, geo-, -logy… thường dùng tạo từ học thuật. Cách phân loại có thể khác giữa từ điển.</p></div><div class="card"><h3>Đừng đoán chỉ bằng mặt chữ</h3><p>inaccurate: in- phủ định; inject: in- “vào”.</p><p>ante- “trước” khác anti- “chống”.</p><p>aqu- và hydr- đều chỉ nước nhưng đến từ hai ngôn ngữ khác nhau.</p><p>spect, spec/spic và vid/vis cùng gợi “nhìn” nhưng là các họ hình thái khác nhau. Câu tự gõ yêu cầu một dạng trong mục đang học; nguồn gốc/nghĩa gợi ý giúp phân biệt.</p></div></div><div class="card"><h3>Giải mã từ trong câu</h3><p><b>Portable devices are useful for field research.</b><br>port “mang” + -able “có thể” → portable = dễ mang theo, di động. Nghĩa toàn câu: thiết bị di động hữu ích cho nghiên cứu thực địa.</p><p><b>The team reconstructed the damaged bridge.</b><br>re- “lại” + construct “xây dựng” → reconstructed = đã tái dựng. -ed ở đây đánh dấu quá khứ, không thuộc gốc struct.</p><p><b>Deforestation threatens biodiversity.</b><br>de- gợi loại bỏ + forest → phá rừng; bio- “sự sống” + diversity “đa dạng” → đa dạng sinh học.</p></div><div class="card"><h3>Tiến độ & sao lưu</h3><p>“Đã nhớ” tăng một bậc; từ bậc 3 được đánh dấu “Đã thuộc”. Trả lời sai đưa mục về “Đang học” và hẹn ôn sau 10 phút. Trong thư viện, bấm trạng thái để tự đánh dấu đã thuộc hoặc đưa lại vào nhóm đang học. Lịch ôn chỉ hiển thị trong file, không gửi thông báo.</p><div class="actions"><button id="export">↓ Xuất tiến độ JSON</button><button id="import">↑ Nhập tiến độ JSON</button></div><input id="importFile" type="file" accept="application/json,.json" class="hidden"><p><small>Nhập tiến độ thay thế bản hiện tại. Nên xuất bản sao trước khi nhập. Trình duyệt hoặc vị trí file khác có thể không dùng chung tiến độ.</small></p></div><div class="card"><h3>Nội dung & nguồn tham khảo</h3><p>Biên soạn từ 82 mục trong tệp bạn gửi và hình “List of root words”, bổ sung 34 mục. Mục ante-/anti- được tách để phân biệt rõ; phần gốc cũ được chuẩn hóa biến thể và chú thích.</p><p>Các ghi chú quan trọng đã đối chiếu: <a href="https://www.etymonline.com/word/relevant" target="_blank" rel="noopener">relevant / levare</a> · <a href="https://www.etymonline.com/word/evolve" target="_blank" rel="noopener">evolve / volvere</a> · <a href="https://www.etymonline.com/word/preserve" target="_blank" rel="noopener">preserve / servare</a> · <a href="https://www.merriam-webster.com/dictionary/re-" target="_blank" rel="noopener">nghĩa của re-</a>.</p><p class="muted">Mỗi mục có liên kết tra từ ví dụ trên Etymonline để đọc thêm; các liên kết này là đường tra cứu, không có nghĩa toàn bộ 451 từ đã được kiểm chứng riêng từng trang. Giải thích tiếng Việt và bài luyện được biên soạn cho việc tự học.</p></div></div>`}
$('#group').innerHTML+=GROUPS.slice(1).map((x,i)=>`<option value="${i+1}">${i+1} · ${x}</option>`).join('');
function setTab(t){tab=t;queue=[];render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.star){const s=item(b.dataset.star);s.star=!s.star;save();b.textContent=s.star?'★':'☆';b.setAttribute('aria-pressed',s.star);if(tab==='library'&&$('#status').value==='star')render();return}if(b.dataset.known){let d=DATA.find(x=>x.id==b.dataset.known),s=item(d.id);s.level=s.level>=3?1:3;s.due=Date.now()+(s.level===3?7*86400000:0);save();render();return}if(b.dataset.learn){tab='flash';render();start(false,[DATA.find(x=>x.id==b.dataset.learn)]);return}if(b.dataset.choice!==undefined){grade(choices[+b.dataset.choice].id===queue[idx].id);return}switch(b.id){case'clear':['search','priority','group','status'].forEach(k=>$('#'+k).value='');render();break;case'start':start();break;case'dueStart':start(true);break;case'flip':revealFlash();break;case'again':case'remember':schedule(queue[idx],b.id==='remember');idx++;nextCard();break;case'check':check();break;case'showAnswer':grade(false);break;case'hint':hinted=true;$('#hintText').textContent='Bắt đầu bằng: '+queue[idx].aliases[0].slice(0,2)+'… · Lượt này không tính điểm.';break;case'next':idx++;nextCard();break;case'end':finish();break;case'restart':render();break;case'export':{const blob=new Blob([JSON.stringify({schema:'root-atlas-v1',state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='root-atlas-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'import':$('#importFile').click();break}});
document.addEventListener('input',e=>{if(e.target.dataset.note){item(e.target.dataset.note).note=e.target.value;save()}});
['priority','group','status'].forEach(k=>$('#'+k).addEventListener('change',render));$('#search').addEventListener('input',render);
document.addEventListener('change',async e=>{if(e.target.id!=='importFile'||!e.target.files[0])return;try{const file=e.target.files[0];if(file.size>2000000)throw Error();const x=JSON.parse(await file.text());if(x.schema!==KEY||!x.state||!x.state.items||!Number.isInteger(x.state.attempts)||!Number.isInteger(x.state.correct)||x.state.correct<0||x.state.attempts<x.state.correct)throw Error();const clean={items:{},attempts:x.state.attempts,correct:x.state.correct};for(const d of DATA){const s=x.state.items[d.id];if(!s)continue;if(!Number.isInteger(s.level)||s.level<0||s.level>6||!Number.isFinite(s.due)||s.due<0||!Number.isInteger(s.wrong)||s.wrong<0||typeof s.star!=='boolean'||typeof s.note!=='string')throw Error();clean.items[d.id]={level:s.level,due:s.due,wrong:s.wrong,star:s.star,note:s.note.slice(0,10000)}}state=clean;save();render();toast('Đã nhập tiến độ.')}catch(err){toast('File tiến độ không hợp lệ. Dữ liệu hiện tại được giữ nguyên.')}});
document.addEventListener('keydown',e=>{if(e.target.matches('textarea,select')||!queue.length)return;if(e.key==='Enter'){if(e.target.matches('button,a,summary')&&!e.target.disabled)return;e.preventDefault();if(tab==='flash'){if(!revealed)revealFlash();else toast('Chọn 1: Chưa nhớ hoặc 2: Đã nhớ để ghi tiến độ.')}else if(answered){idx++;nextCard()}else if(qdir==='reverse')check();else grade(false)}else if(!e.target.matches('input')&&tab==='flash'&&revealed&&['1','2'].includes(e.key)){schedule(queue[idx],e.key==='2');idx++;nextCard()}else if(!e.target.matches('input')&&tab==='quiz'&&!answered&&qdir==='forward'&&/^[1-4]$/.test(e.key)){grade(choices[Number(e.key)-1].id===queue[idx].id)}});
render();
</script></body></html>
