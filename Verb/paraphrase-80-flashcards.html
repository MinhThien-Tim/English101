<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>80+ Cụm Chữa Yếu Paraphrase — Flashcards</title>
<style>
  :root{
    --navy:#1b2a52;
    --navy-deep:#0f1a36;
    --red:#b3261e;
    --accent:#3a6df0;
    --paper:#f5f3ee;
    --card:#ffffff;
    --ink:#1c1f2a;
    --muted:#6b7185;
    --line:#e3e0d6;
    --good:#2f8f5b;
    --bad:#c0463d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Georgia',serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px;}
  header{margin-bottom:20px;}
  h1{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-weight:800;
    letter-spacing:-0.02em;
    font-size:clamp(22px,5.5vw,32px);
    color:var(--navy-deep);
    margin:0 0 4px;
  }
  h1 .num{color:var(--red);}
  .sub{
    font-family:'Helvetica Neue',Arial,sans-serif;
    color:var(--muted);
    font-size:14px;
    margin-bottom:18px;
  }
  .rangebar{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .range-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--navy-deep);
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .range-btn.active{
    background:var(--navy-deep);
    color:#fff;
    border-color:var(--navy-deep);
  }
  .range-btn:hover:not(.active){border-color:var(--navy-deep);}

  .stats{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;color:var(--muted);margin-bottom:10px;
  }
  .progress-bar{
    height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px;
  }
  .progress-fill{height:100%;background:var(--red);transition:width .25s ease;}

  .card-stage{
    perspective:1400px;
    margin-bottom:20px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:300px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:16px;
    border:1px solid var(--line);
    background:var(--card);
    box-shadow:0 6px 24px rgba(15,26,54,0.08);
    padding:32px 30px;
    display:flex;flex-direction:column;
    justify-content:center;
  }
  .face.back{transform:rotateY(180deg);background:var(--navy-deep);color:#f5f3ee;border-color:var(--navy-deep);}
  .stt{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;letter-spacing:.08em;
    color:#fff;background:var(--red);
    display:inline-block;padding:3px 10px;border-radius:20px;
    margin-bottom:16px;font-weight:700;width:fit-content;
  }
  .term{
    font-size:clamp(26px,5.5vw,36px);
    font-weight:700;color:var(--navy-deep);line-height:1.15;
  }
  .hint{
    margin-top:14px;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12.5px;color:var(--muted);
  }
  .meaning{
    font-size:clamp(19px,4.4vw,24px);
    font-weight:700;margin-bottom:16px;color:#fff;
  }
  .replace-label{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:#9db4f5;margin-bottom:8px;font-weight:700;
  }
  .replace-list{
    list-style:none;padding:0;margin:0 0 4px;
  }
  .replace-list li{
    font-size:17px;line-height:1.7;color:#e8eaf5;
    position:relative;padding-left:16px;
  }
  .replace-list li::before{
    content:"›";position:absolute;left:0;color:#7d97e8;font-weight:700;
  }

  .controls{
    display:flex;gap:10px;justify-content:center;align-items:center;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .btn{
    border:none;border-radius:10px;padding:12px 18px;font-size:14px;
    cursor:pointer;font-weight:600;
    background:var(--card);border:1px solid var(--line);color:var(--navy-deep);
  }
  .btn:hover{border-color:var(--navy-deep);}
  .btn.primary{background:var(--navy-deep);color:#fff;border-color:var(--navy-deep);}
  .btn.primary:hover{background:var(--navy);}

  .know-row{
    display:flex;gap:10px;justify-content:center;margin-top:16px;
  }
  .know-btn{
    flex:1;max-width:220px;padding:13px;border-radius:10px;border:none;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:14px;cursor:pointer;
  }
  .know-btn.no{background:#fbe9e7;color:var(--bad);}
  .know-btn.yes{background:#e5f4ec;color:var(--good);}
  .know-btn:hover{filter:brightness(0.95);}

  footer{
    text-align:center;margin-top:28px;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;color:var(--muted);
  }
  .shuffle-note{
    text-align:center;font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;color:var(--muted);margin-top:10px;
  }
  @media (max-width:480px){
    .face{padding:24px 20px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="num">80+</span> CỤM CHỮA YẾU PARAPHRASE</h1>
    <div class="sub">80 từ cơ bản · Từ thay thế nâng cao · Flashcard lật để ôn tập</div>
  </header>

  <div class="rangebar" id="rangeBar"></div>

  <div class="stats">
    <span id="counter">1 / 80</span>
    <span id="scoreDisplay">Đã thuộc: 0</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card-stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="stt" id="sttFront">#1</div>
        <div class="term" id="termFront">—</div>
        <div class="hint">Chạm vào thẻ để xem từ thay thế</div>
      </div>
      <div class="face back">
        <div class="stt" id="sttBack" style="background:#3a6df0;">#1</div>
        <div class="meaning" id="meaningBack">—</div>
        <div class="replace-label">Từ thay thế nâng cao</div>
        <ul class="replace-list" id="replaceBack"></ul>
      </div>
    </div>
  </div>

  <div class="know-row">
    <button class="know-btn no" id="btnNo">Chưa thuộc</button>
    <button class="know-btn yes" id="btnYes">Đã thuộc ✓</button>
  </div>

  <div class="controls" style="margin-top:18px;">
    <button class="btn" id="btnPrev">← Trước</button>
    <button class="btn" id="btnShuffle">🔀 Xáo trộn</button>
    <button class="btn primary" id="btnNext">Tiếp →</button>
  </div>
  <div class="shuffle-note">Phím tắt: Space/Enter để lật · ← → để chuyển thẻ</div>

  <footer>The Real IELTS · 80+ Cụm chữa yếu Paraphrase</footer>
</div>

<script>
const DATA = [
  {stt:1, term:"I think", meaning:"Tôi cho rằng; Theo quan điểm của tôi; Tôi hoàn toàn tin rằng", rep:["From my perspective","I firmly believe that"]},
  {stt:2, term:"People think", meaning:"Người ta tin rằng; Mọi người thường cho rằng", rep:["It is widely believed that","It is commonly assumed that"]},
  {stt:3, term:"I agree", meaning:"Tôi đồng ý với quan điểm rằng…", rep:["I am in agreement with the view that"]},
  {stt:4, term:"I disagree", meaning:"Tôi không đồng tình; Tôi không bị thuyết phục rằng…", rep:["I am not convinced that","I remain unconvinced that"]},
  {stt:5, term:"For example", meaning:"Ví dụ; Điều này có thể được minh họa bằng…", rep:["This is exemplified by","This can be illustrated by"]},
  {stt:6, term:"Because", meaning:"Bởi vì; Do thực tế rằng…", rep:["Due to the fact that","Owing to the fact that"]},
  {stt:7, term:"Overall", meaning:"Nhìn chung; Xét trên mọi khía cạnh", rep:["All things considered","Taking everything into account"]},
  {stt:8, term:"But", meaning:"Tuy nhiên; Dẫu vậy; Mặt khác", rep:["However","Nevertheless","On the other hand"]},
  {stt:9, term:"So", meaning:"Vì vậy; Do đó; Vì thế", rep:["Therefore / Thus / Hence"]},
  {stt:10, term:"Good", meaning:"Tốt; Có lợi; Mang lại lợi ích", rep:["Beneficial","Advantageous","Favorable"]},
  {stt:11, term:"Bad", meaning:"Xấu; Có hại; Gây ảnh hưởng tiêu cực", rep:["Detrimental","Harmful","Adverse"]},
  {stt:12, term:"Important", meaning:"Quan trọng; Thiết yếu; Có ý nghĩa rất lớn", rep:["Significant","Crucial","Of great importance"]},
  {stt:13, term:"Big", meaning:"Lớn; Đáng kể; Rất lớn", rep:["Substantial","Considerable","Tremendous"]},
  {stt:14, term:"Small", meaning:"Nhỏ; Không đáng kể; Rất ít", rep:["Minor","Insignificant","Negligible"]},
  {stt:15, term:"Many", meaning:"Nhiều; Một số lượng lớn; Một tỷ lệ đáng kể", rep:["A large number of","A considerable proportion of"]},
  {stt:16, term:"A lot of", meaning:"Rất nhiều; Dồi dào; Một lượng lớn", rep:["Numerous","A great deal of","An abundance of"]},
  {stt:17, term:"Nowadays", meaning:"Ngày nay; Trong xã hội hiện đại", rep:["In contemporary society","In today's world"]},
  {stt:18, term:"Always", meaning:"Luôn luôn; Một cách thường xuyên; Một cách nhất quán", rep:["On a regular basis","Consistently / Invariably"]},
  {stt:19, term:"Sometimes", meaning:"Đôi khi; Trong một số trường hợp; Thỉnh thoảng", rep:["On certain occasions","At times / Periodically"]},
  {stt:20, term:"In conclusion", meaning:"Kết luận lại; Tóm lại; Để tổng kết", rep:["To conclude","In summary","To recapitulate"]},
  {stt:21, term:"Fix", meaning:"Sửa chữa; Giải quyết; Khắc phục vấn đề", rep:["Resolve","Rectify","Remedy"]},
  {stt:22, term:"Cheap", meaning:"Rẻ; Có giá phải chăng; Tiết kiệm chi phí", rep:["Affordable","Inexpensive","Cost-effective"]},
  {stt:23, term:"Expensive", meaning:"Đắt; Tốn kém; Có giá rất cao", rep:["Costly","Pricey","Exorbitant"]},
  {stt:24, term:"Easy", meaning:"Dễ; Đơn giản; Không đòi hỏi nhiều công sức", rep:["Straightforward","Effortless","Undemanding"]},
  {stt:25, term:"Hard", meaning:"Khó; Mang tính thử thách; Gian nan", rep:["Challenging","Demanding","Arduous"]},
  {stt:26, term:"Really", meaning:"Thực sự; Cực kỳ; Đặc biệt", rep:["Extremely","Highly","Exceptionally"]},
  {stt:27, term:"Very", meaning:"Rất; Đáng kể; Ở mức độ cao", rep:["Remarkably","Considerably","Substantially"]},
  {stt:28, term:"More and more", meaning:"Ngày càng nhiều; Có xu hướng gia tăng", rep:["An increasing number of","A growing proportion of"]},
  {stt:29, term:"Less and less", meaning:"Ngày càng ít; Có xu hướng giảm dần", rep:["A declining number of","A diminishing proportion of"]},
  {stt:30, term:"Better", meaning:"Tốt hơn; Hiệu quả hơn; Có lợi hơn", rep:["Superior","More effective","More beneficial"]},
  {stt:31, term:"Worse", meaning:"Tệ hơn; Kém hơn; Gây hại hơn", rep:["Inferior","More harmful","More detrimental"]},
  {stt:32, term:"Enough", meaning:"Đủ; Đầy đủ; Dồi dào", rep:["Sufficient","Adequate","Ample"]},
  {stt:33, term:"Not enough", meaning:"Không đủ; Thiếu; Chưa đáp ứng yêu cầu", rep:["Insufficient","Inadequate","Lacking"]},
  {stt:34, term:"Change", meaning:"Thay đổi; Biến đổi; Điều chỉnh", rep:["Alter","Transform","Modify"]},
  {stt:35, term:"Keep", meaning:"Giữ; Duy trì; Bảo tồn", rep:["Maintain","Preserve","Retain"]},
  {stt:36, term:"Like", meaning:"Như; Chẳng hạn như; Cụ thể là", rep:["Such as","Namely","For instance"]},
  {stt:37, term:"Help", meaning:"Giúp; Hỗ trợ; Tạo điều kiện", rep:["Assist","Facilitate","Aid"]},
  {stt:38, term:"Get", meaning:"Có được; Đạt được; Thu được", rep:["Obtain","Acquire","Attain"]},
  {stt:39, term:"Give", meaning:"Cung cấp; Đem lại; Trao cho", rep:["Provide","Offer","Grant"]},
  {stt:40, term:"Make", meaning:"Tạo ra; Hình thành; Sản sinh", rep:["Create","Generate","Produce"]},
  {stt:41, term:"Show", meaning:"Thể hiện; Chứng minh; Minh họa", rep:["Demonstrate","Illustrate / Depict"]},
  {stt:42, term:"Need", meaning:"Cần; Đòi hỏi; Là điều cần thiết", rep:["Require; Necessitate","Be essential to"]},
  {stt:43, term:"Think about", meaning:"Cân nhắc; Suy xét; Tính đến", rep:["Consider; Reflect on","Take into account"]},
  {stt:44, term:"Use", meaning:"Sử dụng; Áp dụng; Vận dụng", rep:["Utilize; Employ","Apply"]},
  {stt:45, term:"Start", meaning:"Bắt đầu; Khởi đầu; Tiến hành", rep:["Commence; Initiate","Embark on"]},
  {stt:46, term:"Increase", meaning:"Tăng; Gia tăng", rep:["Rise; Grow","Escalate"]},
  {stt:47, term:"Decrease", meaning:"Giảm; Suy giảm", rep:["Decline; Diminish","Reduce"]},
  {stt:48, term:"Cause", meaning:"Gây ra; Dẫn đến", rep:["Lead to; Result in","Give rise to"]},
  {stt:49, term:"Result", meaning:"Kết quả; Hệ quả", rep:["Outcome","Consequence","Repercussion"]},
  {stt:50, term:"Improve", meaning:"Cải thiện; Nâng cao", rep:["Enhance; Boost","Strengthen"]},
  {stt:51, term:"Reduce", meaning:"Giảm bớt; Hạn chế", rep:["Minimize; Lessen","Curtail"]},
  {stt:52, term:"Solve", meaning:"Giải quyết; Xử lý", rep:["Address; Tackle","Overcome"]},
  {stt:53, term:"Problem", meaning:"Vấn đề; Thách thức", rep:["Issue; Challenge","Obstacle"]},
  {stt:54, term:"Advantage", meaning:"Lợi thế; Lợi ích", rep:["Benefit; Merit; Upside"]},
  {stt:55, term:"Disadvantage", meaning:"Nhược điểm; Hạn chế", rep:["Drawback","Downside","Limitation"]},
  {stt:56, term:"Improve skills", meaning:"Phát triển; Nâng cao kỹ năng", rep:["Develop; Enhance","Refine"]},
  {stt:57, term:"Important role", meaning:"Đóng vai trò quan trọng", rep:["Play a vital role","Be instrumental in"]},
  {stt:58, term:"Think", meaning:"Cho rằng", rep:["Hold the opinion that","Be of the opinion that"]},
  {stt:59, term:"Say", meaning:"Nói; Khẳng định", rep:["State","Assert","Claim"]},
  {stt:60, term:"Believe", meaning:"Tin rằng; Cho rằng", rep:["Maintain","Contend","Argue"]},
  {stt:61, term:"Know", meaning:"Biết; Nhận thức rằng", rep:["Be aware that","Recognize that"]},
  {stt:62, term:"Understand", meaning:"Hiểu", rep:["Comprehend","Grasp"]},
  {stt:63, term:"Want", meaning:"Mong muốn", rep:["Desire; Aspire to","Seek to"]},
  {stt:64, term:"Choose", meaning:"Lựa chọn", rep:["Opt for","Select"]},
  {stt:65, term:"Buy", meaning:"Mua", rep:["Purchase; Acquire"]},
  {stt:66, term:"Sell", meaning:"Bán", rep:["Market; Trade"]},
  {stt:67, term:"Build", meaning:"Xây dựng", rep:["Construct","Establish"]},
  {stt:68, term:"Destroy", meaning:"Phá hủy", rep:["Damage; Devastate","Demolish"]},
  {stt:69, term:"Protect", meaning:"Bảo vệ", rep:["Safeguard","Preserve","Shield"]},
  {stt:70, term:"Affect", meaning:"Ảnh hưởng", rep:["Influence","Impact","Shape"]},
  {stt:71, term:"Develop", meaning:"Phát triển", rep:["Evolve","Progress","Advance"]},
  {stt:72, term:"Happen", meaning:"Xảy ra", rep:["Occur","Take place"]},
  {stt:73, term:"Improve quality", meaning:"Nâng cao chất lượng", rep:["Enhance the quality of","Elevate"]},
  {stt:74, term:"Increase awareness", meaning:"Nâng cao nhận thức", rep:["Raise awareness","Promote awareness"]},
  {stt:75, term:"Support", meaning:"Ủng hộ", rep:["Advocate","Endorse / Back"]},
  {stt:76, term:"Oppose", meaning:"Phản đối", rep:["Object to","Resist","Be against"]},
  {stt:77, term:"Difficult", meaning:"Khó khăn; Phức tạp", rep:["Problematic","Complex","Complicated"]},
  {stt:78, term:"Possible", meaning:"Khả thi; Có thể thực hiện", rep:["Feasible","Viable","Achievable"]},
  {stt:79, term:"Necessary", meaning:"Cần thiết", rep:["Essential","Indispensable","Imperative"]},
  {stt:80, term:"In my opinion", meaning:"Theo quan điểm của tôi", rep:["As far as I am concerned","From my standpoint"]},
];

const RANGES = [
  {label:"Tất cả", from:1, to:80},
  {label:"1–20", from:1, to:20},
  {label:"21–40", from:21, to:40},
  {label:"41–60", from:41, to:60},
  {label:"61–80", from:61, to:80},
];
let activeRange = RANGES[0];
let deck = [...DATA.keys()];
let idx = 0;
let flipped = false;
let known = new Set();

const rangeBar = document.getElementById('rangeBar');
const card = document.getElementById('card');
const sttFront = document.getElementById('sttFront');
const termFront = document.getElementById('termFront');
const sttBack = document.getElementById('sttBack');
const meaningBack = document.getElementById('meaningBack');
const replaceBack = document.getElementById('replaceBack');
const counter = document.getElementById('counter');
const scoreDisplay = document.getElementById('scoreDisplay');
const progressFill = document.getElementById('progressFill');

function buildRangeBar(){
  rangeBar.innerHTML = '';
  RANGES.forEach(r=>{
    const b = document.createElement('button');
    b.className = 'range-btn' + (r===activeRange ? ' active' : '');
    b.textContent = r.label;
    b.onclick = ()=>{ activeRange = r; rebuildDeck(); };
    rangeBar.appendChild(b);
  });
}

function rebuildDeck(){
  deck = DATA.map((d,i)=>i).filter(i => DATA[i].stt >= activeRange.from && DATA[i].stt <= activeRange.to);
  idx = 0;
  flipped = false;
  card.classList.remove('flipped');
  buildRangeBar();
  render();
}

function render(){
  if(deck.length === 0){
    termFront.textContent = "Hết thẻ";
    meaningBack.textContent = "";
    replaceBack.innerHTML = "";
    counter.textContent = "0 / 0";
    return;
  }
  const item = DATA[deck[idx]];
  sttFront.textContent = '#' + item.stt;
  termFront.textContent = item.term;
  sttBack.textContent = '#' + item.stt;
  meaningBack.textContent = item.meaning;
  replaceBack.innerHTML = item.rep.map(r=>`<li>${r}</li>`).join('');
  counter.textContent = `${idx+1} / ${deck.length}`;
  scoreDisplay.textContent = `Đã thuộc: ${known.size} / ${DATA.length}`;
  progressFill.style.width = `${(known.size/DATA.length)*100}%`;
}

function flip(){
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function next(){
  flipped = false;
  card.classList.remove('flipped');
  idx = (idx+1) % deck.length;
  render();
}
function prev(){
  flipped = false;
  card.classList.remove('flipped');
  idx = (idx-1+deck.length) % deck.length;
  render();
}
function shuffle(){
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]] = [deck[j],deck[i]];
  }
  idx = 0;
  flipped = false;
  card.classList.remove('flipped');
  render();
}

card.addEventListener('click', flip);
document.getElementById('btnNext').addEventListener('click', next);
document.getElementById('btnPrev').addEventListener('click', prev);
document.getElementById('btnShuffle').addEventListener('click', shuffle);
document.getElementById('btnYes').addEventListener('click', ()=>{
  known.add(deck[idx]);
  render();
  next();
});
document.getElementById('btnNo').addEventListener('click', ()=>{
  known.delete(deck[idx]);
  render();
  next();
});

document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); flip(); }
  if(e.code === 'ArrowRight'){ next(); }
  if(e.code === 'ArrowLeft'){ prev(); }
});

buildRangeBar();
render();
</script>
<script src="../assets/keyboard-pronunciation.js?v=20260915-l2"></script>
<script>EnglishPronunciation.register({getCurrentText:()=>DATA[deck[idx]]?.term||DATA[deck[idx]]?.word||'',lang:'en-US',rate:.88});</script>
</body>
</html>
