itle": "Ôn tập tổng hợp và áp dụng", "summary": "Kết nối các quy tắc; giải thích quyết định thay vì chỉ nhớ đáp án.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Điểm nhớ<\/th><th>Kiểm tra nhanh<\/th><\/tr><\/thead><tbody><tr><td>Hòa hợp<\/td><td>Tìm trung tâm chủ ngữ; phân biệt each, a number of, the number of; xét danh từ sau no/all/none.<\/td><\/tr><tr><td>Mạo từ<\/td><td>Đếm được + số + xác định + âm đầu; tránh tuyệt đối hóa ngoại lệ.<\/td><\/tr><tr><td>Thì<\/td><td>Xét thời điểm, góc nhìn và ý nghĩa; tín hiệu thời gian chỉ gợi ý.<\/td><\/tr><tr><td>Giới từ<\/td><td>Học nghĩa quan hệ và cụm cố định; to có thể là giới từ hoặc dấu hiệu nguyên mẫu.<\/td><\/tr><tr><td>Bị động<\/td><td>Be + V3; chia be phù hợp; by là tùy chọn.<\/td><\/tr><tr><td>Tường thuật<\/td><td>Đúng người, thời điểm và trật tự; lùi thì theo ngữ cảnh/yêu cầu.<\/td><\/tr><tr><td>Modifiers<\/td><td>Đặt theo phạm vi nghĩa: only Lan / only called / called only Nam.<\/td><\/tr><tr><td>Enough<\/td><td>Adj/Adv + enough; enough + N: old enough, quickly enough, enough time.<\/td><\/tr><tr><td>Liên từ<\/td><td>And thêm; but đối lập; or lựa chọn; because lý do; so kết quả; although nhượng bộ; if điều kiện.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Luyện chủ động<\/b><div>Sau mỗi câu: nói ngắn vì sao dùng dạng này → đổi một chi tiết ngữ cảnh → viết lại câu. Ví dụ đổi every day thành yesterday rồi đổi goes thành went.<\/div><\/aside><p>Các chương 11–18 bổ sung nền tảng cấu trúc câu, trợ động từ, lượng từ, so sánh, verb patterns, mệnh đề, điều kiện và liên kết câu. Bạn có thể học theo thứ tự này trước rồi quay lại bài tổng hợp.<\/p>", "questions": [{"type": "mc", "q": "Dùng tương lai hoàn thành: By the time she arrives, we ___.", "options": ["already leave", "will already leave", "will have already left", "already left"], "answers": ["will have already left"], "explain": "Will have + V3 left, already đặt giữa have và left trong đáp án này.", "optionNotes": {"already leave": "Will have + V3 left, already đặt giữa have và left trong đáp án này.", "will already leave": "Will have + V3 left, already đặt giữa have và left trong đáp án này.", "will have already left": "Will have + V3 left, already đặt giữa have và left trong đáp án này.", "already left": "Will have + V3 left, already đặt giữa have và left trong đáp án này."}, "id": "c10q1"}, {"type": "mc", "q": "Dùng hiện tại đơn bị động: Each of the students ___ given a certificate.", "options": ["is", "are", "were", "have been"], "answers": ["is"], "explain": "Each số ít; hiện tại đơn bị động → is given.", "optionNotes": {"is": "Each số ít; hiện tại đơn bị động → is given.", "are": "Each số ít; hiện tại đơn bị động → is given.", "were": "Each số ít; hiện tại đơn bị động → is given.", "have been": "Each số ít; hiện tại đơn bị động → is given."}, "id": "c10q2"}, {"type": "mc", "q": "She is ___ honest and hardworking employee. (một nhân viên, chưa xác định)", "options": ["a", "an", "the", "∅"], "answers": ["an"], "explain": "Xét âm đầu honest, không xét employee ở xa; honest có h câm.", "optionNotes": {"a": "Xét âm đầu honest, không xét employee ở xa; honest có h câm.", "an": "Xét âm đầu honest, không xét employee ở xa; honest có h câm.", "the": "Xét âm đầu honest, không xét employee ở xa; honest có h câm.", "∅": "Xét âm đầu honest, không xét employee ở xa; honest có h câm."}, "id": "c10q3"}, {"type": "mc", "q": "He is good ___ mathematics.", "options": ["in", "at", "on", "with"], "answers": ["at"], "explain": "Good at + môn học/kỹ năng.", "optionNotes": {"in": "Good at + môn học/kỹ năng.", "at": "Good at + môn học/kỹ năng.", "on": "Good at + môn học/kỹ năng.", "with": "Good at + môn học/kỹ năng."}, "id": "c10q4"}, {"type": "mc", "q": "They built this house. →", "options": ["This house is built by them.", "This house was built by them.", "This house has been built by them.", "This house is being built by them."], "answers": ["This house was built by them."], "explain": "Built trong câu gốc là quá khứ đơn; bị động was built giữ thì.", "optionNotes": {"This house is built by them.": "Built trong câu gốc là quá khứ đơn; bị động was built giữ thì.", "This house was built by them.": "Built trong câu gốc là quá khứ đơn; bị động was built giữ thì.", "This house has been built by them.": "Built trong câu gốc là quá khứ đơn; bị động was built giữ thì.", "This house is being built by them.": "Built trong câu gốc là quá khứ đơn; bị động was built giữ thì."}, "id": "c10q5"}, {"type": "mc", "q": "Lùi thì, cô ấy nói với tôi: “I will help you,” she said. →", "options": ["She said that she will help me.", "She said that she would help me.", "She said that she helps me.", "She said she help me."], "answers": ["She said that she would help me."], "explain": "Will → would theo yêu cầu; you chỉ tôi → me.", "optionNotes": {"She said that she will help me.": "Will → would theo yêu cầu; you chỉ tôi → me.", "She said that she would help me.": "Will → would theo yêu cầu; you chỉ tôi → me.", "She said that she helps me.": "Will → would theo yêu cầu; you chỉ tôi → me.", "She said she help me.": "Will → would theo yêu cầu; you chỉ tôi → me."}, "id": "c10q6"}, {"type": "mc", "q": "A person who donates substantial wealth to charitable causes:", "options": ["a philanthropist", "a polyglot", "an introvert", "an insomniac"], "answers": ["a philanthropist"], "explain": "Philanthropist gắn với hỗ trợ phúc lợi xã hội bằng tiền/nguồn lực.", "optionNotes": {"a philanthropist": "Philanthropist gắn với hỗ trợ phúc lợi xã hội bằng tiền/nguồn lực.", "a polyglot": "Philanthropist gắn với hỗ trợ phúc lợi xã hội bằng tiền/nguồn lực.", "an introvert": "Philanthropist gắn với hỗ trợ phúc lợi xã hội bằng tiền/nguồn lực.", "an insomniac": "Philanthropist gắn với hỗ trợ phúc lợi xã hội bằng tiền/nguồn lực."}, "id": "c10q7"}, {"type": "mc", "q": "The number of unemployed youths ___ increasing now.", "options": ["is", "are", "were", "have"], "answers": ["is"], "explain": "The number là số ít; hiện tại → is increasing.", "optionNotes": {"is": "The number là số ít; hiện tại → is increasing.", "are": "The number là số ít; hiện tại → is increasing.", "were": "The number là số ít; hiện tại → is increasing.", "have": "The number là số ít; hiện tại → is increasing."}, "id": "c10q8"}, {"type": "error", "q": "Văn phong trang trọng: Neither of them <u>have<\/u> completed the assignment.", "answers": ["has"], "explain": "Neither of dùng số ít trong dạng trang trọng được yêu cầu.", "id": "c10q9"}, {"type": "error", "q": "She has been living here <u>since<\/u> five years.", "answers": ["for"], "explain": "Five years là thời lượng.", "id": "c10q10"}, {"type": "error", "q": "Lùi thì: He said that he <u>is<\/u> going to Paris the next day.", "answers": ["was"], "explain": "Theo yêu cầu lùi thì: is going → was going.", "id": "c10q11"}, {"type": "error", "q": "This is the <u>most best<\/u> solution.", "answers": ["best"], "explain": "Best đã là dạng so sánh nhất; không thêm most.", "id": "c10q12"}, {"type": "error", "q": "The information <u>are<\/u> not accurate.", "answers": ["is"], "explain": "Information không đếm được → is.", "id": "c10q13"}, {"type": "error", "q": "I saw <u>a<\/u> elephant.", "answers": ["an"], "explain": "Elephant có âm đầu nguyên âm.", "id": "c10q14"}, {"type": "write", "q": "Bị động: The manager approved the proposal.", "answers": ["The proposal was approved by the manager."], "explain": "Quá khứ đơn bị động: was approved.", "id": "c10q15"}, {"type": "write", "q": "Lùi thì: He said, “I have finished my work.”", "answers": ["He said that he had finished his work."], "explain": "Have finished → had finished; my → his.", "id": "c10q16"}, {"type": "write", "q": "Bị động: They are building a new bridge.", "answers": ["A new bridge is being built.", "A new bridge is being built by them."], "explain": "Is being built giữ hiện tại tiếp diễn; tác nhân có thể bỏ.", "id": "c10q17"}, {"type": "write", "q": "Lùi thì: “Where do you live?” she asked me.", "answers": ["She asked me where I lived."], "explain": "Where + I + lived; không dùng did I live.", "id": "c10q18"}]}, {"id": "c11", "title": "Nền tảng: cấu trúc câu và từ loại", "summary": "Nhìn ra bộ khung S–V–O–C–A trong câu ngắn và dài.", "theory": "<p>Từ loại nói một từ thuộc nhóm nào; thành phần câu nói từ/cụm đó đang làm nhiệm vụ gì. Danh từ có thể làm chủ ngữ hoặc tân ngữ. Một mệnh đề cũng có thể làm chủ ngữ: <b>What she said<\/b> surprised me.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Ký hiệu<\/th><th>Chức năng<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>S — Subject<\/td><td>Chủ ngữ, điều được nói đến<\/td><td>The children laughed.<\/td><\/tr><tr><td>V — Verb<\/td><td>Động từ làm trung tâm vị ngữ<\/td><td>The children laughed.<\/td><\/tr><tr><td>O — Object<\/td><td>Tân ngữ do động từ chi phối<\/td><td>She opened the door.<\/td><\/tr><tr><td>C — Complement<\/td><td>Bổ ngữ mô tả/định danh chủ ngữ hoặc tân ngữ<\/td><td>She is tired. They made him captain.<\/td><\/tr><tr><td>A — Adverbial<\/td><td>Thông tin thời gian/nơi chốn/cách thức…<\/td><td>She works in Hanoi.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Mẫu<\/th><th>Ví dụ<\/th><th>Phân tích<\/th><\/tr><\/thead><tbody><tr><td>SV<\/td><td>Birds fly.<\/td><td>Không cần tân ngữ.<\/td><\/tr><tr><td>SVO<\/td><td>Lan reads books.<\/td><td>Books là tân ngữ.<\/td><\/tr><tr><td>SVC<\/td><td>Lan seems tired.<\/td><td>Tired mô tả Lan.<\/td><\/tr><tr><td>SVOO<\/td><td>Lan gave me a book.<\/td><td>Me người nhận; a book vật được trao.<\/td><\/tr><tr><td>SVOC<\/td><td>They made Lan happy.<\/td><td>Happy mô tả Lan.<\/td><\/tr><tr><td>SVOA<\/td><td>She put the bag on the table.<\/td><td>Put thường cần bổ ngữ vị trí; bỏ on the table làm câu chưa trọn ý.<\/td><\/tr><\/tbody><\/table><\/div><h3>Cụm từ, mệnh đề và động từ hữu hạn<\/h3><p>Cụm danh từ: the tall boy near the door. Mệnh đề hữu hạn: the boy who lives next door. Trong He wants to study, wants mang thì/ngôi; to study là nguyên mẫu. Trong She has been studying, has là trợ động từ hữu hạn; studying không tự biểu thị thì.<\/p><aside class=\"callout note\"><b>Đọc câu dài<\/b><div>The quality of the products that this company sells is excellent. Khung chính: The quality is excellent. Of the products bổ nghĩa quality; that this company sells bổ nghĩa products.<\/div><\/aside><h3>Từ loại theo chức năng<\/h3><p>A fast train: fast là tính từ. The train moves fast: fast là trạng từ. Không phải trạng từ nào cũng có -ly; friendly thường là tính từ. Trong bài word form, xác định chỗ trống bổ nghĩa cho danh từ, động từ hay cả mệnh đề trước khi chọn đuôi.<\/p>", "questions": [{"type": "mc", "q": "Trong “The quality of these products is excellent”, chủ ngữ trung tâm là:", "options": ["quality", "products", "excellent", "these"], "answers": ["quality"], "explain": "Of these products là cụm bổ nghĩa; quality điều khiển is.", "optionNotes": {"quality": "Of these products là cụm bổ nghĩa; quality điều khiển is.", "products": "Of these products là cụm bổ nghĩa; quality điều khiển is.", "excellent": "Of these products là cụm bổ nghĩa; quality điều khiển is.", "these": "Of these products là cụm bổ nghĩa; quality điều khiển is."}, "id": "c11q1"}, {"type": "mc", "q": "Trong “She seems tired”, tired là:", "options": ["Tân ngữ", "Bổ ngữ chủ ngữ", "Động từ chính", "Chủ ngữ"], "answers": ["Bổ ngữ chủ ngữ"], "explain": "Tired mô tả she qua linking verb seems; không phải đối tượng nhận hành động.", "optionNotes": {"Tân ngữ": "Tired mô tả she qua linking verb seems; không phải đối tượng nhận hành động.", "Bổ ngữ chủ ngữ": "Tired mô tả she qua linking verb seems; không phải đối tượng nhận hành động.", "Động từ chính": "Tired mô tả she qua linking verb seems; không phải đối tượng nhận hành động.", "Chủ ngữ": "Tired mô tả she qua linking verb seems; không phải đối tượng nhận hành động."}, "id": "c11q2"}, {"type": "mc", "q": "Câu nào có cấu trúc SVOO?", "options": ["She slept.", "She gave me a book.", "She is happy.", "She runs quickly."], "answers": ["She gave me a book."], "explain": "She=S, gave=V, me=O gián tiếp, a book=O trực tiếp.", "optionNotes": {"She slept.": "She=S, gave=V, me=O gián tiếp, a book=O trực tiếp.", "She gave me a book.": "She=S, gave=V, me=O gián tiếp, a book=O trực tiếp.", "She is happy.": "She=S, gave=V, me=O gián tiếp, a book=O trực tiếp.", "She runs quickly.": "She=S, gave=V, me=O gián tiếp, a book=O trực tiếp."}, "id": "c11q3"}, {"type": "fill", "q": "She is a careful ___. (drive → danh từ chỉ người)", "answers": ["driver"], "explain": "Sau a careful cần danh từ đếm được số ít: driver.", "id": "c11q4"}, {"type": "fill", "q": "She drives ___. (careful)", "answers": ["carefully"], "explain": "Bổ nghĩa cách lái xe cho drives → trạng từ carefully.", "id": "c11q5"}, {"type": "error", "q": "The list of names <u>are<\/u> on the desk.", "answers": ["is"], "explain": "List là trung tâm số ít; names không điều khiển động từ chính.", "id": "c11q6"}, {"type": "write", "q": "Tách khung chính của câu: The book that you gave me yesterday is useful.", "answers": ["The book is useful."], "explain": "That you gave me yesterday là mệnh đề quan hệ bổ nghĩa book.", "id": "c11q7"}, {"type": "write", "q": "Viết câu SVC với chủ ngữ “The soup” và tính từ “delicious”.", "answers": ["The soup tastes delicious."], "explain": "Có thể dùng is/smells/tastes delicious tùy nghĩa; delicious mô tả soup.", "id": "c11q8"}]}, {"id": "c12", "title": "Động từ chính, trợ động từ và linking verbs", "summary": "Biết khi nào cần be, do, have; phân biệt tính từ và trạng từ.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Vai trò<\/th><th>Ví dụ<\/th><th>Điểm cần nhớ<\/th><\/tr><\/thead><tbody><tr><td>Động từ chính<\/td><td>I love music. She has a car.<\/td><td>Mang nghĩa chính; have có thể là động từ chính.<\/td><\/tr><tr><td>Be trợ động từ<\/td><td>She is working. It was built.<\/td><td>Tiếp diễn: be + V-ing; bị động: be + V3.<\/td><\/tr><tr><td>Be động từ nối<\/td><td>She is tired. He is a teacher.<\/td><td>Liên kết chủ ngữ với bổ ngữ; không tự thêm V nguyên mẫu sau be.<\/td><\/tr><tr><td>Do trợ động từ<\/td><td>Does she work? She does not work.<\/td><td>Câu hỏi/phủ định hiện tại, quá khứ đơn với động từ thường; còn dùng nhấn mạnh: I do agree.<\/td><\/tr><tr><td>Have trợ động từ<\/td><td>She has finished.<\/td><td>Have/has/had + V3 tạo thể hoàn thành.<\/td><\/tr><tr><td>Modal<\/td><td>She can swim.<\/td><td>Can/must/should… + V nguyên mẫu, không thêm s.<\/td><\/tr><\/tbody><\/table><\/div><h3>Linking verbs và nghĩa của chúng<\/h3><p>Nhóm thường gặp: be, seem, appear, look, sound, smell, taste, feel, become, get, grow, turn, go, come, remain, stay, keep, prove. Không phải lúc nào các từ này cũng là động từ nối. She looks tired (tired mô tả cô ấy) khác She looks carefully at the photo (carefully mô tả cách nhìn). The soup tastes good khác She tastes the soup carefully.<\/p><aside class=\"callout warn\"><b>Đừng thêm be trước mọi động từ<\/b><div>I love music; không phải I am love music. I am loving this course có thể nhấn trải nghiệm đang rất thích ở hiện tại, nhưng không phải mẫu trung tính cho mọi nghĩa của love. I have loved… = have + V3; I have been working… = have + been + V-ing.<\/div><\/aside><p>Quá khứ: She was tired (tính từ); She worked (động từ thường); She was working (tiếp diễn); She was praised (bị động). Khi đặt câu hỏi với be, đảo be: Was she tired? Với worked: Did she work?<\/p><p>Enough đứng sau tính từ/trạng từ: old enough, quickly enough; đứng trước danh từ: enough time. Hard là tính từ hoặc trạng từ; hardly nghĩa gần như không, không phải “một cách chăm chỉ”.<\/p>", "questions": [{"type": "mc", "q": "She looks ___. (có vẻ mệt)", "options": ["tired", "tiredly", "tire", "tiringly"], "answers": ["tired"], "explain": "Looks ở nghĩa có vẻ là linking verb; cần tính từ tired mô tả she.", "optionNotes": {"tired": "Looks ở nghĩa có vẻ là linking verb; cần tính từ tired mô tả she.", "tiredly": "Looks ở nghĩa có vẻ là linking verb; cần tính từ tired mô tả she.", "tire": "Looks ở nghĩa có vẻ là linking verb; cần tính từ tired mô tả she.", "tiringly": "Looks ở nghĩa có vẻ là linking verb; cần tính từ tired mô tả she."}, "id": "c12q1"}, {"type": "mc", "q": "She looked ___ at the photograph. (nhìn cẩn thận)", "options": ["careful", "carefully", "care", "carefulness"], "answers": ["carefully"], "explain": "Looked at là hành động nhìn; trạng từ carefully diễn tả cách nhìn.", "optionNotes": {"careful": "Looked at là hành động nhìn; trạng từ carefully diễn tả cách nhìn.", "carefully": "Looked at là hành động nhìn; trạng từ carefully diễn tả cách nhìn.", "care": "Looked at là hành động nhìn; trạng từ carefully diễn tả cách nhìn.", "carefulness": "Looked at là hành động nhìn; trạng từ carefully diễn tả cách nhìn."}, "id": "c12q2"}, {"type": "mc", "q": "___ he work here? (hiện tại đơn)", "options": ["Is", "Does", "Has", "Was"], "answers": ["Does"], "explain": "Động từ thường work; câu hỏi hiện tại đơn với he dùng Does + he + work.", "optionNotes": {"Is": "Động từ thường work; câu hỏi hiện tại đơn với he dùng Does + he + work.", "Does": "Động từ thường work; câu hỏi hiện tại đơn với he dùng Does + he + work.", "Has": "Động từ thường work; câu hỏi hiện tại đơn với he dùng Does + he + work.", "Was": "Động từ thường work; câu hỏi hiện tại đơn với he dùng Does + he + work."}, "id": "c12q3"}, {"type": "fill", "q": "She ___ tired yesterday. (be)", "answers": ["was"], "explain": "Be quá khứ với she → was; tired là tính từ.", "id": "c12q4"}, {"type": "fill", "q": "He can ___ very well. (swim)", "answers": ["swim"], "explain": "Sau can dùng nguyên mẫu không to; không dùng swims.", "id": "c12q5"}, {"type": "error", "q": "I <u>am agree<\/u> with you.", "answers": ["agree"], "explain": "Agree là động từ chính; hiện tại đơn I agree. I do agree có thể nhấn mạnh nhưng đề sửa cấu trúc trung tính.", "id": "c12q6"}, {"type": "error", "q": "She doesn’t <u>likes<\/u> coffee.", "answers": ["like"], "explain": "Doesn’t đã mang ngôi/thì; động từ chính nguyên mẫu.", "id": "c12q7"}, {"type": "write", "q": "Viết hai câu với look: một câu diễn tả vẻ ngoài, một câu diễn tả hành động nhìn.", "answers": ["She looks tired. She looks carefully at the screen."], "explain": "Câu đầu dùng tính từ mô tả chủ ngữ; câu sau trạng từ mô tả hành động.", "id": "c12q8"}]}, {"id": "c13", "title": "Danh từ, đại từ và lượng từ", "summary": "Chọn lượng từ theo danh từ; theo dõi người/vật được nhắc đến.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Nhóm<\/th><th>Cấu trúc<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Đếm được<\/td><td>a/an + số ít; many/few/a few + số nhiều<\/td><td>a book; many books<\/td><\/tr><tr><td>Không đếm được<\/td><td>much/little/a little + N<\/td><td>much information; a little water<\/td><\/tr><tr><td>Few / Little<\/td><td>Nhấn ít, gần như không đủ<\/td><td>Few people came. We have little time.<\/td><\/tr><tr><td>A few / A little<\/td><td>Có một ít, thường nhìn tích cực/trung tính<\/td><td>A few friends came. We have a little time.<\/td><\/tr><tr><td>Some / Any<\/td><td>Some thường khẳng định/đề nghị; any thường hỏi/phủ định, hoặc nghĩa bất kỳ<\/td><td>Would you like some tea? I don’t have any tea. Any student can apply.<\/td><\/tr><tr><td>Another<\/td><td>Thêm một/khác, thường với N đếm được số ít<\/td><td>another book; another three days là mẫu mở rộng hợp lệ.<\/td><\/tr><tr><td>Other / Others / The other(s)<\/td><td>Other + N; others thay N; the other(s) xác định phần còn lại<\/td><td>other books; some left, others stayed; the other hand.<\/td><\/tr><\/tbody><\/table><\/div><p>Information, advice, furniture, equipment, luggage, news thường không đếm được. Dùng a piece of advice, two pieces of information. Danh từ có thể đổi cách đếm theo nghĩa: chicken là thịt gà hoặc một con gà; paper là giấy hoặc một bài báo/bài nghiên cứu.<\/p><h3>Đại từ<\/h3><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Chủ ngữ<\/th><th>Tân ngữ<\/th><th>Tính từ sở hữu<\/th><th>Đại từ sở hữu<\/th><th>Phản thân<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>me<\/td><td>my<\/td><td>mine<\/td><td>myself<\/td><\/tr><tr><td>you<\/td><td>you<\/td><td>your<\/td><td>yours<\/td><td>yourself / yourselves<\/td><\/tr><tr><td>he<\/td><td>him<\/td><td>his<\/td><td>his<\/td><td>himself<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>her<\/td><td>hers<\/td><td>herself<\/td><\/tr><tr><td>we<\/td><td>us<\/td><td>our<\/td><td>ours<\/td><td>ourselves<\/td><\/tr><tr><td>they<\/td><td>them<\/td><td>their<\/td><td>theirs<\/td><td>themselves<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Phản thân và nhấn mạnh<\/b><div>She hurt herself: chủ thể và đối tượng cùng người. She wrote it herself: tự cô ấy làm, nhấn mạnh. Yourself cho một người; yourselves cho nhiều người. We thông thường đi với ourselves, không phải ourself.<\/div><\/aside><p>They/their có thể chỉ một người khi chưa biết hoặc không cần nêu giới: Every student should bring their notebook. Không vì their mà đổi Every student thành động từ số nhiều.<\/p>", "questions": [{"type": "mc", "q": "I need ___ advice.", "options": ["an", "a few", "some", "many"], "answers": ["some"], "explain": "Advice không đếm được; some advice hoặc a piece of advice.", "optionNotes": {"an": "Advice không đếm được; some advice hoặc a piece of advice.", "a few": "Advice không đếm được; some advice hoặc a piece of advice.", "some": "Advice không đếm được; some advice hoặc a piece of advice.", "many": "Advice không đếm được; some advice hoặc a piece of advice."}, "id": "c13q1"}, {"type": "mc", "q": "We have ___ time, so we can take a short break. (có một ít)", "options": ["a few", "a little", "many", "few"], "answers": ["a little"], "explain": "Time không đếm được; a little nhấn còn một ít. A few/few/many đi với danh từ đếm được số nhiều.", "optionNotes": {"a few": "Time không đếm được; a little nhấn còn một ít. A few/few/many đi với danh từ đếm được số nhiều.", "a little": "Time không đếm được; a little nhấn còn một ít. A few/few/many đi với danh từ đếm được số nhiều.", "many": "Time không đếm được; a little nhấn còn một ít. A few/few/many đi với danh từ đếm được số nhiều.", "few": "Time không đếm được; a little nhấn còn một ít. A few/few/many đi với danh từ đếm được số nhiều."}, "id": "c13q2"}, {"type": "mc", "q": "I have two pens. One is blue; ___ is red.", "options": ["another", "other", "the other", "others"], "answers": ["the other"], "explain": "Trong hai chiếc, chiếc còn lại được xác định → the other.", "optionNotes": {"another": "Trong hai chiếc, chiếc còn lại được xác định → the other.", "other": "Trong hai chiếc, chiếc còn lại được xác định → the other.", "the other": "Trong hai chiếc, chiếc còn lại được xác định → the other.", "others": "Trong hai chiếc, chiếc còn lại được xác định → the other."}, "id": "c13q3"}, {"type": "fill", "q": "These books belong to me. They are ___.", "answers": ["mine"], "explain": "Mine đứng độc lập thay my books; my cần danh từ theo sau.", "id": "c13q4"}, {"type": "fill", "q": "You two should introduce ___.", "answers": ["yourselves"], "explain": "You two là hai người → yourselves.", "id": "c13q5"}, {"type": "error", "q": "She gave me <u>an advice<\/u>.", "answers": ["some advice", "a piece of advice"], "explain": "Advice không đếm được; không dùng an advice.", "id": "c13q6"}, {"type": "error", "q": "We enjoyed <u>ourself<\/u> at the party.", "answers": ["ourselves"], "explain": "We → ourselves.", "id": "c13q7"}, {"type": "write", "q": "Viết một câu với few friends và một câu với a few friends để thể hiện sắc thái.", "answers": ["I have few friends, so I often feel lonely. I have a few friends I can rely on."], "explain": "Few nhấn sự ít ỏi; a few nhấn vẫn có một số. Câu khác đúng ngữ cảnh cũng được.", "id": "c13q8"}]}, {"id": "c14", "title": "So sánh hơn, nhất và bằng", "summary": "So sánh cùng loại đối tượng; nhận biết mức độ và số lượng.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Dạng<\/th><th>Cấu trúc<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Hơn — tính từ ngắn thường gặp<\/td><td>Adj-er + than<\/td><td>taller than; bigger than; happier than<\/td><\/tr><tr><td>Hơn — tính từ dài thường gặp<\/td><td>more + Adj + than<\/td><td>more useful than; more expensive than<\/td><\/tr><tr><td>Nhất<\/td><td>the + Adj-est / most + Adj<\/td><td>the tallest; the most useful<\/td><\/tr><tr><td>Bằng<\/td><td>as + Adj/Adv + as<\/td><td>as tall as; as quickly as<\/td><\/tr><tr><td>Không bằng<\/td><td>not as/so + Adj/Adv + as<\/td><td>not as expensive as<\/td><\/tr><tr><td>Kém hơn<\/td><td>less + Adj + than<\/td><td>less useful than<\/td><\/tr><tr><td>Nhấn mạnh hơn<\/td><td>much/far/a lot/even/a little + comparative<\/td><td>much better; a little cheaper<\/td><\/tr><tr><td>Thay đổi tăng dần<\/td><td>comparative and comparative<\/td><td>colder and colder; more and more useful<\/td><\/tr><tr><td>Hai thay đổi liên quan<\/td><td>the + comparative…, the + comparative…<\/td><td>The more you practise, the easier it becomes.<\/td><\/tr><\/tbody><\/table><\/div><p>Bất quy tắc: good/well → better → best; bad/badly → worse → worst; many/much → more → most; little (lượng) → less → least. Farther/further đều có thể nói khoảng cách; further còn nghĩa thêm nữa. Một số tính từ hai âm tiết chấp nhận hai dạng, như simpler/more simple tùy cách dùng; không chỉ đếm chữ để quyết định.<\/p><aside class=\"callout warn\"><b>Lỗi dễ gặp<\/b><div>More better và most best là so sánh kép sai. Very better không phải cách nhấn mạnh chuẩn; dùng much better. Fewer thường với danh từ đếm được số nhiều; less với lượng không đếm được, nhưng less có những cách dùng chuẩn với số đo/thời gian.<\/div><\/aside><h3>So sánh cho đúng đối tượng<\/h3><p>My salary is higher than hers (lương so với lương). Không viết My salary is higher than her nếu đang so mức lương. The climate here is warmer than that in Hanoi: that thay the climate. Trong hai đối tượng thường dùng the better of the two, không cần dùng so sánh nhất.<\/p><p>Chính tả: big → bigger (gấp đôi phụ âm cuối theo mẫu); happy → happier; large → larger. Với trạng từ -ly thường dùng more/most: more carefully.<\/p>", "questions": [{"type": "mc", "q": "This book is ___ than that one. (hữu ích hơn)", "options": ["useful", "more useful", "most useful", "usefully"], "answers": ["more useful"], "explain": "So sánh hơn với useful: more useful than.", "optionNotes": {"useful": "So sánh hơn với useful: more useful than.", "more useful": "So sánh hơn với useful: more useful than.", "most useful": "So sánh hơn với useful: more useful than.", "usefully": "So sánh hơn với useful: more useful than."}, "id": "c14q1"}, {"type": "mc", "q": "She is ___ student in the class. (cao nhất)", "options": ["taller", "the tallest", "more tall", "as tall"], "answers": ["the tallest"], "explain": "So sánh nhất trong một lớp: the tallest.", "optionNotes": {"taller": "So sánh nhất trong một lớp: the tallest.", "the tallest": "So sánh nhất trong một lớp: the tallest.", "more tall": "So sánh nhất trong một lớp: the tallest.", "as tall": "So sánh nhất trong một lớp: the tallest."}, "id": "c14q2"}, {"type": "mc", "q": "This test is ___ easier than the last one. (dễ hơn nhiều)", "options": ["very", "much", "many", "most"], "answers": ["much"], "explain": "Much bổ nghĩa cho comparative easier; very không đứng trực tiếp trước easier trong cấu trúc này.", "optionNotes": {"very": "Much bổ nghĩa cho comparative easier; very không đứng trực tiếp trước easier trong cấu trúc này.", "much": "Much bổ nghĩa cho comparative easier; very không đứng trực tiếp trước easier trong cấu trúc này.", "many": "Much bổ nghĩa cho comparative easier; very không đứng trực tiếp trước easier trong cấu trúc này.", "most": "Much bổ nghĩa cho comparative easier; very không đứng trực tiếp trước easier trong cấu trúc này."}, "id": "c14q3"}, {"type": "fill", "q": "He runs as ___ as his brother. (fast)", "answers": ["fast"], "explain": "As + dạng gốc của tính từ/trạng từ + as; không dùng faster.", "id": "c14q4"}, {"type": "fill", "q": "There are ___ cars today than yesterday. (ít hơn, dùng fewer/less)", "answers": ["fewer"], "explain": "Cars đếm được số nhiều; mẫu chuẩn dùng fewer.", "id": "c14q5"}, {"type": "error", "q": "This is <u>more better<\/u> than mine.", "answers": ["better"], "explain": "Better đã là so sánh hơn.", "id": "c14q6"}, {"type": "error", "q": "My salary is higher than <u>her<\/u>. (so lương của hai người)", "answers": ["hers"], "explain": "Hers = her salary; hai vế cùng so mức lương.", "id": "c14q7"}, {"type": "write", "q": "Hoàn thành ý: Càng luyện tập, bạn càng tự tin.", "answers": ["The more you practise, the more confident you become."], "explain": "The + comparative ở cả hai mệnh đề; practice là chính tả động từ Anh–Mỹ cũng hợp lệ.", "id": "c14q8"}]}, {"id": "c15", "title": "Verb patterns: to-V, V-ing và V nguyên mẫu", "summary": "Học mẫu theo động từ; hiểu các cặp đổi nghĩa.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Mẫu<\/th><th>Động từ/cụm thường gặp<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>V + to-V<\/td><td>agree, attempt, claim, decide, demand, desire, expect, fail, hesitate, hope, intend, learn, need, offer, plan, prepare, pretend, refuse, seem, strive, tend, want, wish<\/td><td>She decided to leave.<\/td><\/tr><tr><td>V + V-ing<\/td><td>admit, appreciate, avoid, can’t help, delay, deny, resist, enjoy, finish, miss, postpone, practise/practice, quit, resume, suggest, consider, mind, recall, risk, resent<\/td><td>She suggested leaving early.<\/td><\/tr><tr><td>V + O + to-V<\/td><td>ask, tell, want, invite, encourage, allow, expect<\/td><td>She asked me to wait.<\/td><\/tr><tr><td>Modal + V<\/td><td>can, could, will, would, may, might, must, should<\/td><td>He can swim.<\/td><\/tr><tr><td>Let / Make + O + V<\/td><td>let, make ở chủ động<\/td><td>Let me go. They made him wait.<\/td><\/tr><tr><td>Help + (O) + (to) V<\/td><td>Cả có to và không to<\/td><td>She helped me (to) carry it.<\/td><\/tr><tr><td>Giới từ + V-ing<\/td><td>after, before, without, interested in, look forward to<\/td><td>After eating, we left.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout warn\"><b>Mẹo nghĩa không thay được mẫu từ<\/b><div>To-V thường gợi hướng tới việc làm; V-ing thường nhìn hoạt động như một việc/quá trình. Nhưng không thể suy ra mọi mẫu bằng mẹo này: enjoy doing, decide to do phải học theo cấu trúc. Repeat có thể đi với danh từ/cụm V-ing trong ngữ cảnh phù hợp nhưng không nên coi như mẫu lựa chọn tự nhiên cho mọi câu.<\/div><\/aside><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Cặp<\/th><th>Khác biệt<\/th><\/tr><\/thead><tbody><tr><td>remember to do / remember doing<\/td><td>Nhớ phải làm / nhớ lại việc đã làm.<\/td><\/tr><tr><td>forget to do / forget doing<\/td><td>Quên thực hiện / không nhớ việc đã xảy ra; dạng sau ít gặp hơn trong nhiều ngữ cảnh.<\/td><\/tr><tr><td>stop to do / stop doing<\/td><td>Dừng việc khác để làm / ngừng hoạt động đang nói.<\/td><\/tr><tr><td>try to do / try doing<\/td><td>Cố gắng thực hiện / thử một cách để xem hiệu quả.<\/td><\/tr><tr><td>regret to inform / regret doing<\/td><td>Tiếc khi phải thông báo / hối tiếc việc đã làm.<\/td><\/tr><tr><td>need to do / need doing<\/td><td>Cần tự làm / cần được làm: The room needs cleaning.<\/td><\/tr><tr><td>used to do / be used to doing / get used to doing<\/td><td>Thói quen quá khứ / quen với / dần quen với.<\/td><\/tr><\/tbody><\/table><\/div><p>Ở bị động, make trở thành be made to-V: They made him wait → He was made to wait. Like/love/hate có thể dùng to-V hoặc V-ing trong nhiều ngữ cảnh; không ép một dạng thành sai nếu đề không phân biệt nghĩa.<\/p>", "questions": [{"type": "mc", "q": "She enjoys ___ novels.", "options": ["read", "to read", "reading", "reads"], "answers": ["reading"], "explain": "Enjoy + V-ing; không dùng enjoy to read trong mẫu này.", "optionNotes": {"read": "Enjoy + V-ing; không dùng enjoy to read trong mẫu này.", "to read": "Enjoy + V-ing; không dùng enjoy to read trong mẫu này.", "reading": "Enjoy + V-ing; không dùng enjoy to read trong mẫu này.", "reads": "Enjoy + V-ing; không dùng enjoy to read trong mẫu này."}, "id": "c15q1"}, {"type": "mc", "q": "They decided ___ early.", "options": ["leave", "leaving", "to leave", "left"], "answers": ["to leave"], "explain": "Decide + to-V.", "optionNotes": {"leave": "Decide + to-V.", "leaving": "Decide + to-V.", "to leave": "Decide + to-V.", "left": "Decide + to-V."}, "id": "c15q2"}, {"type": "mc", "q": "I stopped ___ some water. (dừng việc khác để uống)", "options": ["drink", "to drink", "drinking", "drank"], "answers": ["to drink"], "explain": "Stop to drink = dừng việc khác để uống. Stop drinking = ngừng uống, khác nghĩa.", "optionNotes": {"drink": "Stop to drink = dừng việc khác để uống. Stop drinking = ngừng uống, khác nghĩa.", "to drink": "Stop to drink = dừng việc khác để uống. Stop drinking = ngừng uống, khác nghĩa.", "drinking": "Stop to drink = dừng việc khác để uống. Stop drinking = ngừng uống, khác nghĩa.", "drank": "Stop to drink = dừng việc khác để uống. Stop drinking = ngừng uống, khác nghĩa."}, "id": "c15q3"}, {"type": "mc", "q": "Try ___ the router. It might solve the problem. (thử cách này)", "options": ["restart", "restarting", "restarted", "restarts"], "answers": ["restarting"], "explain": "Try doing là thử một biện pháp xem hiệu quả; đây là nghĩa được yêu cầu.", "optionNotes": {"restart": "Try doing là thử một biện pháp xem hiệu quả; đây là nghĩa được yêu cầu.", "restarting": "Try doing là thử một biện pháp xem hiệu quả; đây là nghĩa được yêu cầu.", "restarted": "Try doing là thử một biện pháp xem hiệu quả; đây là nghĩa được yêu cầu.", "restarts": "Try doing là thử một biện pháp xem hiệu quả; đây là nghĩa được yêu cầu."}, "id": "c15q4"}, {"type": "fill", "q": "I look forward to ___ you. (meet)", "answers": ["meeting"], "explain": "To là giới từ trong look forward to → V-ing.", "id": "c15q5"}, {"type": "error", "q": "She suggested <u>to leave<\/u> early.", "answers": ["leaving"], "explain": "Suggest + V-ing; cũng có suggest that + mệnh đề nhưng không cần đổi cả câu ở đây.", "id": "c15q6"}, {"type": "error", "q": "He was made <u>wait<\/u> outside.", "answers": ["to wait"], "explain": "Be made + to-V trong bị động.", "id": "c15q7"}, {"type": "write", "q": "Viết hai câu phân biệt remember to lock và remember locking.", "answers": ["Remember to lock the door. I remember locking the door."], "explain": "Câu đầu nhắc việc cần làm; câu sau nhớ một việc đã xảy ra.", "id": "c15q8"}]}, {"id": "c16", "title": "Mệnh đề quan hệ, danh từ và trạng ngữ", "summary": "Theo dõi từ thay thế, vai trò trong mệnh đề và điều kiện rút gọn.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Loại<\/th><th>Vai trò<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Quan hệ<\/td><td>Bổ nghĩa danh từ<\/td><td>The woman who lives next door is a doctor.<\/td><\/tr><tr><td>Danh từ<\/td><td>Làm S/O/C hoặc bổ ngữ khác<\/td><td>What she said surprised me. I know that she left.<\/td><\/tr><tr><td>Trạng ngữ<\/td><td>Nêu thời gian, nguyên nhân, điều kiện, nhượng bộ…<\/td><td>I left because I was tired.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Từ<\/th><th>Cách dùng<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Who<\/td><td>Người; chủ ngữ hoặc tân ngữ trong nhiều cách dùng<\/td><td>the person who called; the person who I met<\/td><\/tr><tr><td>Whom<\/td><td>Người ở vị trí tân ngữ, trang trọng; đặc biệt sau giới từ<\/td><td>the person to whom I spoke<\/td><\/tr><tr><td>Which<\/td><td>Vật; có thể chỉ cả mệnh đề trước<\/td><td>the book which I bought; He was late, which annoyed me.<\/td><\/tr><tr><td>That (quan hệ)<\/td><td>Người/vật trong mệnh đề xác định; không sau dấu phẩy kiểu không xác định<\/td><td>the book that I bought<\/td><\/tr><tr><td>Whose<\/td><td>Sở hữu; người hoặc vật<\/td><td>the student whose bag was lost<\/td><\/tr><tr><td>Where<\/td><td>Quan hệ nơi chốn; tương đương in/at which khi phù hợp<\/td><td>the house where I live<\/td><\/tr><tr><td>What (mệnh đề danh từ)<\/td><td>“điều/cái mà”; thường đã bao hàm tiền ngữ<\/td><td>What I need is rest. Không viết the thing what I need trong tiếng Anh chuẩn.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout warn\"><b>Where không thay which ở mọi danh từ nơi chốn<\/b><div>The city <b>where I live<\/b>: live cần quan hệ ở nơi đó. The city <b>which I visited<\/b>: visited cần tân ngữ trực tiếp. Xét vai trò còn thiếu, không chỉ thấy city rồi chọn where.<\/div><\/aside><h3>Lược đại từ và rút gọn<\/h3><p>Có thể lược đại từ quan hệ làm tân ngữ trong mệnh đề xác định: The book (that) I bought. Không lược đại từ đang làm chủ ngữ theo cách đó: The man who called me. Rút gọn là cách biến đổi khác: The students who are waiting outside → The students waiting outside; The documents that were signed yesterday → The documents signed yesterday. Không phải mệnh đề nào cũng rút gọn mà giữ nguyên nghĩa thời gian/tình thái.<\/p><p>Mệnh đề trạng ngữ rút gọn thường cần cùng chủ ngữ: While walking home, I saw a cat. Tránh While walking home, the rain started vì tạo ấn tượng “mưa đang đi bộ”. That trong I think that she is right là từ nối mệnh đề, không thay she. That trong the book that fell là đại từ quan hệ làm chủ ngữ của fell.<\/p><p>Phân biệt dấu phẩy: My brother who lives in Hanoi… xác định người anh/em nào; My brother, who lives in Hanoi,… thêm thông tin về người đã xác định. Không dùng that thay who sau dấu phẩy trong kiểu thứ hai.<\/p>", "questions": [{"type": "mc", "q": "The woman ___ called you is my aunt.", "options": ["whom", "who", "where", "whose"], "answers": ["who"], "explain": "Còn thiếu chủ ngữ của called; người → who. Whom là tân ngữ, whose cần danh từ sở hữu theo sau.", "optionNotes": {"whom": "Còn thiếu chủ ngữ của called; người → who. Whom là tân ngữ, whose cần danh từ sở hữu theo sau.", "who": "Còn thiếu chủ ngữ của called; người → who. Whom là tân ngữ, whose cần danh từ sở hữu theo sau.", "where": "Còn thiếu chủ ngữ của called; người → who. Whom là tân ngữ, whose cần danh từ sở hữu theo sau.", "whose": "Còn thiếu chủ ngữ của called; người → who. Whom là tân ngữ, whose cần danh từ sở hữu theo sau."}, "id": "c16q1"}, {"type": "mc", "q": "The city ___ I visited last year is beautiful.", "options": ["where", "which", "whose", "when"], "answers": ["which"], "explain": "Visited cần tân ngữ trực tiếp; which đại diện city. Where tạo quan hệ nơi chốn nhưng không lấp tân ngữ visited.", "optionNotes": {"where": "Visited cần tân ngữ trực tiếp; which đại diện city. Where tạo quan hệ nơi chốn nhưng không lấp tân ngữ visited.", "which": "Visited cần tân ngữ trực tiếp; which đại diện city. Where tạo quan hệ nơi chốn nhưng không lấp tân ngữ visited.", "whose": "Visited cần tân ngữ trực tiếp; which đại diện city. Where tạo quan hệ nơi chốn nhưng không lấp tân ngữ visited.", "when": "Visited cần tân ngữ trực tiếp; which đại diện city. Where tạo quan hệ nơi chốn nhưng không lấp tân ngữ visited."}, "id": "c16q2"}, {"type": "mc", "q": "The house ___ I live is small.", "options": ["which", "where", "what", "whom"], "answers": ["where"], "explain": "Live ở nghĩa sống tại cần vị trí: where = in which.", "optionNotes": {"which": "Live ở nghĩa sống tại cần vị trí: where = in which.", "where": "Live ở nghĩa sống tại cần vị trí: where = in which.", "what": "Live ở nghĩa sống tại cần vị trí: where = in which.", "whom": "Live ở nghĩa sống tại cần vị trí: where = in which."}, "id": "c16q3"}, {"type": "mc", "q": "___ she said surprised me. (điều cô ấy nói)", "options": ["What", "Which", "Where", "Whom"], "answers": ["What"], "explain": "What she said là mệnh đề danh từ làm chủ ngữ; what có nghĩa điều mà.", "optionNotes": {"What": "What she said là mệnh đề danh từ làm chủ ngữ; what có nghĩa điều mà.", "Which": "What she said là mệnh đề danh từ làm chủ ngữ; what có nghĩa điều mà.", "Where": "What she said là mệnh đề danh từ làm chủ ngữ; what có nghĩa điều mà.", "Whom": "What she said là mệnh đề danh từ làm chủ ngữ; what có nghĩa điều mà."}, "id": "c16q4"}, {"type": "fill", "q": "The student ___ bag was lost is upset.", "answers": ["whose"], "explain": "Whose bag = túi của người học sinh đó.", "id": "c16q5"}, {"type": "error", "q": "My father, <u>that<\/u> is a teacher, loves books.", "answers": ["who"], "explain": "Mệnh đề quan hệ không xác định sau dấu phẩy dùng who cho người, không dùng that.", "id": "c16q6"}, {"type": "write", "q": "Rút gọn: The documents that were signed yesterday are on the desk.", "answers": ["The documents signed yesterday are on the desk."], "explain": "Mệnh đề quan hệ bị động → cụm V3 signed yesterday.", "id": "c16q7"}, {"type": "write", "q": "Sửa để người đi bộ là tôi: While walking home, the rain started.", "answers": ["While I was walking home, it started to rain."], "explain": "Khôi phục chủ ngữ I trong mệnh đề thời gian để tránh bổ nghĩa lơ lửng.", "id": "c16q8"}]}, {"id": "c17", "title": "Điều kiện, wish và modal verbs", "summary": "Phân biệt khả năng thực, giả định, nghĩa vụ và suy đoán.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Loại<\/th><th>Mẫu thường học<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Điều kiện 0<\/td><td>If + hiện tại, hiện tại<\/td><td>If you heat ice, it melts.<\/td><\/tr><tr><td>Điều kiện 1<\/td><td>If + hiện tại, will/can/may… + V<\/td><td>If it rains, we will stay home.<\/td><\/tr><tr><td>Điều kiện 2<\/td><td>If + quá khứ, would/could/might + V<\/td><td>If I had more time, I would read more.<\/td><\/tr><tr><td>Điều kiện 3<\/td><td>If + had + V3, would/could/might have + V3<\/td><td>If I had studied, I would have passed.<\/td><\/tr><tr><td>Hỗn hợp<\/td><td>Nguyên nhân quá khứ, kết quả hiện tại<\/td><td>If I had slept well, I would not be tired now.<\/td><\/tr><tr><td>Wish hiện tại<\/td><td>Wish + quá khứ<\/td><td>I wish I knew the answer.<\/td><\/tr><tr><td>Wish quá khứ<\/td><td>Wish + had + V3<\/td><td>I wish I had studied harder.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Không hiểu “quá khứ” chỉ là thời gian<\/b><div>Trong If I had more time, had biểu thị giả định hiện tại, không bắt buộc nói quá khứ. If I were you là mẫu trang trọng phổ biến. Was có thể gặp trong giả định với I/he/she ở văn nói, nhưng were thường được yêu cầu ở bài chuẩn.<\/div><\/aside><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Modal/cấu trúc<\/th><th>Nghĩa<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>must / have to<\/td><td>Sự cần thiết/nghĩa vụ; sắc thái tùy người nói và hoàn cảnh<\/td><td>You must wear a helmet.<\/td><\/tr><tr><td>mustn’t / don’t have to<\/td><td>Cấm / không cần, không bắt buộc<\/td><td>You mustn’t smoke here. You don’t have to come.<\/td><\/tr><tr><td>must / might / can’t + V<\/td><td>Suy đoán hiện tại<\/td><td>She must be tired. He might be home. That can’t be true.<\/td><\/tr><tr><td>must/might/can’t have + V3<\/td><td>Suy đoán quá khứ<\/td><td>She must have forgotten.<\/td><\/tr><tr><td>should have + V3<\/td><td>Điều đáng lẽ nên làm; đôi khi kỳ vọng tùy ngữ cảnh<\/td><td>I should have called you.<\/td><\/tr><tr><td>could have + V3<\/td><td>Khả năng/cơ hội quá khứ; nghĩa cụ thể theo ngữ cảnh<\/td><td>We could have won.<\/td><\/tr><\/tbody><\/table><\/div><p>Unless thường tương đương if…not khi nghĩa phù hợp. Không tự thêm not sau unless để giữ nghĩa “nếu không”. Trong mệnh đề thời gian chỉ tương lai, thường dùng hiện tại: I will call when I arrive. Không tuyệt đối hóa “không bao giờ có will sau if”: will có thể biểu thị sự sẵn lòng trong ngữ cảnh khác.<\/p>", "questions": [{"type": "mc", "q": "If it rains tomorrow, we ___ home. (kết quả dự kiến)", "options": ["will stay", "would have stayed", "stayed", "had stayed"], "answers": ["will stay"], "explain": "Điều kiện thực tương lai: if + hiện tại, will + V.", "optionNotes": {"will stay": "Điều kiện thực tương lai: if + hiện tại, will + V.", "would have stayed": "Điều kiện thực tương lai: if + hiện tại, will + V.", "stayed": "Điều kiện thực tương lai: if + hiện tại, will + V.", "had stayed": "Điều kiện thực tương lai: if + hiện tại, will + V."}, "id": "c17q1"}, {"type": "mc", "q": "If I ___ you, I would apologise. (mẫu giả định trang trọng)", "options": ["am", "were", "will be", "have been"], "answers": ["were"], "explain": "If I were you là mẫu giả định lời khuyên.", "optionNotes": {"am": "If I were you là mẫu giả định lời khuyên.", "were": "If I were you là mẫu giả định lời khuyên.", "will be": "If I were you là mẫu giả định lời khuyên.", "have been": "If I were you là mẫu giả định lời khuyên."}, "id": "c17q2"}, {"type": "mc", "q": "You ___ smoke here. It is prohibited.", "options": ["don’t have to", "mustn’t", "might", "could"], "answers": ["mustn’t"], "explain": "Mustn’t là cấm. Don’t have to chỉ không bắt buộc, không phải cấm.", "optionNotes": {"don’t have to": "Mustn’t là cấm. Don’t have to chỉ không bắt buộc, không phải cấm.", "mustn’t": "Mustn’t là cấm. Don’t have to chỉ không bắt buộc, không phải cấm.", "might": "Mustn’t là cấm. Don’t have to chỉ không bắt buộc, không phải cấm.", "could": "Mustn’t là cấm. Don’t have to chỉ không bắt buộc, không phải cấm."}, "id": "c17q3"}, {"type": "mc", "q": "I wish I ___ more time now.", "options": ["have", "had", "will have", "had had"], "answers": ["had"], "explain": "Wish cho điều trái hiện tại → quá khứ đơn had; had had nói tiếc quá khứ.", "optionNotes": {"have": "Wish cho điều trái hiện tại → quá khứ đơn had; had had nói tiếc quá khứ.", "had": "Wish cho điều trái hiện tại → quá khứ đơn had; had had nói tiếc quá khứ.", "will have": "Wish cho điều trái hiện tại → quá khứ đơn had; had had nói tiếc quá khứ.", "had had": "Wish cho điều trái hiện tại → quá khứ đơn had; had had nói tiếc quá khứ."}, "id": "c17q4"}, {"type": "fill", "q": "If she had studied, she ___ (pass). (dùng would)", "answers": ["would have passed"], "explain": "Điều kiện 3: would have + V3.", "id": "c17q5"}, {"type": "error", "q": "I will call you when I <u>will arrive<\/u>.", "answers": ["arrive"], "explain": "Mệnh đề thời gian chỉ tương lai thường dùng hiện tại đơn.", "id": "c17q6"}, {"type": "write", "q": "Diễn tả tiếc vì hôm qua không gọi cho cô ấy, dùng wish.", "answers": ["I wish I had called her yesterday."], "explain": "Wish + past perfect diễn tả tiếc việc quá khứ.", "id": "c17q7"}, {"type": "write", "q": "Viết câu “Bạn không cần đến ngày mai”, dùng have to.", "answers": ["You do not have to come tomorrow."], "explain": "Don’t have to = không cần; mustn’t sẽ thành cấm đến.", "id": "c17q8"}]}, {"id": "c18", "title": "Liên kết câu, song song và diễn đạt rõ", "summary": "Ghép ý đúng cấu trúc; kiểm tra câu hoàn chỉnh và dấu câu.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Quan hệ<\/th><th>Cấu trúc<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Nguyên nhân<\/td><td>because + mệnh đề; because of + N/V-ing<\/td><td>We stayed home because it rained / because of the rain.<\/td><\/tr><tr><td>Nhượng bộ<\/td><td>although/though/even though + mệnh đề; despite/in spite of + N/V-ing<\/td><td>Although she was tired, she worked. Despite being tired, she worked.<\/td><\/tr><tr><td>Kết quả<\/td><td>so nối mệnh đề; therefo <script>
'use strict';
const CHAPTERS=JSON.parse(document.getElementById('lesson-data').textContent);
const ALL=CHAPTERS.flatMap(c=>c.questions), BYID=new Map(ALL.map(q=>[q.id,q]));
const KEY='bi-kip-grammar-v2', VERSION=2;
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const textOnly=s=>{const d=document.createElement('div');d.innerHTML=s;return d.textContent;};
const fresh=()=>({version:VERSION,chapter:'c1',font:17,tab:'all',records:{},orders:{},history:[]});
function sanitize(raw){
 if(!raw||raw.version!==VERSION||typeof raw.records!=='object'||raw.records===null)throw Error('Bản tiến độ không đúng định dạng của tài liệu này.');
 const out=fresh();out.chapter=CHAPTERS.some(c=>c.id===raw.chapter)?raw.chapter:'c1';out.font=[17,19,21].includes(raw.font)?raw.font:17;out.tab=['all','theory','practice'].includes(raw.tab)?raw.tab:'all';
 for(const q of ALL){const r=raw.records[q.id];if(!r||typeof r!=='object')continue;
 const status=['correct','wrong','revealed','self','retry'].includes(r.status)?r.status:undefined;
 const v={input:typeof r.input==='string'?r.input.slice(0,10000):'',first:['correct','wrong'].includes(r.first)?r.first:null,exposed:!!r.exposed,tries:Number.isInteger(r.tries)?Math.max(0,Math.min(9999,r.tries)):0};
 if(status)v.status=status;
 if(typeof r.chosen==='string'&&q.options?.includes(r.chosen))v.chosen=r.chosen;
 if(['understood','review'].includes(r.self))v.self=r.self;
 out.records[q.id]=v;
 }
 for(const c of CHAPTERS){const a=raw.orders?.[c.id];if(Array.isArray(a)&&a.length===c.questions.length&&new Set(a).size===a.length&&a.every(id=>c.questions.some(q=>q.id===id)))out.orders[c.id]=a;}
 out.history=Array.isArray(raw.history)?raw.history.filter(h=>h&&typeof h.chapter==='string'&&typeof h.date==='string'&&typeof h.summary==='string').slice(-60).map(h=>({chapter:h.chapter,date:h.date,summary:h.summary.slice(0,200)})):[];
 return out;
}
let state=fresh(), storageOK=true;
try{const saved=localStorage.getItem(KEY);if(saved)state=sanitize(JSON.parse(saved));}catch(e){storageOK=false;}
let filter='all', toastTimer, savingTimer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}el('save-warning').hidden=storageOK;}
function toast(s){el('toast').textContent=s;el('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').hidden=true,3600);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function rec(q){return state.records[q.id]||{};}
function resolved(q){return ['correct','wrong','revealed','self'].includes(rec(q).status);}
function stats(c){const qs=c?c.questions:ALL;return {total:qs.length,done:qs.filter(resolved).length,correct:qs.filter(q=>rec(q).first==='correct').length,wrong:qs.filter(q=>rec(q).first==='wrong').length,revealed:qs.filter(q=>rec(q).exposed&&!rec(q).first&&q.type!=='write').length,self:qs.filter(q=>q.type==='write'&&resolved(q)).length};}
function updateStats(){
 const c=current(),s=stats(c);const graded=s.correct+s.wrong;
 if(el('stats'))el('stats').innerHTML=`<div class="stat"><strong>${s.done}/${s.total}</strong><span>Đã xử lý trong lượt này</span></div><div class="stat"><strong>${s.correct}/${graded}</strong><span>Đúng lần đầu · ${graded?Math.round(s.correct/graded*100)+'%':'chưa chấm'}</span></div><div class="stat"><strong>${s.revealed}</strong><span>Xem trước đáp án</span></div><div class="stat"><strong>${s.self}</strong><span>Câu viết tự đánh giá</span></div>`;
 if(el('result')){el('result').hidden=s.done!==s.total;el('result').textContent=s.done===s.total?`Bạn đã xử lý ${s.total} câu. Có ${s.wrong} câu sai lần đầu; ${s.revealed} câu đã xem trước đáp án và ${s.self} câu viết được theo dõi riêng. Hãy ôn các mục cần xem lại.`:'';}
 const g=stats(), completed=CHAPTERS.filter(c=>stats(c).done===c.questions.length).length;
 el('global').textContent=`${g.done}/${g.total} câu đã xử lý · ${completed}/${CHAPTERS.length} chương hoàn tất lượt`;
 el('global-bar').style.width=(100*g.done/g.total)+'%';
 document.querySelectorAll('.navlink').forEach(b=>{const c=CHAPTERS.find(c=>c.id===b.dataset.chapter),s=stats(c);b.querySelector('small').textContent=`${s.done}/${s.total} câu`;});
}
function current(){return CHAPTERS.find(c=>c.id===state.chapter)||CHAPTERS[0];}
function renderNav(){el('nav').innerHTML=CHAPTERS.map((c,i)=>`<button class="navlink" data-chapter="${c.id}" ${c.id===state.chapter?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span>${escapeHTML(c.title)}<small></small></span></button>`).join('');filterNav();}
function fold(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();}
function filterNav(){const s=fold(el('search').value);document.querySelectorAll('.navlink').forEach(b=>b.hidden=!fold(b.textContent).includes(s));}
function menu(open){el('sidebar').classList.toggle('open',open);el('overlay').classList.toggle('open',open);el('menu').setAttribute('aria-expanded',String(open));syncMobile();if(open)el('search').focus();}
function syncMobile(){const closed=window.matchMedia('(max-width:820px)').matches&&!el('sidebar').classList.contains('open');el('sidebar').inert=closed;}
function setChapter(id,focus=true){if(!CHAPTERS.some(c=>c.id===id))return;clearTimeout(savingTimer);state.chapter=id;filter='all';menu(false);renderNav();renderMain();save();try{history.replaceState(null,'','#'+id);}catch(e){}window.scrollTo({top:0,behavior:'instant'});if(focus)el('main').focus({preventScroll:true});}
function renderMain(){const c=current(),i=CHAPTERS.indexOf(c);el('main').innerHTML=`
 <section class="chapter-head"><div class="eyebrow">Chương ${String(i+1).padStart(2,'0')} / 18 ${i>=10?'· Bổ sung nền tảng':''}</div><h1>${escapeHTML(c.title)}</h1><p class="subtitle">${escapeHTML(c.summary)}</p><div class="meta"><span class="pill">${c.questions.length} câu luyện tập</span><span class="pill">Lời giải khi trả lời sai</span><span class="pill">Học ngoại tuyến</span></div></section>
 <details class="guide"><summary>Cách học và cách tính điểm</summary><p>Chọn đáp án hoặc nhập câu trả lời rồi kiểm tra. Sai sẽ hiện đáp án đúng và giải thích ngay. <b>Enter</b>: kiểm tra; sau khi đã có kết quả, Enter để đến câu tiếp. <b>Shift+Enter</b>: xuống dòng trong ô viết. Trên điện thoại, dùng nút Kiểm tra và Câu tiếp.</p><p>Điểm chỉ tính câu chấm tự động ở <b>lần trả lời đầu tiên trước khi xem đáp án</b>. Xem đáp án không được cộng đúng. Câu viết có nhiều cách diễn đạt được tự đối chiếu theo mẫu; không chấm ngữ pháp tự động. “Đã xử lý” gồm trả lời, xem đáp án và xem mẫu. “Thử lại” giữ kết quả lần đầu; “Lượt mới” lưu tóm tắt lượt cũ rồi đặt lại chương.</p></details>
 <div class="tabs" aria-label="Nội dung hiển thị"><button data-tab="all" aria-pressed="${state.tab==='all'}">Tất cả</button><button data-tab="theory" aria-pressed="${state.tab==='theory'}">Lý thuyết</button><button data-tab="practice" aria-pressed="${state.tab==='practice'}">Luyện tập</button></div>
 <article class="theory" id="theory" ${state.tab==='practice'?'hidden':''}>${c.theory}</article>
 <section class="exercises" id="exercises" ${state.tab==='theory'?'hidden':''}><div class="ex-top"><div><h2>Luyện tập và tự giải thích</h2><div class="subtle">Câu sai được giải thích ngay · Ô điền từ chỉ nhập phần còn thiếu</div></div></div><div class="stats" id="stats" aria-live="polite"></div>
 <div class="tools"><label for="filter">Hiển thị</label><select id="filter"><option value="all">Tất cả câu</option><option value="wrong">Câu từng sai trong lượt này</option><option value="unseen">Câu chưa xử lý</option><option value="revealed">Câu đã xem trước đáp án</option><option value="review">Câu viết cần ôn</option></select><button data-action="shuffle">Xáo thứ tự</button><button data-action="restart">Lượt mới của chương</button></div><p class="subtle" id="filter-note"></p><div id="questions"></div><div class="chapter-result" id="result" hidden role="status"></div></section>
 <nav class="ch-nav" aria-label="Chuyển chương">${i?`<button data-chapter="${CHAPTERS[i-1].id}">← Chương ${i}</button>`:'<span></span>'}${i<17?`<button data-chapter="${CHAPTERS[i+1].id}">Chương ${i+2} →</button>`:'<span></span>'}</nav>
 <footer class="source-footer">Bản hiệu đính từ tài liệu bạn cung cấp · 18 chương, 253 câu · Lý thuyết phân biệt quy tắc cơ bản, ngữ cảnh và ngoại lệ. Tham khảo thêm: <a href="https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/reported-speech-statements" target="_blank" rel="noopener">British Council: Reported speech</a>. File không tải phông chữ hay thư viện bên ngoài. Tiến độ chỉ lưu trong trình duyệt; liên kết tham khảo cần mạng.</footer>`;
 el('filter').value=filter;renderQuestions();updateStats();}
function ordered(){const c=current(),ids=state.orders[c.id]||c.questions.map(q=>q.id);return ids.map(id=>BYID.get(id));}
function eligible(q){const r=rec(q);return filter==='all'||filter==='wrong'&&r.first==='wrong'||filter==='unseen'&&!resolved(q)||filter==='revealed'&&r.exposed&&!r.first&&q.type!=='write'||filter==='review'&&r.self==='review';}
function renderQuestions(){const list=ordered().filter(eligible);el('questions').innerHTML=list.length?list.map(q=>card(q)).join(''):'<div class="empty">Không có câu nào trong nhóm này. Bạn có thể chọn “Tất cả câu” để tiếp tục.</div>';el('filter-note').textContent=`Đang hiển thị ${list.length}/${current().questions.length} câu. Bộ lọc cập nhật khi chọn lại; kết quả vừa làm vẫn ở lại để bạn đọc lời giải.`;}
function norm(s){return String(s).normalize('NFKC').toLowerCase().replace(/[’‘ʼ]/g,"'").trim().replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'cannot').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not').replace(/\b([a-z]+)n't\b/g,'$1 not').replace(/\bi'm\b/g,'i am').replace(/\b([a-z]+)'ve\b/g,'$1 have').replace(/\b([a-z]+)'re\b/g,'$1 are').replace(/\b([a-z]+)'ll\b/g,'$1 will').replace(/[.!?,;:"()]/g,'').replace(/\s+/g,' ').trim();}
function valid(q,input){const n=norm(input);return q.answers.some(a=>norm(a)===n)||(q.answers.includes('∅')&&['','∅','ø','none','no article','khong dung mao tu','không dùng mạo từ','không mạo từ'].includes(n));}
function typeName(q){return {mc:'Chọn đáp án',fill:'Điền từ',error:'Sửa phần gạch chân',write:'Viết câu · tự đối chiếu',match:'Nối với quy tắc'}[q.type];}
function card(q){const r=rec(q),locked=resolved(q),index=current().questions.findIndex(x=>x.id===q.id)+1;
 let body='';
 if(q.type==='mc'||q.type==='match'){
 const opts=q.options;
 body=`<div class="opts" role="group" aria-labelledby="${q.id}-prompt">${opts.map((o,i)=>{const correct=locked&&q.answers.includes(o),wrong=locked&&r.chosen===o&&!correct;return `<button class="option${correct?' correct':''}${wrong?' wrong':''}" data-answer="${i}" ${locked?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHTML(o)}${correct?' <b>✓ Đáp án đúng</b>':''}${wrong?' <b>✗ Bạn đã chọn</b>':''}</span></button>`;}).join('')}</div>`;
 }else{
 body=`<label class="subtle" for="${q.id}-input">${q.type==='error'?'Nhập phần thay thế cho đoạn gạch chân':q.type==='write'?'Câu trả lời của bạn (được lưu)':'Đáp án của bạn'}</label>${q.type==='write'?`<textarea class="qinput" id="${q.id}-input" data-input="${q.id}" rows="3" placeholder="Viết câu của bạn…">${escapeHTML(r.input||'')}</textarea>`:`<input class="qinput${r.status==='correct'?' ok':r.status==='wrong'?' fail':''}" id="${q.id}-input" data-input="${q.id}" type="text" autocomplete="off" spellcheck="false" ${locked?'disabled':''} value="${escapeHTML(r.input||'')}" placeholder="${q.answers.includes('∅')?'Nhập mạo từ hoặc chọn ∅ bên dưới':'Nhập phần còn thiếu…'}">`}`;
 }
 if(!locked)body+=`<div class="actions">${q.type==='write'?'<button class="primary" data-action="model">Xem mẫu và tự đối chiếu</button>':q.type==='fill'||q.type==='error'?'<button class="primary" data-action="check">Kiểm tra ↵</button>':''}${q.answers.includes('∅')&&q.type!=='mc'?'<button data-action="zero">Không dùng mạo từ (∅)</button>':''}${q.type!=='write'?'<button data-action="reveal">Xem đáp án</button>':''}</div>`;
 else body+=feedback(q,r)+`<div class="actions"><button class="primary" data-action="next">Câu tiếp →</button>${q.type!=='write'?'<button data-action="retry">Thử lại câu này</button>':''}</div>`;
 return `<section class="qcard" id="${q.id}" tabindex="-1" aria-labelledby="${q.id}-prompt"><div class="qtop"><span class="qtype">${typeName(q)}</span><span class="qnumber">Câu ${String(index).padStart(2,'0')}</span></div><p class="prompt" id="${q.id}-prompt">${q.q}</p>${body}</section>`;
}
function feedback(q,r){
 const mode=q.type==='write'?'self':r.status;
 const title=mode==='correct'?'✓ Chính xác':mode==='wrong'?'✗ Chưa đúng':mode==='self'?'Đáp án mẫu · tự đối chiếu':'Đã xem đáp án · không cộng điểm đúng';
 let explain=q.explain;
 if(mode==='wrong'&&q.optionNotes&&r.chosen)explain=q.optionNotes[r.chosen]||explain;
 let s=`<div class="feedback ${mode==='correct'?'ok':mode==='wrong'?'bad':''}" role="status"><h4>${title}</h4>${r.chosen?`<p>Bạn chọn: <b>${escapeHTML(r.chosen)}</b></p>`:''}<p><b>${mode==='self'?'Câu mẫu':'Đáp án phù hợp'}:</b> ${q.answers.map(escapeHTML).join(' / ')}</p><p><b>${mode==='wrong'?'Vì sao đáp án của bạn chưa phù hợp':'Giải thích'}:</b> ${escapeHTML(explain)}</p>`;
 if(q.type==='mc')s+=`<details><summary>Xem giải thích các phương án</summary>${q.options.map(o=>`<div class="other"><b>${escapeHTML(o)}</b> — ${q.answers.includes(o)?'Đáp án phù hợp. ':''}${escapeHTML(q.optionNotes?.[o]||q.explain)}</div>`).join('')}</details>`;
 if(mode==='correct'&&r.first==='wrong')s+='<p class="subtle">Bạn đã sửa đúng. Kết quả lần đầu vẫn được giữ trong nhóm câu từng sai.</p>';
 if(mode==='correct'&&r.exposed&&!r.first)s+='<p class="subtle">Bạn đã xem đáp án trước đó; lượt thử này không thêm điểm đúng lần đầu.</p>';
 if(mode==='self')s+=`<p>Câu khác mẫu vẫn có thể đúng. Hãy kiểm tra: đủ thành phần câu; giữ nghĩa và thì theo yêu cầu; đúng mẫu động từ; đúng đại từ và giới từ.</p><div class="actions"><button data-action="understood" aria-pressed="${r.self==='understood'}">Tôi đã hiểu</button><button data-action="review" aria-pressed="${r.self==='review'}">Cần ôn lại</button></div>${r.self?`<div class="self-status">${r.self==='understood'?'✓ Đã đánh dấu hiểu':'↺ Đã đưa vào nhóm cần ôn'}</div>`:''}`;
 return s+'</div>';
}
function redraw(q,focus=true){const old=el(q.id);if(!old)return;old.outerHTML=card(q);if(focus){const b=el(q.id).querySelector('[data-action="next"]')||el(q.id).querySelector('input,textarea,button');b?.focus({preventScroll:true});}updateStats();save();}
function grade(q,input){if(resolved(q))return;
 if(!input.trim()&&!q.answers.includes('∅')){toast('Bạn hãy nhập đáp án trước khi kiểm tra.');el(q.id+'-input')?.focus();return;}
 const old=rec(q),ok=valid(q,input),r={...old,status:ok?'correct':'wrong',tries:(old.tries||0)+1};
 if(!old.first&&!old.exposed)r.first=ok?'correct':'wrong';
 if(q.options)r.chosen=input;else r.input=input;
 state.records[q.id]=r;redraw(q);
}
function reveal(q){if(resolved(q))return;const old=rec(q);state.records[q.id]={...old,status:q.type==='write'?'self':'revealed',exposed:true,input:el(q.id+'-input')?.value||old.input||''};redraw(q);}
function next(q){const cards=[...el('questions').querySelectorAll('.qcard')],i=cards.findIndex(c=>c.id===q.id),n=cards[i+1];if(n){n.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});const target=n.querySelector('input:not(:disabled),textarea,button:not(:disabled)')||n;target.focus({preventScroll:true});}else{toast('Bạn đã đến câu cuối của nhóm đang hiển thị.');el('result').hidden?el('filter').focus():el('result').scrollIntoView({block:'center'});}}
let confirmAction=null;
function ask(title,txt,fn){el('dialog-title').textContent=title;el('dialog-text').textContent=txt;confirmAction=fn;el('confirm-dialog').showModal();el('cancel-dialog').focus();}
function restart(){const c=current(),s=stats(c);ask('Bắt đầu lượt mới?',`Đặt lại ${c.questions.length} câu của chương này và xáo thứ tự. Các chương khác giữ nguyên; tóm tắt lượt hiện tại được lưu trong bản xuất tiến độ.`,()=>{state.history.push({chapter:c.id,date:new Date().toISOString(),summary:`${s.done}/${s.total} câu; ${s.correct} đúng và ${s.wrong} sai lần đầu.`});state.history=state.history.slice(-60);c.questions.forEach(q=>delete state.records[q.id]);state.orders[c.id]=shuffle(c.questions.map(q=>q.id));filter='all';save();renderMain();toast('Đã bắt đầu lượt mới cho chương này.');});}
el('main').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.chapter){setChapter(b.dataset.chapter);return;}
 if(b.dataset.tab){state.tab=b.dataset.tab;renderMain();save();el('main').querySelector(`[data-tab="${state.tab}"]`).focus({preventScroll:true});return;}
 const action=b.dataset.action;
 if(action==='shuffle'){state.orders[state.chapter]=shuffle(current().questions.map(q=>q.id));save();renderQuestions();toast('Đã xáo thứ tự; giữ nguyên đáp án và điểm.');return;}
 if(action==='restart'){restart();return;}
 const cardEl=b.closest('.qcard'),q=cardEl?BYID.get(cardEl.id):null;if(!q)return;
 if(b.dataset.answer!==undefined){grade(q,q.options[Number(b.dataset.answer)]);return;}
 if(action==='check')grade(q,el(q.id+'-input').value);
 if(action==='zero'){el(q.id+'-input').value='∅';grade(q,'∅');}
 if(action==='reveal'||action==='model')reveal(q);
 if(action==='next')next(q);
 if(action==='retry'){state.records[q.id]={...rec(q),status:'retry',chosen:undefined,input:''};redraw(q,false);el(q.id).querySelector('input,button')?.focus({preventScroll:true});}
 if(action==='understood'||action==='review'){state.records[q.id]={...rec(q),self:action};redraw(q,false);el(q.id).querySelector(`[data-action="${action}"]`)?.focus({preventScroll:true});}
});
el('main').addEventListener('input',e=>{if(e.target.dataset.input){const id=e.target.dataset.input;state.records[id]={...state.records[id],input:e.target.value};clearTimeout(savingTimer);savingTimer=setTimeout(save,200);}});
el('main').addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;renderQuestions();}});
el('main').addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229||e.repeat)return;
 const cardEl=e.target.closest('.qcard');if(!cardEl)return;const q=BYID.get(cardEl.id);
 if(e.target.matches('input,textarea')){e.preventDefault();if(resolved(q))next(q);else if(q.type==='write')reveal(q);else grade(q,e.target.value);}
 else if(e.target===cardEl&&resolved(q)){e.preventDefault();next(q);}
});
el('nav').addEventListener('click',e=>{const b=e.target.closest('[data-chapter]');if(b)setChapter(b.dataset.chapter);});
el('search').addEventListener('input',filterNav);
el('menu').onclick=()=>menu(!el('sidebar').classList.contains('open'));
el('overlay').onclick=()=>{menu(false);el('menu').focus();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&el('sidebar').classList.contains('open')){menu(false);el('menu').focus();}if(e.key==='Tab'&&el('sidebar').classList.contains('open')&&matchMedia('(max-width:820px)').matches){const controls=[...el('sidebar').querySelectorAll('button:not([hidden]),input:not([hidden]),a')].filter(x=>x.getClientRects().length);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
el('font').onclick=()=>{state.font=state.font===17?19:state.font===19?21:17;document.documentElement.style.setProperty('--font',state.font+'px');el('font').textContent=state.font===21?'A−':'A+';save();toast(`Cỡ chữ ${state.font}px`);};
el('print').onclick=()=>{let d=el('main').querySelector('.print-only');if(!d){d=document.createElement('div');d.className='print-only';d.innerHTML=CHAPTERS.map((c,i)=>`<section class="print-chapter"><p>Chương ${i+1} · Bí Kíp Ngữ Pháp Tiếng Anh</p><h1>${escapeHTML(c.title)}</h1>${c.theory}</section>`).join('');el('main').appendChild(d);}window.print();};
el('export').onclick=()=>{save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tien-do-bi-kip-ngu-phap.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất bản sao tiến độ.');};
el('import').onclick=()=>el('import-file').click();
el('import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2e6)throw Error('File tiến độ quá lớn.');const incoming=sanitize(JSON.parse(await f.text()));ask('Nhập tiến độ?', 'Thay tiến độ hiện tại bằng bản đã chọn. Bạn có thể xuất tiến độ hiện tại trước nếu cần giữ lại.',()=>{state=incoming;filter='all';document.documentElement.style.setProperty('--font',state.font+'px');renderNav();renderMain();save();menu(false);toast('Đã nhập tiến độ.');});}catch(err){toast('Không thể nhập: '+err.message);}e.target.value='';};
el('cancel-dialog').onclick=()=>{confirmAction=null;el('confirm-dialog').close();};el('accept-dialog').onclick=()=>{const fn=confirmAction;confirmAction=null;el('confirm-dialog').close();fn?.();};el('confirm-dialog').addEventListener('cancel',()=>confirmAction=null);
new ResizeObserver(()=>{document.documentElement.style.setProperty('--header-h',el('topbar').offsetHeight+'px');syncMobile();}).observe(el('topbar'));
window.addEventListener('resize',syncMobile);window.addEventListener('pagehide',save);window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(CHAPTERS.some(c=>c.id===id))setChapter(id);});
if(CHAPTERS.some(c=>c.id===location.hash.slice(1)))state.chapter=location.hash.slice(1);
document.documentElement.style.setProperty('--font',state.font+'px');el('font').textContent=state.font===21?'A−':'A+';el('save-warning').hidden=storageOK;renderNav();renderMain();syncMobile();save();
</script></body></html>
