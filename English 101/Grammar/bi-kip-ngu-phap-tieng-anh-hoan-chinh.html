or:#77828c;font-size:14px}.top-actions button:hover{background:#34414c}.menu{display:none}.layout{max-width:1440px;margin:auto;display:flex}.sidebar{position:sticky;top:var(--header-h);height:calc(100dvh - var(--header-h));width:285px;flex:none;padding:22px 16px;overflow:auto;border-right:1px solid var(--line);background:var(--paper)}.side-label{font-size:11px;letter-spacing:1.8px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:10px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--white);font-size:14px;margin-bottom:16px}.navlink{width:100%;text-align:left;border:0;background:transparent;display:flex;align-items:flex-start;gap:9px;padding:10px 9px;margin-bottom:4px;font-size:14px}.navlink .num{color:var(--muted);font-size:12px;min-width:23px;padding-top:2px}.navlink[aria-current=page]{background:var(--bluebg);color:var(--blue);box-shadow:inset 3px 0 var(--blue)}.navlink small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.sidebar-footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.sidebar-footer button{font-size:12px;margin-top:8px}.global-progress{height:5px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0}.global-progress>span{display:block;background:var(--blue);height:100%}main{min-width:0;flex:1;padding:38px 44px 65px;max-width:1100px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:12px}.subtitle{color:var(--muted);max-width:740px}.chapter-head{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:20px}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.pill{font-size:12px;padding:4px 9px;background:var(--soft);border-radius:5px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{font-size:14px}.tabs button[aria-pressed=true],.primary{background:var(--blue);color:white;bor <script id="lesson-data" type="application/json">[{"id": "c1", "title": "Các thì và cách nhìn hành động", "summary": "Chọn thì theo ý nghĩa, mốc thời gian và thể của động từ.", "theory": "<p>Trong cách học phổ biến, ta dùng bảng <b>12 dạng thì–thể<\/b>: hiện tại, quá khứ, tương lai × đơn, tiếp diễn, hoàn thành, hoàn thành tiếp diễn. Về hình thức, tiếng Anh phân biệt thì hiện tại và quá khứ; tương lai được diễn đạt bằng nhiều cấu trúc. Điều quan trọng là <b>bạn đang nhìn hành động từ mốc nào và muốn nhấn mạnh điều gì<\/b>.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Dạng<\/th><th>Cấu trúc khẳng định<\/th><th>Cách dùng và ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Present simple<\/td><td>S + V / V-s/es<\/td><td>Thói quen, sự thật: She reads every day.<\/td><\/tr><tr><td>Present continuous<\/td><td>S + am/is/are + V-ing<\/td><td>Đang diễn ra hoặc tạm thời: She is reading now.<\/td><\/tr><tr><td>Present perfect<\/td><td>S + have/has + V3<\/td><td>Trải nghiệm, kết quả hiện tại, trạng thái đến nay: I have known her for years.<\/td><\/tr><tr><td>Present perfect continuous<\/td><td>S + have/has been + V-ing<\/td><td>Nhấn quá trình hoặc thời lượng đến nay/gần đây: She has been reading for two hours.<\/td><\/tr><tr><td>Past simple<\/td><td>S + V2<\/td><td>Sự việc tại thời gian quá khứ đã kết thúc: She read it yesterday.<\/td><\/tr><tr><td>Past continuous<\/td><td>S + was/were + V-ing<\/td><td>Đang diễn ra tại mốc quá khứ: She was reading at six.<\/td><\/tr><tr><td>Past perfect<\/td><td>S + had + V3<\/td><td>Nhìn ngược về trước một mốc quá khứ: She had left when I arrived.<\/td><\/tr><tr><td>Past perfect continuous<\/td><td>S + had been + V-ing<\/td><td>Quá trình kéo dài trước mốc quá khứ: She had been waiting for an hour when I arrived.<\/td><\/tr><tr><td>Future simple<\/td><td>S + will + V<\/td><td>Dự đoán, quyết định lúc nói, lời hứa: I will help you.<\/td><\/tr><tr><td>Future continuous<\/td><td>S + will be + V-ing<\/td><td>Đang diễn ra tại mốc tương lai: At eight, I will be travelling.<\/td><\/tr><tr><td>Future perfect<\/td><td>S + will have + V3<\/td><td>Hoàn thành trước mốc tương lai: By Friday, I will have finished.<\/td><\/tr><tr><td>Future perfect continuous<\/td><td>S + will have been + V-ing<\/td><td>Thời lượng tính đến mốc tương lai: By June, I will have been working here for ten years.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout warn\"><b>Đừng chọn thì chỉ bằng một từ<\/b><div><i>For<\/i> chỉ khoảng thời gian: I worked there for two years (đã kết thúc). <i>Since<\/i> chỉ mốc bắt đầu trong cách dùng thời gian; còn có nghĩa “vì”. <i>Tomorrow<\/i> vẫn đi với hiện tại tiếp diễn: I am meeting Lan tomorrow.<\/div><\/aside><h3>Phủ định, câu hỏi và động từ be<\/h3><p>Hiện tại đơn với động từ thường: S + do/does not + V; Do/Does + S + V? Quá khứ đơn: S + did not + V; Did + S + V? Sau does/did, động từ trở về nguyên mẫu. Với be: She is not tired. Is she tired? She was not tired. Was she tired? Với các dạng có trợ động từ, thêm not sau trợ động từ đầu tiên hoặc đảo trợ động từ đầu tiên lên trước chủ ngữ: Has she been working? Câu hỏi chủ ngữ có ngoại lệ: Who called you?<\/p><h3>Các cặp cần hiểu nghĩa<\/h3><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Cặp<\/th><th>Sự khác biệt<\/th><\/tr><\/thead><tbody><tr><td>I have read the book. / I have been reading the book.<\/td><td>Câu đầu nhấn kết quả/hoàn tất việc đọc; câu sau nhấn quá trình, không khẳng định đã đọc xong.<\/td><\/tr><tr><td>I knew him. / I have known him for years.<\/td><td>Câu đầu đặt việc quen biết trong quá khứ; câu sau nối trạng thái đến hiện tại.<\/td><\/tr><tr><td>She worked. / She was working.<\/td><td>Nhìn sự việc như một tổng thể / nhìn lúc nó đang diễn ra.<\/td><\/tr><tr><td>She finished before I came. / She had finished before I came.<\/td><td>Cả hai có thể đúng; before đã làm rõ trình tự. Had finished nhấn hoàn tất trước mốc quá khứ.<\/td><\/tr><tr><td>I will call her. / I am going to call her. / I am meeting her tomorrow.<\/td><td>Quyết định/lời hứa tùy ngữ cảnh; dự định đã có; kế hoạch gặp đã sắp xếp.<\/td><\/tr><\/tbody><\/table><\/div><h3>Dạng động từ và giới hạn<\/h3><p>V: go; V-s/es: goes; V2: went; V3: gone; V-ing: going. Tương tự: play–played–played–playing; do–did–done–doing; write–wrote–written–writing; eat–ate–eaten–eating. Không phải động từ nào cũng cần tân ngữ: He sleeps. Know thường không dùng tiếp diễn ở nghĩa “biết”. Think có thể dùng tiếp diễn khi nghĩa là đang suy nghĩ. Used to + V diễn tả thói quen/trạng thái quá khứ không còn như trước. Shall thường gặp trong Shall I…? / Shall we…? để đề nghị; không thay will tự do với mọi chủ ngữ.<\/p><aside class=\"callout note\"><b>Trình tự làm bài<\/b><div>Xác định ý muốn nói → mốc thời gian → quá trình hay kết quả → chọn trợ động từ → kiểm tra dạng động từ và hòa hợp.<\/div><\/aside>", "questions": [{"type": "mc", "q": "She ___ to the market every Sunday. (thói quen hiện tại)", "options": ["go", "goes", "went", "is going"], "answers": ["goes"], "explain": "Thói quen hiện tại dùng hiện tại đơn; she là ngôi ba số ít nên go → goes.", "optionNotes": {"go": "Go chưa hòa hợp với she ở hiện tại đơn.", "goes": "Thói quen hiện tại dùng hiện tại đơn; she là ngôi ba số ít nên go → goes.", "went": "Went chuyển câu sang quá khứ, khác yêu cầu thói quen hiện tại.", "is going": "Is going nhấn hành động đang diễn ra hoặc sắp xếp, không phải cách diễn đạt thói quen được yêu cầu."}, "id": "c1q1"}, {"type": "mc", "q": "They ___ football when it started to rain. (đang chơi thì mưa)", "options": ["play", "played", "were playing", "have played"], "answers": ["were playing"], "explain": "Hành động đang diễn ra tại lúc một sự việc quá khứ xen vào: were + playing.", "optionNotes": {"play": "Hành động đang diễn ra tại lúc một sự việc quá khứ xen vào: were + playing.", "played": "Hành động đang diễn ra tại lúc một sự việc quá khứ xen vào: were + playing.", "were playing": "Hành động đang diễn ra tại lúc một sự việc quá khứ xen vào: were + playing.", "have played": "Hành động đang diễn ra tại lúc một sự việc quá khứ xen vào: were + playing."}, "id": "c1q2"}, {"type": "mc", "q": "I ___ this book since last Monday, and I am only halfway through.", "options": ["read", "have been reading", "was reading", "will read"], "answers": ["have been reading"], "explain": "Quá trình bắt đầu từ thứ Hai trước và vẫn tiếp tục: have been + V-ing.", "optionNotes": {"read": "Quá trình bắt đầu từ thứ Hai trước và vẫn tiếp tục: have been + V-ing.", "have been reading": "Quá trình bắt đầu từ thứ Hai trước và vẫn tiếp tục: have been + V-ing.", "was reading": "Quá trình bắt đầu từ thứ Hai trước và vẫn tiếp tục: have been + V-ing.", "will read": "Quá trình bắt đầu từ thứ Hai trước và vẫn tiếp tục: have been + V-ing."}, "id": "c1q3"}, {"type": "mc", "q": "Dùng tương lai hoàn thành: By next year, he ___ his degree.", "options": ["completes", "will complete", "will have completed", "completed"], "answers": ["will have completed"], "explain": "Tương lai hoàn thành: will have + V3. Will complete có thể xuất hiện trong câu khác, nhưng không đáp ứng dạng thì được yêu cầu.", "optionNotes": {"completes": "Tương lai hoàn thành: will have + V3. Will complete có thể xuất hiện trong câu khác, nhưng không đáp ứng dạng thì được yêu cầu.", "will complete": "Tương lai hoàn thành: will have + V3. Will complete có thể xuất hiện trong câu khác, nhưng không đáp ứng dạng thì được yêu cầu.", "will have completed": "Tương lai hoàn thành: will have + V3. Will complete có thể xuất hiện trong câu khác, nhưng không đáp ứng dạng thì được yêu cầu.", "completed": "Tương lai hoàn thành: will have + V3. Will complete có thể xuất hiện trong câu khác, nhưng không đáp ứng dạng thì được yêu cầu."}, "id": "c1q4"}, {"type": "mc", "q": "Dùng quá khứ hoàn thành: She ___ her homework before her mother came home.", "options": ["has finished", "finished", "had finished", "finishes"], "answers": ["had finished"], "explain": "Had + V3 là quá khứ hoàn thành. Finished cũng có thể diễn đạt trình tự này, nhưng đề yêu cầu cụ thể quá khứ hoàn thành.", "optionNotes": {"has finished": "Had + V3 là quá khứ hoàn thành. Finished cũng có thể diễn đạt trình tự này, nhưng đề yêu cầu cụ thể quá khứ hoàn thành.", "finished": "Had + V3 là quá khứ hoàn thành. Finished cũng có thể diễn đạt trình tự này, nhưng đề yêu cầu cụ thể quá khứ hoàn thành.", "had finished": "Had + V3 là quá khứ hoàn thành. Finished cũng có thể diễn đạt trình tự này, nhưng đề yêu cầu cụ thể quá khứ hoàn thành.", "finishes": "Had + V3 là quá khứ hoàn thành. Finished cũng có thể diễn đạt trình tự này, nhưng đề yêu cầu cụ thể quá khứ hoàn thành."}, "id": "c1q5"}, {"type": "mc", "q": "Look! The bus ___. (đang tiến lại gần)", "options": ["comes", "is coming", "came", "has come"], "answers": ["is coming"], "explain": "Hành động đang diễn ra lúc nói: is + coming.", "optionNotes": {"comes": "Hành động đang diễn ra lúc nói: is + coming.", "is coming": "Hành động đang diễn ra lúc nói: is + coming.", "came": "Hành động đang diễn ra lúc nói: is + coming.", "has come": "Hành động đang diễn ra lúc nói: is + coming."}, "id": "c1q6"}, {"type": "fill", "q": "She usually ___ (drink) tea in the morning. (thói quen hiện tại)", "answers": ["drinks"], "explain": "She + V-s/es ở hiện tại đơn.", "id": "c1q7"}, {"type": "fill", "q": "They ___ (visit) Paris last summer.", "answers": ["visited"], "explain": "Last summer là thời gian quá khứ đã kết thúc; dùng V2.", "id": "c1q8"}, {"type": "fill", "q": "Dùng tương lai hoàn thành: By the time you arrive, I ___ (finish) cooking.", "answers": ["will have finished"], "explain": "Việc nấu ăn hoàn tất trước mốc bạn đến trong tương lai.", "id": "c1q9"}, {"type": "fill", "q": "He ___ (work) here since 2019. (vẫn làm ở đây)", "answers": ["has worked", "has been working"], "explain": "Cả hai đúng: has worked nêu quá trình/sự gắn bó đến nay; has been working nhấn sự tiếp diễn.", "id": "c1q10"}, {"type": "fill", "q": "While she ___ (cook), the phone rang. (đang nấu)", "answers": ["was cooking"], "explain": "Was + V-ing mô tả hành động nền đang diễn ra.", "id": "c1q11"}, {"type": "fill", "q": "I ___ (not/see) that movie yet.", "answers": ["have not seen", "haven't seen"], "explain": "Hiện tại hoàn thành phủ định: have not + seen (V3).", "id": "c1q12"}, {"type": "error", "q": "She <u>go<\/u> to school every day.", "answers": ["goes"], "explain": "Chỉ sửa phần gạch chân: she → goes.", "id": "c1q13"}, {"type": "error", "q": "They <u>has<\/u> completed the project already.", "answers": ["have"], "explain": "They đi với have; has dùng với ngôi ba số ít.", "id": "c1q14"}, {"type": "error", "q": "Yesterday, I <u>go<\/u> to the cinema.", "answers": ["went"], "explain": "Yesterday đặt hành động trong quá khứ: go → went.", "id": "c1q15"}, {"type": "error", "q": "She <u>is knowing<\/u> the answer.", "answers": ["knows"], "explain": "Know ở nghĩa biết một đáp án là trạng thái; dùng hiện tại đơn.", "id": "c1q16"}, {"type": "error", "q": "He <u>has went<\/u> to the market.", "answers": ["has gone"], "explain": "Sau has trong hoàn thành phải là V3 gone, không phải V2 went.", "id": "c1q17"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Quá trình từ sáng đến hiện tại", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Present perfect continuous"], "explain": "Quá trình từ sáng đến hiện tại: Present perfect continuous.", "id": "c1q18"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Hành động hoàn tất hôm qua", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Past simple"], "explain": "Hành động hoàn tất hôm qua: Past simple.", "id": "c1q19"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Theo yêu cầu: dùng will + V", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Future simple"], "explain": "Theo yêu cầu: dùng will + V: Future simple.", "id": "c1q20"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Thói quen hiện tại mỗi ngày", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Present simple"], "explain": "Thói quen hiện tại mỗi ngày: Present simple.", "id": "c1q21"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Hành động đang diễn ra ngay lúc nói", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Present continuous"], "explain": "Hành động đang diễn ra ngay lúc nói: Present continuous.", "id": "c1q22"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Hành động hoàn tất năm ngoái", "options": ["Present perfect continuous", "Past simple", "Future simple", "Present simple", "Present continuous"], "answers": ["Past simple"], "explain": "Hành động hoàn tất năm ngoái: Past simple.", "id": "c1q23"}]}, {"id": "c2", "title": "Sự hòa hợp chủ ngữ – động từ", "summary": "Tìm chủ ngữ thật; phân biệt số, ngôi và cách nhìn một tập thể.", "theory": "<p>Động từ hữu hạn hòa hợp với chủ ngữ về ngôi và số khi dạng động từ có sự phân biệt đó. Hiện tại đơn: I/you/we/they work; he/she/it works. Với be: I am; she is; they are. Động từ thường ở quá khứ phần lớn không thay đổi theo số; be có was/were.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Cấu trúc<\/th><th>Quy tắc và ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Each / Every + N số ít; Each of + N số nhiều<\/td><td>Động từ số ít: Each of the students has a book.<\/td><\/tr><tr><td>Either / Neither đứng riêng<\/td><td>Dùng số ít trong văn phong trang trọng: Neither is correct. Neither of them are… cũng xuất hiện trong văn nói; bài này yêu cầu dạng trang trọng khi cần.<\/td><\/tr><tr><td>Either…or / Neither…nor<\/td><td>Thông thường hòa hợp với thành phần gần động từ: Neither the boys nor the teacher is here.<\/td><\/tr><tr><td>Many a / More than one + N số ít<\/td><td>Many a student has tried. More than one answer is possible.<\/td><\/tr><tr><td>No one / Nobody<\/td><td>Động từ số ít. No không tự quyết định số: No students are absent; no water is left.<\/td><\/tr><tr><td>None of<\/td><td>Với danh từ không đếm được: None of the water is left. Với danh từ số nhiều có thể số ít hoặc số nhiều tùy cách hiểu/văn phong.<\/td><\/tr><tr><td>All / Some / Most<\/td><td>Theo danh từ: All the money is gone. Most students are ready.<\/td><\/tr><tr><td>Both<\/td><td>Số nhiều: Both answers are correct.<\/td><\/tr><tr><td>A number of / The number of<\/td><td>A number of students are waiting. The number of students is increasing.<\/td><\/tr><tr><td>There + be<\/td><td>Hòa hợp với chủ ngữ phía sau: There is a book; there are two books. Danh sách hỗn hợp nên viết lại để tránh lựa chọn gây tranh luận.<\/td><\/tr><tr><td>Team / Family / Committee<\/td><td>Một đơn vị → thường số ít; nhìn các thành viên → số nhiều, phổ biến hơn trong Anh–Anh. Anh–Mỹ thường ưu tiên số ít.<\/td><\/tr><tr><td>Chủ ngữ + with / together with / as well as<\/td><td>Không làm chủ ngữ thành số nhiều: The teacher, with two students, is here.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Cách tìm chủ ngữ<\/b><div>The <b>quality<\/b> of these products <b>is<\/b> excellent. Quality là từ trung tâm; products nằm trong cụm bổ nghĩa. Đừng chia theo danh từ gần động từ nhất trừ cấu trúc có quy tắc riêng.<\/div><\/aside><p>Chủ ngữ nối and thường dùng số nhiều. Nhưng khi cùng chỉ một người hoặc một ý thống nhất có thể dùng số ít: The owner and manager is here (một người đảm nhiệm hai vai trò).<\/p>", "questions": [{"type": "mc", "q": "Each of the boys ___ ready now.", "options": ["is", "are", "were", "have been"], "answers": ["is"], "explain": "Each là trung tâm số ít; ready là tính từ, cần is trong hiện tại.", "optionNotes": c phù hợp: Each / Every", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Động từ số ít"], "explain": "Each / Every: Động từ số ít.", "id": "c2q20"}, {"type": "match", "q": "Chọn quy tắc phù hợp: A number of + N số nhiều", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Động từ số nhiều"], "explain": "A number of + N số nhiều: Động từ số nhiều.", "id": "c2q21"}, {"type": "match", "q": "Chọn quy tắc phù hợp: The number of + N số nhiều", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Động từ số ít"], "explain": "The number of + N số nhiều: Động từ số ít.", "id": "c2q22"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Either…or", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Theo thành phần gần động từ"], "explain": "Either…or: Theo thành phần gần động từ.", "id": "c2q23"}, {"type": "match", "q": "Chọn quy tắc phù hợp: Nobody", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Động từ số ít"], "explain": "Nobody: Động từ số ít.", "id": "c2q24"}, {"type": "match", "q": "Chọn quy tắc phù hợp: None of + N số nhiều", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Có thể số ít hoặc số nhiều"], "explain": "None of + N số nhiều: Có thể số ít hoặc số nhiều.", "id": "c2q25"}, {"type": "match", "q": "Chọn quy tắc phù hợp: There + be", "options": ["Động từ số ít", "Động từ số nhiều", "Theo thành phần gần động từ", "Có thể số ít hoặc số nhiều", "Theo chủ ngữ phía sau"], "answers": ["Theo chủ ngữ phía sau"], "explain": "There + be: Theo chủ ngữ phía sau.", "id": "c2q26"}]}, {"id": "c3", "title": "Mạo từ a, an, the và ∅", "summary": "Xét tính đếm được, sự xác định và âm đầu của từ theo sau.", "theory": "<p>A/an dùng với danh từ đếm được số ít khi chưa xác định hoặc để phân loại: She is a doctor. The cho biết người nghe có thể nhận ra đối tượng đang nói tới; không nhất thiết phải nhắc lần thứ hai: Close the door (cánh cửa hai người đều biết). ∅ là không dùng mạo từ.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Dạng<\/th><th>Cách dùng<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>Trước âm phụ âm; danh từ đếm được số ít<\/td><td>a book; a university (/j/); a useful tool<\/td><\/tr><tr><td>An<\/td><td>Trước âm nguyên âm; xét âm, không xét chữ<\/td><td>an hour; an honest person; an MBA; an X-ray; an heir<\/td><\/tr><tr><td>The<\/td><td>Đối tượng xác định, duy nhất trong ngữ cảnh; thường với so sánh nhất/số thứ tự<\/td><td>the sun; the best answer; the first chapter<\/td><\/tr><tr><td>∅<\/td><td>Danh từ số nhiều/không đếm được khi nói chung; nhiều tên riêng<\/td><td>Books are useful. Water is essential. Lan lives in Hanoi.<\/td><\/tr><tr><td>Địa danh<\/td><td>Tên sông, biển, đại dương, dãy núi thường có the<\/td><td>the Ganges; the Pacific; the Himalayas; nhưng Mount Everest<\/td><\/tr><tr><td>Nghề nghiệp / tần suất / giá<\/td><td>a/an theo âm; a có thể nghĩa mỗi<\/td><td>an engineer; twice a week; five dollars a kilo<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout warn\"><b>Đừng đồng nhất “trừu tượng” với “không đếm được”<\/b><div>An idea, a fear, a hope có cách dùng đếm được. Water thường không đếm được nhưng có thể dùng the khi xác định: the water in this bottle. Tên riêng cũng có ngoại lệ: the United States.<\/div><\/aside><h3>Nói chung và nói về một nhóm cụ thể<\/h3><p>Books are useful → sách nói chung. The books on this shelf are useful → những cuốn trên kệ này. Honesty matters → sự trung thực nói chung. The honesty of her answer impressed me → tính trung thực của câu trả lời cụ thể.<\/p><p>Tên thể thao thường không có mạo từ: play cricket, play football. Các cụm như go to school (đi học), go to the school (đến ngôi trường cụ thể) khác nhau về nghĩa. Với nhạc cụ, play the piano là mẫu cơ bản thường học; cách dùng có thể biến đổi theo ngữ cảnh.<\/p><aside class=\"callout note\"><b>Quy trình chọn<\/b><div>Danh từ có đếm được không? → số ít hay nhiều? → người nghe đã xác định được đối tượng chưa? → nếu dùng a/an, kiểm tra âm đầu.<\/div><\/aside>", "questions": [{"type": "mc", "q": "She is ___ honest girl.", "options": ["a", "an", "the", "∅"], "answers": ["an"], "explain": "Honest có h câm, bắt đầu bằng âm nguyên âm; danh từ đếm được số ít chưa xác định → an.", "optionNotes": {"a": "Honest có h câm, bắt đầu bằng âm nguyên âm; danh từ đếm được số ít chưa xác định → an.", "an": "Honest có h câm, bắt đầu bằng âm nguyên âm; danh từ đếm được số ít chưa xác định → an.", "the": "Honest có h câm, bắt đầu bằng âm nguyên âm; danh từ đếm được số ít chưa xác định → an.", "∅": "Honest có h câm, bắt đầu bằng âm nguyên âm; danh từ đếm được số ít chưa xác định → an."}, "id": "c3q1"}, {"type": "mc", "q": "___ sun rises in the east.", "options": ["A", "An", "The", "∅"], "answers": ["The"], "explain": "Mặt trời trong ngữ cảnh thông thường là đối tượng xác định duy nhất → the sun.", "optionNotes": {"A": "Mặt trời trong ngữ cảnh thông thường là đối tượng xác định duy nhất → the sun.", "An": "Mặt trời trong ngữ cảnh thông thường là đối tượng xác định duy nhất → the sun.", "The": "Mặt trời trong ngữ cảnh thông thường là đối tượng xác định duy nhất → the sun.", "∅": "Mặt trời trong ngữ cảnh thông thường là đối tượng xác định duy nhất → the sun."}, "id": "c3q2"}, {"type": "mc", "q": "He is ___ MLA from Delhi. (MLA đọc từng chữ: /em…/)", "options": ["a", "an", "the", "∅"], "answers": ["an"], "explain": "Tên chữ M bắt đầu bằng âm /e/ → an MLA /td><\/tr><tr><td>Quá khứ đơn<\/td><td>She wrote the report.<\/td><td>The report was written.<\/td><\/tr><tr><td>Quá khứ tiếp diễn<\/td><td>She was writing the report.<\/td><td>The report was being written.<\/td><\/tr><tr><td>Quá khứ hoàn thành<\/td><td>She had written the report.<\/td><td>The report had been written.<\/td><\/tr><tr><td>Tương lai đơn<\/td><td>She will write the report.<\/td><td>The report will be written.<\/td><\/tr><tr><td>Tương lai hoàn thành<\/td><td>She will have written it.<\/td><td>It will have been written.<\/td><\/tr><tr><td>Modal<\/td><td>She must finish it.<\/td><td>It must be finished.<\/td><\/tr><tr><td>Modal hoàn thành<\/td><td>They should have checked it.<\/td><td>It should have been checked.<\/td><\/tr><\/tbody><\/table><\/div><h3>Hai tân ngữ và đại từ<\/h3><p>She gave me a pen → I was given a pen / A pen was given to me. He showed us the way → We were shown the way / The way was shown to us. They sent him a gift → He was sent a gift / A gift was sent to him. Không phải mọi động từ có hai bổ ngữ đều chuyển được theo mọi cách; học theo mẫu từng động từ.<\/p><p>Khi trở thành tân ngữ sau by: I → me; we → us; he → him; she → her; they → them. Khi tân ngữ trở thành chủ ngữ: me → I; him → he; them → they.<\/p><aside class=\"callout warn\"><b>Giới hạn đúng của quy tắc<\/b><div>Động từ nội động như arrive thường không có bị động: He arrived, không phải He was arrived. Một số cụm có giới từ tạo được bị động: They looked after him → He was looked after. Một số động từ trạng thái vẫn có bị động: She is admired by her colleagues. Have ở nghĩa sở hữu thường không chuyển máy móc sang bị động.<\/div><\/aside><h3>Phân biệt be + tính từ và bị động<\/h3><p>Gold is a precious metal là câu có bổ ngữ danh từ, không phải bị động. The door is open thường mô tả trạng thái; The door was opened by the guard mô tả hành động bị động. By nêu tác nhân; with thường nêu công cụ: The bread was cut with a knife.<\/p><aside class=\"callout note\"><b>Áp dụng<\/b><div>Dùng bị động khi đối tượng/kết quả quan trọng hơn tác nhân, hoặc tác nhân không rõ: My bag has been stolen. Tránh thêm by someone/by them nếu không giúp người đọc hiểu thêm.<\/div><\/aside>", "questions": [{"type": "mc", "q": "Giữ thì: She writes a letter. →", "options": ["A letter is written by her.", "A letter was written by her.", "A letter writes by her.", "A letter is writing by her."], "answers": ["A letter is written by her."], "explain": "Hiện tại đơn bị động: is + written. Was đổi thì; writes/is writing là dạng chủ động, không phù hợp ý bị động.", "optionNotes": {"A letter is written by her.": "Hiện tại đơn bị động: is + written. Was đổi thì; writes/is writing là dạng chủ động, không phù hợp ý bị động.", "A letter was written by her.": "Hiện tại đơn bị động: is + written. Was đổi thì; writes/is writing là dạng chủ động, không phù hợp ý bị động.", "A letter writes by her.": "Hiện tại đơn bị động: is + written. Was đổi thì; writes/is writing là dạng chủ động, không phù hợp ý bị động.", "A letter is writing by her.": "Hiện tại đơn bị động: is + written. Was đổi thì; writes/is writing là dạng chủ động, không phù hợp ý bị động."}, "id": "c5q1"}, {"type": "mc", "q": "They are playing football. →", "options": ["Football is played by them.", "Football is being played by them.", "Football was being played by them.", "Football has been played by them."], "answers": ["Football is being played by them."], "explain": "Hiện tại tiếp diễn bị động: is being + played. Đây là bài chuyển cấu trúc; trong giao tiếp câu chủ động thường tự nhiên hơn.", "optionNotes": {"Football is played by them.": "Hiện tại tiếp diễn bị động: is being + played. Đây là bài chuyển cấu trúc; trong giao tiếp câu chủ động thường tự nhiên hơn.", "Football is being played by them.": "Hiện tại tiếp diễn bị động: is being + played. Đây là bài chuyển cấu trúc; trong giao tiếp câu chủ động thường tự nhiên hơn.", "Football was being played by them.": "Hiện tại tiếp diễn bị động: is being + played. Đây là bài chuyển cấu trúc; trong giao tiếp câu chủ động thường tự nhiên hơn.", "Football has been played by them.": "Hiện tại tiếp diễn bị động: is being + played. Đây là bài chuyển cấu trúc; trong giao tiếp câu chủ động thường tự nhiên hơn."}, "id": "c5q2"}, {"type": "mc", "q": "He has completed the work. →", "options": ["The work is completed by him.", "The work was completed by him.", "The work has been completed by him.", "The work had been completed by him."], "answers": ["The work has been completed by him."], "explain": "Giữ hiện tại hoàn thành: has been + completed.", "optionNotes": {"The work is completed by him.": "Giữ hiện tại hoàn thành: has been + completed.", "The work was completed by him.": "Giữ hiện tại hoàn thành: has been + completed.", "The work has been completed by him.": "Giữ hiện tại hoàn thành: has been + completed.", "The work had been completed by him.": "Giữ hiện tại hoàn thành: has been + completed."}, "id": "c5q3"}, {"type": "mc", "q": "I will help you. →", "options": ["You are helped by me.", "You will be helped by me.", "You were helped by me.", "You will have been helped by me."], "answers": ["You will be helped by me."], "explain": "Will + be + V3; will have been đổi thành tương lai hoàn thành.", "optionNotes": {"You are helped by me.": "Will + be + V3; will have been đổi thành tương lai hoàn thành.", "You will be helped by me.": "Will + be + V3; will have been đổi thành tương lai hoàn thành.", "You were helped by me.": "Will + be + V3; will have been đổi thành tương lai hoàn thành.", "You will have been helped by me.": "Will + be + V3; will have been đổi thành tương lai hoàn thành."}, "id": "c5q4"}, {"type": "mc", "q": "You should respect your parents. →", "options": ["Your parents should be respected by you.", "Your parents should respected by you.", "Your parents are respected by you.", "Your parents should being respected."], "answers": ["Your parents should be respected by you."], "explain": "Modal bị động: should + be + respected; không bỏ be hoặc thay bằng being.", "optionNotes": {"Your parents should be respected by you.": "Modal bị động: should + be + respected; không bỏ be hoặc thay bằng being.", "Your parents should respected by you.": "Modal bị động: should + be + respected; không bỏ be hoặc thay bằng being.", "Your parents are respected by you.": "Modal bị động: should + be + respected; không bỏ be hoặc thay bằng being.", "Your parents should being respected.": "Modal bị động: should + be + respected; không bỏ be hoặc thay bằng being."}, "id": "c5q5"}, {"type": "write", "q": "Chuyển sang bị động: She is reading a novel.", "answers": ["A novel is being read by her.", "A novel is being read."], "explain": "Is reading → is being read. Có thể bỏ by her nếu tác nhân không cần nhắc.", "id": "c5q6"}, {"type": "write", "q": "Chuyển sang bị động: They have completed the project.", "answers": ["The project has been completed by them.", "The project has been completed."], "explain": "Project số ít → has been completed.", "id": "c5q7"}, {"type": "write", "q": "Chuyển sang bị động: He will write a story.", "answers": ["A story will be written by him.", "A story will be written."], "explain": "Will write → will be written.", "id": "c5q8"}, {"type": "write", "q": "Chuyển sang bị động: The teacher explained the lesson.", "answers": ["The lesson was explained by the teacher."], "explain": "Quá khứ đơn → was explained.", "id": "c5q9"}, {"type": "write", "q": "Chuyển sang bị động tự nhiên: Someone has stolen my bag.", "answers": ["My bag has been stolen."], "explain": "Tác nhân someone không rõ, thường bỏ. Has stolen → has been stolen.", "id": "c5q10"}, {"type": "write", "q": "Chuyển sang bị động: They were decorating the hall.", "answers": ["The hall was being decorated by them.", "The hall was being decorated."], "explain": "The hall số ít → was being decorated.", "id": "c5q11"}, {"type": "error", "q": "The book was <u>write<\/u> by him.", "answers": ["written"], "explain": "Be + V3; written là V3 của write.", "id": "c5q12"}, {"type": "error", "q": "The letter <u>is wrote<\/u> by her every week.", "answers": ["is written"], "explain": "Wrote là V2; bị động cần written.", "id": "c5q13"}, {"type": "error", "q": "Dùng quá khứ tiếp diễn bị động: A cake <u>was making<\/u> by my mother.", "answers": ["was being made"], "explain": "Was being + made; was made đúng với quá khứ đơn nhưng không đúng dạng được yêu cầu.", "id": "c5q14"}, {"type": "error", "q": "The homework <u>must finished<\/u> today.", "answers": ["must be finished"], "explain": "Must + be + V3.", "id": "c5q15"}, {"type": "error", "q": "This house <u>build<\/u> in 1990.", "answers": ["was built"], "explain": "Sự việc quá khứ, chủ ngữ chịu tác động → was built.", "id": "c5q16"}]}, {"id": "c6", "title": "Câu tường thuật", "summary": "Theo dõi người nói, người nghe, thời điểm và nội dung còn đúng hay không.", "theory": "<p>Tường thuật gián tiếp kể lại nội dung, không nhất thiết lặp nguyên văn. Với câu kể: say + (that) + mệnh đề; tell + người nghe + (that) + mệnh đề. That thường có thể bỏ. Câu hỏi dùng if/whether hoặc từ hỏi; lời yêu cầu thường dùng ask/tell + O + to-V.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Khi chọn lùi thì<\/th><th>Dạng thường dùng<\/th><\/tr><\/thead><tbody><tr><td>Present simple →<\/td><td>Past simple<\/td><\/tr><tr><td>Present continuous →<\/td><td>Past continuous<\/td><\/tr><tr><td>Present perfect →<\/td><td>Past perfect<\/td><\/tr><tr><td>Past simple →<\/td><td>Past perfect (thường gặp khi lùi thì)<\/td><\/tr><tr><td>Past continuous →<\/td><td>Past perfect continuous<\/td><\/tr><tr><td>Will →<\/td><td>Would<\/td><\/tr><tr><td>Can →<\/td><td>Could<\/td><\/tr><tr><td>May →<\/td><td>Might<\/td><\/tr><tr><td>Must / Have to →<\/td><td>Had to khi tường thuật nghĩa vụ quá khứ; must có thể giữ ở nghĩa suy đoán hoặc khi còn phù hợp<\/td><\/tr><tr><td>Past perfect →<\/td><td>Giữ past perfect<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout warn\"><b>Không lùi thì máy móc<\/b><div>Nếu thông tin vẫn đúng/còn liên quan, có thể giữ hiện tại: She said she is happy. Said không tự động làm mọi thì hiện tại phía sau sai. Trong bài yêu cầu “lùi thì”, hãy thực hiện phép đổi theo yêu cầu; trong giao tiếp, xét ngữ cảnh.<\/div><\/aside><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Từ gốc<\/th><th>Có thể đổi khi góc nhìn đã thay đổi<\/th><\/tr><\/thead><tbody><tr><td>now<\/td><td>then<\/td><\/tr><tr><td>today<\/td><td>that day<\/td><\/tr><tr><td>tomorrow<\/td><td>the next/following day<\/td><\/tr><tr><td>yesterday<\/td><td>the previous day / the day before<\/td><\/tr><tr><td>ago<\/td><td>before<\/td><\/tr><tr><td>here<\/td><td>there<\/td><\/tr><tr><td>this / these<\/td><td>that / those<\/td><\/tr><tr><td>last week<\/td><td>the previous week / the week before<\/td><\/tr><tr><td>next week<\/td><td>the following week<\/td><\/tr><\/tbody><\/table><\/div><p>Chỉ đổi khi từ cũ không còn chỉ đúng thời gian/nơi chốn. I không luôn biến thành he/she: I said, “I am tired” → I said I was tired. Đại từ theo người được nhắc đến; you có thể là I, we, he, she, they hoặc giữ you tùy người nghe và người kể.<\/p><h3>Các loại câu<\/h3><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Loại<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>Yes/No<\/td><td>“Are you coming?” he asked me → He asked me if/whether I was coming.<\/td><\/tr><tr><td>Wh-question<\/td><td>“Where are you going?” → He asked me where I was going. Không đảo I was thành was I.<\/td><\/tr><tr><td>Yêu cầu<\/td><td>“Please help me,” he said to me → He asked me to help him.<\/td><\/tr><tr><td>Cấm/nhắc không làm<\/td><td>“Don’t make noise,” he said to the children → He told the children not to make noise.<\/td><\/tr><tr><td>Cảm thán<\/td><td>“What a lovely song!” → She exclaimed that it was a lovely song. Không tự thêm cảm xúc “vui mừng” nếu ngữ cảnh không cho biết.<\/td><\/tr><tr><td>Shall<\/td><td>Lời đề nghị “Shall I open it?” → He asked whether he should open it. Dự định tương lai có thể tường thuật bằng would; không đổi shall → should trong mọi câu.<\/td><\/tr><\/tbody><\/table><\/div><p>Tham khảo: <a href=\"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/reported-speech-statements\" target=\"_blank\" rel=\"noopener\">British Council — Reported speech: statements<\/a>.<\/p>", "questions": [{"type": "mc", "q": "Yêu cầu lùi thì: He said, “I am reading a book.” →", "options": ["He said that he is reading a book.", "He said that he was reading a book.", "He said that he has read a book.", "He said that he reads a book."], "answers": ["He said that he was reading a book."], "explain": "Am reading → was reading khi lùi thì. Is reading có thể phù hợp khi vẫn đang đọc, nhưng không làm phép lùi thì được yêu cầu.", "optionNotes": {"He said that he is reading a book.": "Am reading → was reading khi lùi thì. Is reading có thể phù hợp khi vẫn đang đọc, nhưng không làm phép lùi thì được yêu cầu.", "He said that he was reading a book.": "Am reading → was reading khi lùi thì. Is reading có thể phù hợp khi vẫn đang đọc, nhưng không làm phép lùi thì được yêu cầu.", "He said that he has read a book.": "Am reading → was reading khi lùi thì. Is reading có thể phù hợp khi vẫn đang đọc, nhưng không làm phép lùi thì được yêu cầu.", "He said that he reads a book.": "Am reading → was reading khi lùi thì. Is reading có thể phù hợp khi vẫn đang đọc, nhưng không làm phép lùi thì được yêu cầu."}, "id": "c6q1"}, {"type": "mc", "q": "Yêu cầu lùi thì; người được hỏi là tôi: “Where do you live?” she asked me. →", "options": ["She asked where I live.", "She asked where do I live.", "She asked where I lived.", "She asked where did I live."], "answers": ["She asked where I lived."], "explain": "Trật tự câu hỏi gián tiếp là where + S + V; live → lived theo yêu cầu.", "optionNotes": {"She asked where I live.": "Trật tự câu hỏi gián tiếp là where + S + V; live → lived theo yêu cầu.", "She asked where do I live.": "Trật tự câu hỏi gián tiếp là where + S + V; live → lived theo yêu cầu.", "She asked where I lived.": "Trật tự câu hỏi gián tiếp là where + S + V; live → lived theo yêu cầu.", "She asked where did I live.": "Trật tự câu hỏi gián tiếp là where + S + V; live → lived theo yêu cầu."}, "id": "c6q2"}, {"type": "mc", "q": "“Please open the window,” he said to me. Chọn câu có ask đúng cấu trúc.", "options": ["He asked me open the window.", "He asked me to open the window.", "He asked to me open the window.", "He asked me opening the window."], "answers": ["He asked me to open the window."], "explain": "Ask + người nghe + to-V: asked me to open.", "optionNotes": {"He asked me open the window.": "Ask + người nghe + to-V: asked me to open.", "He asked me to open the window.": "Ask + người nghe + to-V: asked me to open.", "He asked to me open the window.": "Ask + người nghe + to-V: asked me to open.", "He asked me opening the window.": "Ask + người nghe + to-V: asked me to open."}, "id": "c6q3"}, {"type": "mc", "q": "Yêu cầu lùi thì: “Did she go to school?” he asked. →", "options": ["He asked if she went to school.", "He asked if she had gone to school.", "He asked did she go to school.", "He asked whether she goes to school."], "answers": ["He asked if she had gone to school."], "explain": "Past simple → past perfect khi lùi thì: if she had gone. Không giữ trật tự câu hỏi did she go.", "optionNotes": {"He asked if she went to school.": "Past simple → past perfect khi lùi thì: if she had gone. Không giữ trật tự câu hỏi did she go.", "He asked if she had gone to school.": "Past simple → past perfect khi lùi thì: if she had gone. Không giữ trật tự câu hỏi did she go.", "He asked did she go to school.": "Past simple → past perfect khi lùi thì: if she had gone. Không giữ trật tự câu hỏi did she go.", "He asked whether she goes to school.": "Past simple → past perfect khi lùi thì: if she had gone. Không giữ trật tự câu hỏi did she go."}, "id": "c6q4"}, {"type": "mc", "q": "Tường thuật cảm thán ở quá khứ: “What a lovely song!” →", "options": ["She exclaimed what a lovely song.", "She exclaimed that it was a lovely song.", "She exclaimed that it a lovely song.", "She exclaimed that the song lovely."], "answers": ["She exclaimed that it was a lovely song."], "explain": "Mệnh đề that cần chủ ngữ và động từ: it was a lovely song.", "optionNotes": {"She exclaimed what a lovely song.": "Mệnh đề that cần chủ ngữ và động từ: it was a lovely song.", "She exclaimed that it was a lovely song.": "Mệnh đề that cần chủ ngữ và động từ: it was a lovely song.", "She exclaimed that it a lovely song.": "Mệnh đề that cần chủ ngữ và động từ: it was a lovely song.", "She exclaimed that the song lovely.": "Mệnh đề that cần chủ ngữ và động từ: it was a lovely song."}, "id": "c6q5"}, {"type": "write", "q": "Lùi thì: He said, “I am happy.”", "answers": ["He said that he was happy."], "explain": "Am → was; I chỉ he. Có thể bỏ that.", "id": "c6q6"}, {"type": "write", "q": "Cô ấy nói với tôi hôm qua; lùi thì và đổi thời gian: She said, “I will call you tomorrow.”", "answers": ["She said that she would call me the next day.", "She said she would call me the following day."], "explain": "You là tôi trong ngữ cảnh này; will → would; tomorrow → the next/following day theo yêu cầu.", "id": "c6q7"}, {"type": "write", "q": "“Don’t make noise,” he said to the children.", "answers": ["He told the children not to make noise."], "explain": "Tell + O + not to-V.", "id": "c6q8"}, {"type": "write", "q": "Lùi thì: “Where are you going?” he asked me.", "answers": ["He asked me where I was going."], "explain": "Câu hỏi gián tiếp dùng S + V, không đảo trợ động từ.", "id": "c6q9"}, {"type": "write", "q": "Lùi thì: “I have finished my homework,” she said.", "answers": ["She said that she had finished her homework."], "explain": "Have finished → had finished; my theo người nói she → her.", "id": "c6q10"}, {"type": "error", "q": "Theo yêu cầu lùi thì: She said that she <u>is<\/u> happy.", "answers": ["was"], "explain": "Sửa theo yêu cầu lùi thì. Is không sai tuyệt đối nếu trạng thái còn đúng.", "id": "c6q11"}, {"type": "error", "q": "He asked me where <u>did I live<\/u>.", "answers": ["I lived"], "explain": "Câu hỏi gián tiếp giữ trật tự chủ ngữ trước động từ.", "id": "c6q12"}, {"type": "error", "q": "She told <u>to me<\/u> that she was tired.", "answers": ["me"], "explain": "Tell + O; say to + O. Không dùng told to me ở cấu trúc này.", "id": "c6q13"}, {"type": "error", "q": "Lùi thì và đổi thời gian: He said that he <u>will come tomorrow<\/u>.", "answers": ["would come the next day"], "explain": "Sửa cả will và từ thời gian theo yêu cầu, không chỉ tomorrow.", "id": "c6q14"}, {"type": "error", "q": "Theo yêu cầu lùi thì: She asked if I <u>can<\/u> help her.", "answers": ["could"], "explain": "Can → could khi lùi thì.", "id": "c6q15"}]}, {"id": "c7", "title": "Tìm và sửa lỗi trong câu", "summary": "Phân biệt lỗi cấu trúc, ý nghĩa, ngữ cảnh và lựa chọn văn phong.", "theory": "<p>Đọc toàn câu trước, xác định điều cần diễn đạt rồi xét cấu trúc. Câu không giống đáp án mẫu chưa chắc sai. Có ba nhãn cần phân biệt: <b>sai ngữ pháp<\/b>, <b>đúng nhưng không đúng ý/ngữ cảnh<\/b>, và <b>đúng nhưng có thể viết tự nhiên hơn<\/b>.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Điểm kiểm tra<\/th><th>Sai → đúng / lưu ý<\/th><\/tr><\/thead><tbody><tr><td>Thì<\/td><td>She go yesterday → She went yesterday.<\/td><\/tr><tr><td>Hòa hợp<\/td><td>The boys is here → The boys are here.<\/td><\/tr><tr><td>Mạo từ<\/td><td>a honest person → an honest person.<\/td><\/tr><tr><td>Giới từ<\/td><td>good in English → good at English khi nói giỏi môn tiếng Anh.<\/td><\/tr><tr><td>Bị động<\/td><td>The book was write → The book was written.<\/td><\/tr><tr><td>Song song<\/td><td>She likes reading, to write and cooking → reading, writing and cooking.<\/td><\/tr><tr><td>So sánh<\/td><td>more better → better; most best → best.<\/td><\/tr><tr><td>Phủ định chuẩn<\/td><td>I don’t have no money → I don’t have any money. Phủ định hòa hợp tồn tại trong một số phương ngữ, nhưng bài này luyện tiếng Anh chuẩn.<\/td><\/tr><tr><td>Từ bổ nghĩa<\/td><td>Almost all the students passed (gần như tất cả đỗ) ≠ All the students almost passed (tất cả suýt đỗ).<\/td><\/tr><tr><td>Văn phong<\/td><td>Very, very good có thể nhấn mạnh hợp lệ. Unique và special không phải đồng nghĩa hoàn toàn; chỉnh cho gọn tùy ý muốn nói.<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Checklist<\/b><div>Tìm chủ ngữ và động từ hữu hạn → xem thì và hòa hợp → kiểm tra bổ ngữ/tân ngữ → mạo từ, giới từ → đại từ tham chiếu → song song, so sánh → đọc lại toàn câu sau khi sửa.<\/div><\/aside><h3>Bài có đáp án “không có lỗi”<\/h3><p>Đừng ép một câu đúng thành sai. She said she is happy có thể đúng khi điều đó còn đúng. In a chair có thể đúng. Một bài hỏi vị trí lỗi phải tách lựa chọn A/B/C/D khỏi “Không có lỗi”.<\/p>", "questions": [{"type": "mc", "q": "She (A) | don’t (B) | like (C) | coffee (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["B"], "explain": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B.", "optionNotes": {"A": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B.", "B": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B.", "C": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B.", "D": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B.", "Không có lỗi": "She ở ngôi ba số ít → doesn’t + like; sửa đoạn B."}, "id": "c7q1"}, {"type": "mc", "q": "He has (A) | a (B) | unique (C) | talent (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["Không có lỗi"], "explain": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc.", "optionNotes": {"A": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc.", "B": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc.", "C": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc.", "D": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc.", "Không có lỗi": "Unique bắt đầu bằng âm /j/ nên a unique là đúng; câu đủ cấu trúc."}, "id": "c7q2"}, {"type": "mc", "q": "The book (A) | was (B) | write (C) | by him (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["C"], "explain": "Was + V3 → written, sửa đoạn C.", "optionNotes": {"A": "Was + V3 → written, sửa đoạn C.", "B": "Was + V3 → written, sửa đoạn C.", "C": "Was + V3 → written, sửa đoạn C.", "D": "Was + V3 → written, sửa đoạn C.", "Không có lỗi": "Was + V3 → written, sửa đoạn C."}, "id": "c7q3"}, {"type": "mc", "q": "She said (A) | that she (B) | is happy (C) | with her new job (D). Thông tin vẫn đúng.", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["Không có lỗi"], "explain": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was.", "optionNotes": {"A": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was.", "B": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was.", "C": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was.", "D": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was.", "Không có lỗi": "Thông tin còn đúng cho phép giữ hiện tại is; không buộc đổi thành was."}, "id": "c7q4"}, {"type": "mc", "q": "Each of the boys (A) | have (B) | finished (C) | their homework (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["B"], "explain": "Each of → has. Their trung tính không làm have trở thành đúng.", "optionNotes": {"A": "Each of → has. Their trung tính không làm have trở thành đúng.", "B": "Each of → has. Their trung tính không làm have trở thành đúng.", "C": "Each of → has. Their trung tính không làm have trở thành đúng.", "D": "Each of → has. Their trung tính không làm have trở thành đúng.", "Không có lỗi": "Each of → has. Their trung tính không làm have trở thành đúng."}, "id": "c7q5"}, {"type": "error", "q": "He <u>is married with<\/u> her since 2015. (vẫn là vợ chồng)", "answers": ["has been married to"], "explain": "Trạng thái từ 2015 đến nay → has been; cụm married to. Sửa cả thì lẫn giới từ.", "id": "c7q6"}, {"type": "error", "q": "This is <u>more better<\/u> than that one.", "answers": ["better"], "explain": "Better đã là so sánh hơn của good/well.", "id": "c7q7"}, {"type": "error", "q": "I don’t have <u>no<\/u> money left. (tiếng Anh chuẩn)", "answers": ["any"], "explain": "Sau don’t, dùng any để diễn tả không còn tiền.", "id": "c7q8"}, {"type": "write", "q": "Viết gọn nếu chỉ muốn nói tài năng khác biệt: He has a unique special talent for music.", "answers": ["He has a unique talent for music."], "explain": "Đây là chỉnh văn phong theo ý yêu cầu, không phải unique và special lúc nào cũng đồng nghĩa. Không chấm tự động một cách viết duy nhất.", "id": "c7q9"}, {"type": "error", "q": "She likes reading, <u>to write<\/u> and cooking.", "answers": ["writing"], "explain": "Ba thành phần liệt kê cùng dạng V-ing.", "id": "c7q10"}, {"type": "write", "q": "Viết bằng tiếng Anh: Gần như tất cả học sinh trong lớp đã đỗ kỳ thi.", "answers": ["Almost all the students in the class passed the exam."], "explain": "Almost bổ nghĩa cho all để chỉ gần như tất cả; không đặt almost trước passed nếu muốn giữ nghĩa này.", "id": "c7q11"}]}, {"id": "c8", "title": "Từ vựng: nghĩa, từ loại và gốc từ", "summary": "Học từ trong cụm và ngữ cảnh; không thay thế đồng nghĩa máy móc.", "theory": "<div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Từ<\/th><th>Từ loại<\/th><th>Nghĩa hữu ích<\/th><\/tr><\/thead><tbody><tr><td>polyglot<\/td><td>N / Adj<\/td><td>Người biết nhiều ngôn ngữ / đa ngôn ngữ<\/td><\/tr><tr><td>philanthropist<\/td><td>N<\/td><td>Người đóng góp tiền/nguồn lực cho phúc lợi xã hội, thiện nguyện<\/td><\/tr><tr><td>altruist<\/td><td>N<\/td><td>Người quan tâm lợi ích người khác một cách vị tha<\/td><\/tr><tr><td>insomniac<\/td><td>N / Adj<\/td><td>Người bị mất ngủ / liên quan mất ngủ<\/td><\/tr><tr><td>introvert<\/td><td>N<\/td><td>Người hướng nội; không có nghĩa bắt buộc tránh né xã hội<\/td><\/tr><tr><td>sage<\/td><td>N / Adj<\/td><td>Người thông thái / khôn ngoan<\/td><\/tr><tr><td>omniscient<\/td><td>Adj<\/td><td>Biết mọi thứ; thường dùng trong omniscient narrator (người kể toàn tri)<\/td><\/tr><tr><td>antiquarian<\/td><td>N / Adj<\/td><td>Người nghiên cứu/sưu tầm cổ vật, sách cổ; liên quan đồ cổ<\/td><\/tr><tr><td>nyctophobia / acrophobia<\/td><td>N<\/td><td>Chứng sợ bóng tối / độ cao<\/td><\/tr><tr><td>ornithology<\/td><td>N<\/td><td>Ngành nghiên cứu chim<\/td><\/tr><tr><td>exquisite<\/td><td>Adj<\/td><td>Tinh xảo, đẹp tinh tế; nghĩa cụ thể tùy danh từ đi kèm<\/td><\/tr><tr><td>bliss / grief<\/td><td>N<\/td><td>Hạnh phúc lớn / nỗi đau buồn sâu sắc<\/td><\/tr><tr><td>library<\/td><td>N<\/td><td>Thư viện, nơi tổ chức tài liệu để đọc/tra cứu/mượn<\/td><\/tr><tr><td>dismiss<\/td><td>V<\/td><td>Sa thải; bác bỏ; cho phép rời đi tùy ngữ cảnh<\/td><\/tr><\/tbody><\/table><\/div><h3>Cặp dễ nhầm<\/h3><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Cặp<\/th><th>Phân biệt<\/th><\/tr><\/thead><tbody><tr><td>accept / except<\/td><td>V chấp nhận / thường là giới từ ngoại trừ<\/td><\/tr><tr><td>advice / advise<\/td><td>N không đếm được lời khuyên / V khuyên<\/td><\/tr><tr><td>affect / effect<\/td><td>Thường gặp: V ảnh hưởng / N tác động, kết quả. Effect cũng là V tạo ra; affect có cách dùng danh từ chuyên biệt.<\/td><\/tr><tr><td>complement / compliment<\/td><td>Bổ sung để hoàn thiện / lời khen, khen; cả hai có thể N hoặc V.<\/td><\/tr><tr><td>principal / principle<\/td><td>Hiệu trưởng; chính, chủ yếu / nguyên tắc<\/td><\/tr><tr><td>stationary / stationery<\/td><td>Adj đứng yên / N văn phòng phẩm<\/td><\/tr><tr><td>elicit / illicit<\/td><td>V gợi ra phản ứng / Adj bất hợp pháp<\/td><\/tr><\/tbody><\/table><\/div><h3>Đồng nghĩa và trái nghĩa<\/h3><p>Gần nghĩa: abandon ≈ desert (bỏ rơi); ability ≈ capability; abundant ≈ plentiful; allow ≈ permit; accurate ≈ correct; achieve ≈ accomplish; brave ≈ courageous; calm ≈ quiet trong một số ngữ cảnh; clever ≈ intelligent; easy ≈ simple trong một số ngữ cảnh. Không phải lúc nào cũng thay trực tiếp: a simple problem có thể vẫn khó giải. Plenty thường dùng trong plenty of + N, không thay thẳng abundant trước danh từ.<\/p><p>Trái nghĩa thường gặp: absent ↔ present; accept ↔ refuse; ancient ↔ modern; arrive ↔ depart; complex ↔ simple; create ↔ destroy; deep ↔ shallow; early ↔ late; fail ↔ succeed; famous ↔ unknown. Xét cùng nghĩa và từ loại trước khi thay.<\/p><div class=\"table-wrap\" tabindex=\"0\" aria-label=\"Bảng tham khảo, cuộn ngang nếu cần\"><table><thead><tr><th>Gốc từ<\/th><th>Gợi nghĩa<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody><tr><td>bene<\/td><td>tốt<\/td><td>benefit, benevolent, beneficial<\/td><\/tr><tr><td>mal<\/td><td>xấu<\/td><td>malice, malicious, maltreat<\/td><\/tr><tr><td>dict<\/td><td>nói<\/td><td>dictate, dictionary, predict<\/td><\/tr><tr><td>struct<\/td><td>xây dựng<\/td><td>structure, construct, destruction<\/td><\/tr><tr><td>port<\/td><td>mang<\/td><td>transport, import, export<\/td><\/tr><tr><td>scrib/script<\/td><td>viết<\/td><td>describe, script, inscription<\/td><\/tr><tr><td>vid/vis<\/td><td>nhìn<\/td><td>visible, vision, provide (liên hệ lịch sử; không suy nghĩa hiện tại theo từng mảnh máy móc)<\/td><\/tr><tr><td>chron<\/td><td>thời gian<\/td><td>chronic, synchronize<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"callout note\"><b>Cách học<\/b><div>Nghĩa trong câu → từ loại → cụm đi kèm → tự viết một câu. Tên các chứng sợ ít gặp nên để mở rộng; ưu tiên advice, affect, achieve, provide, accurate cho giao tiếp và bài thi.<\/div><\/aside>", "questions": [{"type": "mc", "q": "A person who speaks several languages:", "options": ["Polyglo , "B", "C", "D", "Không có lỗi"], "answers": ["C"], "explain": "One of the + N số nhiều → best players.", "optionNotes": {"A": "One of the + N số nhiều → best players.", "B": "One of the + N số nhiều → best players.", "C": "One of the + N số nhiều → best players.", "D": "One of the + N số nhiều → best players.", "Không có lỗi": "One of the + N số nhiều → best players."}, "id": "c9q2"}, {"type": "mc", "q": "Văn phong trang trọng: Neither of the answers (A) | are (B) | correct (C) | according to the key (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["B"], "explain": "Đề quy định dạng trang trọng: neither of → is.", "optionNotes": {"A": "Đề quy định dạng trang trọng: neither of → is.", "B": "Đề quy định dạng trang trọng: neither of → is.", "C": "Đề quy định dạng trang trọng: neither of → is.", "D": "Đề quy định dạng trang trọng: neither of → is.", "Không có lỗi": "Đề quy định dạng trang trọng: neither of → is."}, "id": "c9q3"}, {"type": "mc", "q": "She has been (A) | working here (B) | since (C) | three years (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["C"], "explain": "Three years là khoảng thời gian; since → for.", "optionNotes": {"A": "Three years là khoảng thời gian; since → for.", "B": "Three years là khoảng thời gian; since → for.", "C": "Three years là khoảng thời gian; since → for.", "D": "Three years là khoảng thời gian; since → for.", "Không có lỗi": "Three years là khoảng thời gian; since → for."}, "id": "c9q4"}, {"type": "mc", "q": "I look forward (A) | to meet (B) | you (C) | next week (D).", "options": ["A", "B", "C", "D", "Không có lỗi"], "answers": ["B"], "explain": "To thuộc cụm giới từ look forward to; sau đó dùng V-ing: to meeting.", "optionNotes": {"A": "To thuộc cụm giới từ look forward to; sau đó dùng V-ing: to meeting.", "B": "To thuộc cụm giới từ look forward to; sau đó dùng V-ing: to meeting.", "C": "To thuộc cụm giới từ look forward to; sau đó dùng V-ing: to meeting.", "D": "To thuộc cụm giới từ loo
