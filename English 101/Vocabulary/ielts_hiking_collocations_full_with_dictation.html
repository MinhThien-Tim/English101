<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Hiking · Collocations Flashcards (Units 1–19, Full Set)</title>
<style>
  :root{
    --ink:#1c2430; --sub:#5b6675; --line:#e2e6ec; --bg:#f4f6f9;
    --card:#ffffff; --accent:#2f5d8a; --accent2:#c0392b; --soft:#eef2f7;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); padding:24px 16px 60px;}
  header{max-width:1200px; margin:0 auto 6px; border-bottom:2px solid var(--ink); padding-bottom:10px; font-family:Arial,Helvetica,sans-serif;}
  header h1{font-size:16px; margin:0;}
  header .sub{font-size:12px; color:var(--sub); margin-top:2px;}
  .toolbar{max-width:1200px; margin:14px auto 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-family:Arial,Helvetica,sans-serif; font-size:13px; position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:5;}
  .toolbar button, .toolbar select{border:1px solid var(--ink); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px;}
  .toolbar button:hover{background:var(--ink); color:#fff;}
  .progress{color:var(--sub); margin-left:auto;}
  .filter-input{font-family:Arial,sans-serif; padding:6px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; min-width:180px;}
  .unit-nav{max-width:1200px; margin:0 auto 10px; font-family:Arial,sans-serif; font-size:12px; color:var(--sub); display:flex; flex-wrap:wrap; gap:6px;}
  .unit-nav a{color:var(--accent); text-decoration:none; border:1px solid var(--line); padding:3px 8px; border-radius:5px;}
  .unit-nav a:hover{background:var(--soft);}
  .unit-block{max-width:1200px; margin:0 auto 30px; scroll-margin-top:70px;}
  .unit-title{font-family:Arial,sans-serif; font-size:15px; font-weight:bold; color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:6px; margin:26px 0 12px;}
  .word-group{margin-bottom:18px;}
  .word-head{font-family:Arial,sans-serif; font-size:13px; font-weight:bold; color:var(--accent2); margin:14px 0 8px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:170px; padding:14px; cursor:pointer; position:relative; transition:box-shadow .15s, transform .1s; display:flex; flex-direction:column;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08); transform:translateY(-1px);}
  .card .tag{position:absolute; top:8px; right:10px; font-family:Arial,sans-serif; font-size:10px; color:var(--sub); background:var(--soft); padding:2px 6px; border-radius:4px;}
  .card .dots{display:flex; gap:4px; margin-top:auto; padding-top:8px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line);}
  .dot.on{background:var(--accent);}
  .colloc{font-size:16.5px; font-weight:bold; margin-bottom:4px; padding-right:60px;}
  .label{font-family:Arial,sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); margin-bottom:4px; font-weight:bold;}
  .vi{font-size:15px; line-height:1.4;}
  .ex-en{font-size:13.5px; line-height:1.45;}
  .ex-vi{font-size:13px; color:var(--sub); font-style:italic; line-height:1.45; margin-top:6px;}
  .hint{font-family:Arial,sans-serif; font-size:11px; color:var(--sub); margin-top:auto; padding-top:8px; text-align:right;}

  /* ===== DICTATION ===== */
  .study-tabs{
    max-width:1200px;margin:12px auto 2px;display:flex;gap:8px;
    font-family:Arial,Helvetica,sans-serif;
  }
  .study-tab{
    flex:1;border:1px solid var(--ink);background:var(--card);color:var(--ink);
    padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;
  }
  .study-tab.active{background:var(--ink);color:#fff;}
  .study-panel{display:none;}
  .study-panel.active{display:block;}

  .dict-wrap{
    max-width:900px;margin:14px auto 0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:22px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
    font-family:Arial,Helvetica,sans-serif;
  }
  .dict-wrap h2{margin:0 0 5px;font-size:21px;color:var(--accent);}
  .dict-sub{font-size:13px;color:var(--sub);margin-bottom:18px;line-height:1.5;}
  .dict-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .dict-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--sub);font-weight:700;margin-bottom:5px;}
  .dict-field select,.dict-answer{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--ink);font-size:14px;
  }
  .dict-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);margin-bottom:7px;}
  .dict-progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .dict-progress > div{height:100%;width:0;background:var(--accent);}
  .dict-prompt{font-family:Georgia,'Times New Roman',serif;font-size:clamp(24px,4vw,32px);
    font-weight:bold;line-height:1.3;margin:8px 0 7px;}
  .dict-hint{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.45;}
  .dict-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .dict-btn{
    border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 14px;
    border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;
  }
  .dict-btn.secondary{background:#fff;color:var(--ink);}
  .dict-feedback{display:none;margin-top:12px;padding:11px 13px;border-radius:8px;line-height:1.5;font-size:13px;}
  .dict-feedback.good{display:block;background:#e7f5ec;color:#21633f;}
  .dict-feedback.bad{display:block;background:#fae8e6;color:#9c382f;}
  .dict-end{display:none;text-align:center;padding:8px 0 2px;}
  .dict-end-score{font-size:34px;font-weight:800;color:var(--accent);margin-bottom:5px;}
  @media(max-width:700px){
    .dict-grid{grid-template-columns:1fr;}
    .dict-wrap{margin-left:0;margin-right:0;padding:16px;}
  }

</style>
</head>
<body>

<header>
  <h1>IELTS HIKING · COLLOCATIONS BANK</h1>
  <div class="sub">Flashcards đầy đủ · Unit 1–19 · Vocabulary for IELTS – Collocations</div>

<div id="dictationPanel" class="study-panel">
  <div class="dict-wrap">
    <div id="dictSetup">
      <h2>Chính tả Collocations</h2>
      <div class="dict-sub">
        Luyện trực tiếp giữa <b>Collocation tiếng Anh</b> và <b>Nghĩa tiếng Việt</b>.
      </div>

      <div class="dict-grid">
        <div class="dict-field">
          <label>Unit</label>
          <select id="dictUnit">
            <option value="all">Tất cả Units (1–19)</option>
          </select>
        </div>
        <div class="dict-field">
          <label>Hướng luyện</label>
          <select id="dictDirection">
            <option value="en-vi">English Collocation → Vietnamese</option>
            <option value="vi-en">Vietnamese → English Collocation</option>
          </select>
        </div>
        <div class="dict-field">
          <label>Số câu</label>
          <select id="dictCount">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="9999">Tất cả</option>
          </select>
        </div>
      </div>

      <button class="dict-btn" id="dictStart">BẮT ĐẦU</button>
    </div>

    <div id="dictPlay" style="display:none">
      <div class="dict-meta">
        <span id="dictCounter">Câu 1</span>
        <span id="dictScore">Đúng: 0</span>
      </div>
      <div class="dict-progress"><div id="dictProgress"></div></div>

      <div class="dict-prompt" id="dictPrompt">—</div>
      <div class="dict-hint" id="dictHint"></div>

      <input id="dictAnswer" class="dict-answer" autocomplete="off" spellcheck="false" placeholder="Nhập đáp án...">

      <div class="dict-actions">
        <button class="dict-btn" id="dictCheck">KIỂM TRA</button>
        <button class="dict-btn secondary" id="dictNext" style="display:none">TIẾP →</button>
      </div>
      <div id="dictFeedback" class="dict-feedback"></div>
    </div>

    <div id="dictEnd" class="dict-end">
      <div id="dictFinalScore" class="dict-end-score">0 / 0</div>
      <div id="dictFinalText"></div>
      <div class="dict-actions" style="justify-content:center;margin-top:14px;">
        <button class="dict-btn" id="dictAgain">LÀM LẠI</button>
        <button class="dict-btn secondary" id="dictRetryWrong">LUYỆN CÂU SAI</button>
      </div>
    </div>
  </div>
</div>


<script>
const DATA = [

{u:1,w:"client",pos:"n. – khách hàng",c:"a firm's client",vi:"khách hàng của một công ty",en:"Most of our firm's clients are small businesses needing legal advice.",exvi:"Phần lớn khách hàng của công ty chúng tôi là các doanh nghiệp nhỏ cần tư vấn pháp lý."},
{u:1,w:"client",pos:"n. – khách hàng",c:"advise / represent a client",vi:"tư vấn / đại diện cho khách hàng",en:"1) Lawyers are paid to advise their clients on complex contracts.<br>2) A good solicitor will represent a client fairly in court.",exvi:"1) Luật sư được trả tiền để tư vấn cho khách hàng về các hợp đồng phức tạp.<br>2) Một luật sư giỏi sẽ đại diện cho khách hàng một cách công bằng tại tòa."},
{u:1,w:"client",pos:"n. – khách hàng",c:"a prospective client",vi:"khách hàng tiềm năng",en:"We always prepare carefully before meeting a prospective client.",exvi:"Chúng tôi luôn chuẩn bị kỹ trước khi gặp một khách hàng tiềm năng."},

{u:1,w:"parent",pos:"n. – cha mẹ, phụ huynh",c:"the parents of someone",vi:"cha mẹ của ai đó",en:"The parents of young children often struggle to find time for themselves.",exvi:"Cha mẹ của trẻ nhỏ thường khó tìm được thời gian cho bản thân."},
{u:1,w:"parent",pos:"n. – cha mẹ, phụ huynh",c:"a foster / adoptive / birth parent",vi:"cha mẹ nuôi dưỡng / cha mẹ nhận nuôi / cha mẹ ruột",en:"1) A foster parent looks after a child for a short period.<br>2) Her adoptive parents raised her with great love.<br>3) Some children never meet their birth parents.",exvi:"1) Cha mẹ nuôi dưỡng chăm sóc một đứa trẻ trong thời gian ngắn.<br>2) Cha mẹ nhận nuôi đã nuôi dạy cô bằng tình yêu thương lớn lao.<br>3) Một số đứa trẻ không bao giờ gặp được cha mẹ ruột."},
{u:1,w:"parent",pos:"n. – cha mẹ, phụ huynh",c:"a single / lone parent",vi:"cha/mẹ đơn thân",en:"1) Being a single parent while working full-time is exhausting.<br>2) Lone parents often rely on support from the government.",exvi:"1) Làm cha/mẹ đơn thân khi vẫn đi làm toàn thời gian rất mệt mỏi.<br>2) Các bậc cha mẹ đơn thân thường phải dựa vào hỗ trợ của chính phủ."},

{u:1,w:"sibling",pos:"n. – anh / chị / em ruột",c:"a younger / elder sibling",vi:"em / anh chị lớn hơn",en:"1) My younger sibling always copies everything I do.<br>2) As the elder sibling, I had to set a good example.",exvi:"1) Đứa em của tôi luôn bắt chước mọi thứ tôi làm.<br>2) Là anh/chị lớn, tôi phải làm gương tốt."},
{u:1,w:"sibling",pos:"n. – anh / chị / em ruột",c:"sibling rivalry",vi:"sự ganh đua giữa anh chị em",en:"Sibling rivalry is common when children are close in age.",exvi:"Sự ganh đua giữa anh chị em rất phổ biến khi các con xấp xỉ tuổi nhau."},

{u:1,w:"autonomous",pos:"adj. – tự chủ, tự trị",c:"an autonomous individual",vi:"một cá nhân tự chủ",en:"University encourages students to become autonomous individuals who think for themselves.",exvi:"Đại học khuyến khích sinh viên trở thành những cá nhân tự chủ biết tự suy nghĩ."},
{u:1,w:"autonomous",pos:"adj. – tự chủ, tự trị",c:"an autonomous region / republic / province",vi:"vùng / nước cộng hòa / tỉnh tự trị",en:"1) The area was granted status as an autonomous region.<br>2) It became an autonomous republic after the war.<br>3) The government created an autonomous province with its own laws.",exvi:"1) Khu vực này được trao quy chế là một vùng tự trị.<br>2) Nó trở thành một nước cộng hòa tự trị sau chiến tranh.<br>3) Chính phủ lập ra một tỉnh tự trị có luật riêng."},
{u:1,w:"autonomous",pos:"adj. – tự chủ, tự trị",c:"fiercely / relatively / largely autonomous",vi:"tự chủ mạnh mẽ / tương đối / phần lớn",en:"1) Each department is fiercely autonomous and resists central control.<br>2) The team is relatively autonomous but still reports to a manager.<br>3) The branch remains largely autonomous in daily decisions.",exvi:"1) Mỗi phòng ban tự chủ rất mạnh và chống lại sự kiểm soát tập trung.<br>2) Nhóm tương đối tự chủ nhưng vẫn báo cáo cho một quản lý.<br>3) Chi nhánh phần lớn tự chủ trong các quyết định hằng ngày."},

{u:1,w:"consistent",pos:"adj. – nhất quán, ổn định",c:"a consistent player / performer",vi:"một cầu thủ / người thể hiện ổn định",en:"1) He is a consistent player who rarely has a bad game.<br>2) Investors prefer a consistent performer over a risky one.",exvi:"1) Anh ấy là một cầu thủ ổn định, hiếm khi chơi tệ.<br>2) Nhà đầu tư thích một bên thể hiện ổn định hơn là rủi ro."},
{u:1,w:"consistent",pos:"adj. – nhất quán, ổn định",c:"consistent with something",vi:"phù hợp / nhất quán với điều gì",en:"Her answers were consistent with the facts we already knew.",exvi:"Câu trả lời của cô ấy nhất quán với những dữ kiện chúng tôi đã biết."},
{u:1,w:"consistent",pos:"adj. – nhất quán, ổn định",c:"consistent with a finding / hypothesis",vi:"phù hợp với một phát hiện / giả thuyết",en:"1) The results are consistent with the findings of earlier studies.<br>2) The data is consistent with our original hypothesis.",exvi:"1) Kết quả phù hợp với các phát hiện của những nghiên cứu trước.<br>2) Dữ liệu phù hợp với giả thuyết ban đầu của chúng tôi."},
{u:1,w:"consistent",pos:"adj. – nhất quán, ổn định",c:"entirely / fairly / broadly consistent",vi:"hoàn toàn / khá / nhìn chung nhất quán",en:"1) His story was entirely consistent from start to finish.<br>2) The two reports are fairly consistent with each other.<br>3) Public opinion is broadly consistent across regions.",exvi:"1) Câu chuyện của anh ấy hoàn toàn nhất quán từ đầu đến cuối.<br>2) Hai bản báo cáo khá nhất quán với nhau.<br>3) Ý kiến công chúng nhìn chung nhất quán giữa các vùng."},

{u:1,w:"conventional",pos:"adj. – truyền thống, thông thường",c:"conventional wisdom / thinking",vi:"quan niệm / lối nghĩ thông thường",en:"1) Conventional wisdom says you should save before you spend.<br>2) Her research challenges conventional thinking about sleep.",exvi:"1) Quan niệm thông thường cho rằng nên tiết kiệm trước khi chi tiêu.<br>2) Nghiên cứu của cô thách thức lối nghĩ thông thường về giấc ngủ."},

{u:1,w:"efficient",pos:"adj. – hiệu quả",c:"highly / extremely efficient",vi:"hiệu quả cao / cực kỳ hiệu quả",en:"1) Modern factories are highly efficient and waste very little.<br>2) The new engine is extremely efficient.",exvi:"1) Các nhà máy hiện đại có hiệu quả cao và lãng phí rất ít.<br>2) Động cơ mới cực kỳ hiệu quả."},
{u:1,w:"efficient",pos:"adj. – hiệu quả",c:"fuel / energy efficient",vi:"tiết kiệm nhiên liệu / năng lượng",en:"1) Buyers increasingly want fuel-efficient cars.<br>2) Energy-efficient homes have much lower bills.",exvi:"1) Người mua ngày càng muốn xe tiết kiệm nhiên liệu.<br>2) Những ngôi nhà tiết kiệm năng lượng có hóa đơn thấp hơn nhiều."},

{u:1,w:"flexible",pos:"adj. – linh hoạt",c:"a flexible approach / system / arrangement",vi:"cách tiếp cận / hệ thống / sự sắp xếp linh hoạt",en:"1) Teachers need a flexible approach to suit different learners.<br>2) A flexible system lets students study at their own pace.<br>3) We came to a flexible arrangement about working from home.",exvi:"1) Giáo viên cần cách tiếp cận linh hoạt để phù hợp với nhiều người học.<br>2) Một hệ thống linh hoạt cho phép sinh viên học theo tốc độ riêng.<br>3) Chúng tôi đạt được thỏa thuận linh hoạt về việc làm tại nhà."},
{u:1,w:"flexible",pos:"adj. – linh hoạt",c:"flexible working / working hours",vi:"làm việc linh hoạt / giờ làm linh hoạt",en:"1) Many companies now offer flexible working.<br>2) Flexible working hours help parents balance their lives.",exvi:"1) Nhiều công ty hiện cho phép làm việc linh hoạt.<br>2) Giờ làm linh hoạt giúp các bậc cha mẹ cân bằng cuộc sống."},
{u:1,w:"flexible",pos:"adj. – linh hoạt",c:"a flexible rate / market",vi:"mức giá / thị trường linh hoạt",en:"1) The bank offers a flexible rate that changes with the economy.<br>2) A flexible labour market makes it easier to hire and fire.",exvi:"1) Ngân hàng đưa ra mức lãi suất linh hoạt thay đổi theo nền kinh tế.<br>2) Thị trường lao động linh hoạt giúp việc thuê và sa thải dễ dàng hơn."},

{u:1,w:"idealistic",pos:"adj. – lý tưởng hóa",c:"an idealistic notion / vision / view",vi:"quan niệm / tầm nhìn / quan điểm lý tưởng hóa",en:"1) He has an idealistic notion that money can't change people.<br>2) Young activists often share an idealistic vision of the future.<br>3) She holds an idealistic view of human nature.",exvi:"1) Anh ấy có quan niệm lý tưởng rằng tiền không thể thay đổi con người.<br>2) Các nhà hoạt động trẻ thường chia sẻ một tầm nhìn lý tưởng về tương lai.<br>3) Cô ấy giữ một quan điểm lý tưởng về bản chất con người."},

{u:1,w:"tolerant",pos:"adj. – khoan dung, cởi mở",c:"tolerant of something",vi:"khoan dung / chấp nhận điều gì",en:"We should be more tolerant of people who are different from us.",exvi:"Chúng ta nên khoan dung hơn với những người khác mình."},
{u:1,w:"tolerant",pos:"adj. – khoan dung, cởi mở",c:"a tolerant society / country / attitude",vi:"xã hội / đất nước / thái độ cởi mở",en:"1) A tolerant society welcomes people of all backgrounds.<br>2) Canada is often seen as a tolerant country.<br>3) A tolerant attitude helps reduce conflict.",exvi:"1) Một xã hội cởi mở chào đón những người thuộc mọi nền tảng.<br>2) Canada thường được xem là một đất nước cởi mở.<br>3) Một thái độ cởi mở giúp giảm xung đột."},
{u:1,w:"tolerant",pos:"adj. – khoan dung, cởi mở",c:"racially tolerant",vi:"khoan dung về sắc tộc",en:"Big cities tend to be more racially tolerant than small towns.",exvi:"Các thành phố lớn thường khoan dung về sắc tộc hơn so với các thị trấn nhỏ."},

{u:1,w:"vulnerable",pos:"adj. – dễ bị tổn thương",c:"vulnerable to something",vi:"dễ bị ảnh hưởng bởi điều gì",en:"Elderly people are especially vulnerable to the cold.",exvi:"Người cao tuổi đặc biệt dễ bị ảnh hưởng bởi cái lạnh."},
{u:1,w:"vulnerable",pos:"adj. – dễ bị tổn thương",c:"vulnerable to attack / damage / fire",vi:"dễ bị tấn công / hư hại / cháy",en:"1) Without walls, the city was vulnerable to attack.<br>2) Old buildings are vulnerable to damage in earthquakes.<br>3) Dry forests are vulnerable to fire in summer.",exvi:"1) Không có tường thành, thành phố dễ bị tấn công.<br>2) Các tòa nhà cũ dễ bị hư hại khi động đất.<br>3) Rừng khô dễ bị cháy vào mùa hè."},
{u:1,w:"vulnerable",pos:"adj. – dễ bị tổn thương",c:"vulnerable children / women / people",vi:"trẻ em / phụ nữ / những người yếu thế",en:"1) Charities aim to protect vulnerable children.<br>2) The shelter supports vulnerable women.<br>3) The policy is designed to help vulnerable people.",exvi:"1) Các tổ chức từ thiện hướng đến bảo vệ trẻ em yếu thế.<br>2) Mái ấm hỗ trợ những phụ nữ yếu thế.<br>3) Chính sách được thiết kế để giúp những người yếu thế."},
{u:1,w:"vulnerable",pos:"adj. – dễ bị tổn thương",c:"a vulnerable position",vi:"một vị thế yếu / dễ bị tổn thương",en:"Borrowing too much can leave families in a vulnerable position.",exvi:"Vay mượn quá nhiều có thể đẩy các gia đình vào vị thế dễ bị tổn thương."},
{u:1,w:"vulnerable",pos:"adj. – dễ bị tổn thương",c:"especially / highly / increasingly vulnerable",vi:"đặc biệt / rất / ngày càng dễ bị tổn thương",en:"1) Coastal towns are especially vulnerable to flooding.<br>2) Newborns are highly vulnerable to infection.<br>3) Species are increasingly vulnerable as habitats shrink.",exvi:"1) Các thị trấn ven biển đặc biệt dễ bị ngập lụt.<br>2) Trẻ sơ sinh rất dễ bị nhiễm trùng.<br>3) Các loài ngày càng dễ bị tổn thương khi môi trường sống thu hẹp."},

{u:2,w:"addiction",pos:"n. – sự nghiện",c:"addiction to something",vi:"sự nghiện thứ gì",en:"Addiction to social media is a growing problem among teenagers.",exvi:"Việc nghiện mạng xã hội là một vấn đề ngày càng tăng ở thanh thiếu niên."},
{u:2,w:"addiction",pos:"n. – sự nghiện",c:"drug / nicotine / alcohol addiction",vi:"nghiện ma túy / nicotine / rượu",en:"1) Drug addiction destroys both health and relationships.<br>2) Nicotine addiction makes quitting smoking extremely hard.<br>3) Alcohol addiction often runs in families.",exvi:"1) Nghiện ma túy phá hủy cả sức khỏe lẫn các mối quan hệ.<br>2) Nghiện nicotine khiến việc bỏ thuốc cực kỳ khó.<br>3) Nghiện rượu thường mang tính di truyền trong gia đình."},
{u:2,w:"addiction",pos:"n. – sự nghiện",c:"a long-term / chronic / serious addiction",vi:"sự nghiện lâu dài / mãn tính / nghiêm trọng",en:"1) Recovering from a long-term addiction takes years.<br>2) He sought help for a chronic addiction.<br>3) A serious addiction can ruin a person's career.",exvi:"1) Phục hồi sau một cơn nghiện lâu dài mất nhiều năm.<br>2) Anh ấy tìm kiếm sự giúp đỡ cho một cơn nghiện mãn tính.<br>3) Một cơn nghiện nghiêm trọng có thể hủy hoại sự nghiệp của một người."},
{u:2,w:"addiction",pos:"n. – sự nghiện",c:"cure / treat / overcome / fight an addiction",vi:"chữa / điều trị / vượt qua / chống lại cơn nghiện",en:"1) Doctors are still searching for ways to cure addiction.<br>2) Clinics treat addiction with therapy and medication.<br>3) Many people struggle to overcome addiction alone.",exvi:"1) Các bác sĩ vẫn đang tìm cách chữa khỏi cơn nghiện.<br>2) Các phòng khám điều trị nghiện bằng liệu pháp tâm lý và thuốc.<br>3) Nhiều người chật vật để tự mình vượt qua cơn nghiện."},
{u:2,w:"addiction",pos:"n. – sự nghiện",c:"an addiction problem / clinic / counsellor",vi:"vấn đề nghiện / phòng khám / chuyên viên tư vấn cai nghiện",en:"1) He finally admitted he had an addiction problem.<br>2) She was referred to an addiction clinic.<br>3) An addiction counsellor helped him recover.",exvi:"1) Cuối cùng anh ấy thừa nhận mình có vấn đề về nghiện.<br>2) Cô ấy được giới thiệu đến một phòng khám cai nghiện.<br>3) Một chuyên viên tư vấn cai nghiện đã giúp anh ấy hồi phục."},

{u:2,w:"allergy",pos:"n. – dị ứng",c:"an allergy to something",vi:"dị ứng với thứ gì",en:"She has an allergy to dust, so she cleans her room every day.",exvi:"Cô ấy bị dị ứng với bụi nên ngày nào cũng dọn phòng."},
{u:2,w:"allergy",pos:"n. – dị ứng",c:"develop / diagnose / trigger an allergy",vi:"phát triển / chẩn đoán / kích hoạt dị ứng",en:"1) Some adults suddenly develop an allergy to seafood.<br>2) Doctors can diagnose an allergy with a simple skin test.<br>3) Pollen can trigger an allergy in spring.",exvi:"1) Một số người lớn đột nhiên bị dị ứng với hải sản.<br>2) Bác sĩ có thể chẩn đoán dị ứng bằng một bài kiểm tra da đơn giản.<br>3) Phấn hoa có thể kích hoạt dị ứng vào mùa xuân."},
{u:2,w:"allergy",pos:"n. – dị ứng",c:"a severe / common / life-threatening allergy",vi:"dị ứng nặng / phổ biến / đe dọa tính mạng",en:"1) A severe allergy can require emergency treatment.<br>2) Hay fever is a very common allergy.<br>3) A peanut allergy can be life-threatening.",exvi:"1) Một cơn dị ứng nặng có thể cần cấp cứu.<br>2) Sốt cỏ khô là một dạng dị ứng rất phổ biến.<br>3) Dị ứng đậu phộng có thể đe dọa tính mạng."},
{u:2,w:"allergy",pos:"n. – dị ứng",c:"a food / peanut / skin allergy",vi:"dị ứng thực phẩm / đậu phộng / da",en:"1) Restaurants must take a food allergy seriously.<br>2) His peanut allergy means he reads every label.<br>3) A skin allergy can cause itching and rashes.",exvi:"1) Các nhà hàng phải xem trọng việc dị ứng thực phẩm.<br>2) Dị ứng đậu phộng khiến anh ấy phải đọc kỹ mọi nhãn mác.<br>3) Dị ứng da có thể gây ngứa và phát ban."},
{u:2,w:"allergy",pos:"n. – dị ứng",c:"allergy sufferers / symptoms",vi:"người bị dị ứng / triệu chứng dị ứng",en:"1) Allergy sufferers often feel worse in spring.<br>2) Allergy symptoms include sneezing and watery eyes.",exvi:"1) Người bị dị ứng thường cảm thấy tệ hơn vào mùa xuân.<br>2) Triệu chứng dị ứng gồm hắt hơi và chảy nước mắt."},

{u:2,w:"dehydration",pos:"n. – sự mất nước",c:"avoid / prevent / cause dehydration",vi:"tránh / ngăn ngừa / gây mất nước",en:"1) Drinking water regularly helps you avoid dehydration.<br>2) Athletes drink electrolytes to prevent dehydration.<br>3) Hot weather can quickly cause dehydration.",exvi:"1) Uống nước thường xuyên giúp bạn tránh mất nước.<br>2) Vận động viên uống chất điện giải để ngăn mất nước.<br>3) Thời tiết nóng có thể nhanh chóng gây mất nước."},
{u:2,w:"dehydration",pos:"n. – sự mất nước",c:"severe / mild / extreme dehydration",vi:"mất nước nghiêm trọng / nhẹ / cực độ",en:"1) Severe dehydration may require hospital treatment.<br>2) Even mild dehydration can cause headaches.<br>3) Extreme dehydration is dangerous for young children.",exvi:"1) Mất nước nghiêm trọng có thể cần điều trị tại bệnh viện.<br>2) Ngay cả mất nước nhẹ cũng có thể gây đau đầu.<br>3) Mất nước cực độ rất nguy hiểm với trẻ nhỏ."},

{u:2,w:"disease",pos:"n. – bệnh tật",c:"a fatal / deadly / chronic disease",vi:"bệnh gây tử vong / chết người / mãn tính",en:"1) Rabies is a fatal disease if left untreated.<br>2) Malaria remains a deadly disease in many countries.<br>3) Diabetes is a chronic disease that lasts a lifetime.",exvi:"1) Bệnh dại gây tử vong nếu không được điều trị.<br>2) Sốt rét vẫn là một căn bệnh chết người ở nhiều nước.<br>3) Tiểu đường là một bệnh mãn tính kéo dài suốt đời."},
{u:2,w:"disease",pos:"n. – bệnh tật",c:"heart / lung / kidney disease",vi:"bệnh tim / phổi / thận",en:"1) A poor diet increases the risk of heart disease.<br>2) Smoking is a major cause of lung disease.<br>3) Kidney disease often develops slowly and silently.",exvi:"1) Chế độ ăn kém làm tăng nguy cơ bệnh tim.<br>2) Hút thuốc là nguyên nhân chính gây bệnh phổi.<br>3) Bệnh thận thường tiến triển chậm và âm thầm."},
{u:2,w:"disease",pos:"n. – bệnh tật",c:"transmit / contract / develop a disease",vi:"lây truyền / mắc / phát triển bệnh",en:"1) Mosquitoes can transmit a disease to humans.<br>2) You can contract a disease from contaminated water.<br>3) Without exercise, people may develop a disease earlier.",exvi:"1) Muỗi có thể truyền bệnh cho con người.<br>2) Bạn có thể mắc bệnh từ nguồn nước ô nhiễm.<br>3) Không tập thể dục, người ta có thể mắc bệnh sớm hơn."},
{u:2,w:"disease",pos:"n. – bệnh tật",c:"prevent / treat / cure a disease",vi:"phòng ngừa / điều trị / chữa khỏi bệnh",en:"1) Vaccines help prevent many serious diseases.<br>2) Doctors can now treat the disease with new drugs.<br>3) Scientists hope to cure the disease one day.",exvi:"1) Vắc-xin giúp phòng ngừa nhiều bệnh nghiêm trọng.<br>2) Bác sĩ giờ có thể điều trị bệnh bằng thuốc mới.<br>3) Các nhà khoa học hy vọng một ngày sẽ chữa khỏi bệnh."},

{u:2,w:"infection",pos:"n. – sự nhiễm trùng",c:"a viral / bacterial / respiratory infection",vi:"nhiễm trùng do virus / vi khuẩn / hô hấp",en:"1) A viral infection usually clears up on its own.<br>2) A bacterial infection often needs antibiotics.<br>3) A respiratory infection can make breathing difficult.",exvi:"1) Nhiễm virus thường tự khỏi.<br>2) Nhiễm khuẩn thường cần kháng sinh.<br>3) Nhiễm trùng đường hô hấp có thể khiến việc thở khó khăn."},
{u:2,w:"infection",pos:"n. – sự nhiễm trùng",c:"a chest / ear / lung infection",vi:"nhiễm trùng ngực / tai / phổi",en:"1) A chest infection left him coughing for weeks.<br>2) Children often get an ear infection after a cold.<br>3) A lung infection can be serious for the elderly.",exvi:"1) Một đợt nhiễm trùng ngực khiến anh ấy ho suốt nhiều tuần.<br>2) Trẻ em thường bị nhiễm trùng tai sau khi cảm lạnh.<br>3) Nhiễm trùng phổi có thể nghiêm trọng với người già."},
{u:2,w:"infection",pos:"n. – sự nhiễm trùng",c:"contract / transmit / spread an infection",vi:"mắc / lây truyền / phát tán nhiễm trùng",en:"1) Patients can contract an infection in hospital.<br>2) Dirty hands easily transmit an infection.<br>3) Crowded places help spread an infection quickly.",exvi:"1) Bệnh nhân có thể bị nhiễm trùng ngay trong bệnh viện.<br>2) Tay bẩn dễ làm lây truyền nhiễm trùng.<br>3) Nơi đông đúc khiến nhiễm trùng lây lan nhanh."},
{u:2,w:"infection",pos:"n. – sự nhiễm trùng",c:"prevent / combat / treat an infection",vi:"ngăn ngừa / chống lại / điều trị nhiễm trùng",en:"1) Washing hands helps prevent infection.<br>2) The body's immune system combats infection.<br>3) Doctors treat the infection with antibiotics.",exvi:"1) Rửa tay giúp ngăn ngừa nhiễm trùng.<br>2) Hệ miễn dịch của cơ thể chống lại nhiễm trùng.<br>3) Bác sĩ điều trị nhiễm trùng bằng kháng sinh."},
{u:2,w:"infection",pos:"n. – sự nhiễm trùng",c:"infection control / prevention",vi:"kiểm soát / phòng ngừa nhiễm trùng",en:"1) Hospitals follow strict infection control rules.<br>2) Good hygiene is the basis of infection prevention.",exvi:"1) Bệnh viện tuân theo các quy tắc kiểm soát nhiễm trùng nghiêm ngặt.<br>2) Vệ sinh tốt là nền tảng của việc phòng ngừa nhiễm trùng."},

{u:2,w:"obesity",pos:"n. – béo phì",c:"tackle / prevent / reduce obesity",vi:"giải quyết / ngăn ngừa / giảm béo phì",en:"1) Governments are trying to tackle obesity through education.<br>2) A balanced diet helps prevent obesity.<br>3) More exercise can reduce obesity in children.",exvi:"1) Các chính phủ đang cố giải quyết béo phì thông qua giáo dục.<br>2) Chế độ ăn cân bằng giúp ngăn ngừa béo phì.<br>3) Vận động nhiều hơn có thể giảm béo phì ở trẻ em."},
{u:2,w:"obesity",pos:"n. – béo phì",c:"the obesity epidemic / rate / problem",vi:"nạn dịch / tỉ lệ / vấn đề béo phì",en:"1) The obesity epidemic is straining health systems.<br>2) The obesity rate has doubled in two decades.<br>3) Fast food contributes to the obesity problem.",exvi:"1) Nạn dịch béo phì đang gây áp lực lên hệ thống y tế.<br>2) Tỉ lệ béo phì đã tăng gấp đôi trong hai thập kỷ.<br>3) Đồ ăn nhanh góp phần vào vấn đề béo phì."},
{u:2,w:"obesity",pos:"n. – béo phì",c:"childhood / adult obesity",vi:"béo phì ở trẻ em / người lớn",en:"1) Childhood obesity often leads to health problems later.<br>2) Adult obesity raises the risk of heart disease.",exvi:"1) Béo phì ở trẻ em thường dẫn đến các vấn đề sức khỏe về sau.<br>2) Béo phì ở người lớn làm tăng nguy cơ bệnh tim."},

{u:2,w:"stroke",pos:"n. – đột quỵ",c:"a minor / severe / fatal stroke",vi:"đột quỵ nhẹ / nặng / gây tử vong",en:"1) He recovered quickly after a minor stroke.<br>2) A severe stroke can leave a patient paralysed.<br>3) Sadly, she died after a fatal stroke.",exvi:"1) Anh ấy hồi phục nhanh sau một cơn đột quỵ nhẹ.<br>2) Một cơn đột quỵ nặng có thể khiến bệnh nhân bị liệt.<br>3) Đáng buồn là cô ấy qua đời sau một cơn đột quỵ gây tử vong."},
{u:2,w:"stroke",pos:"n. – đột quỵ",c:"a stroke victim / patient / unit",vi:"nạn nhân / bệnh nhân / khoa đột quỵ",en:"1) A stroke victim needs immediate medical attention.<br>2) The stroke patient slowly relearned how to walk.<br>3) She was rushed to the hospital's stroke unit.",exvi:"1) Một nạn nhân đột quỵ cần được chăm sóc y tế ngay lập tức.<br>2) Bệnh nhân đột quỵ dần học lại cách đi.<br>3) Cô ấy được đưa gấp đến khoa đột quỵ của bệnh viện."},
{u:2,w:"stroke",pos:"n. – đột quỵ",c:"suffer / have / prevent a stroke",vi:"bị / lên cơn / phòng ngừa đột quỵ",en:"1) He suffered a stroke at the age of sixty.<br>2) She had a stroke but made a full recovery.<br>3) Controlling blood pressure helps prevent a stroke.",exvi:"1) Ông ấy bị đột quỵ ở tuổi sáu mươi.<br>2) Cô ấy lên cơn đột quỵ nhưng đã hồi phục hoàn toàn.<br>3) Kiểm soát huyết áp giúp phòng ngừa đột quỵ."},

{u:2,w:"administer",pos:"v. – cho dùng (thuốc), thực hiện",c:"administer something to someone",vi:"cho ai dùng thứ gì",en:"Nurses administer the medicine to patients on time.",exvi:"Y tá cho bệnh nhân dùng thuốc đúng giờ."},

{u:3,w:"evidence",pos:"n. – bằng chứng",c:"evidence of / for something",vi:"bằng chứng về / cho điều gì",en:"1) There is clear evidence of climate change.<br>2) Scientists found evidence for their new theory.",exvi:"1) Có bằng chứng rõ ràng về biến đổi khí hậu.<br>2) Các nhà khoa học tìm thấy bằng chứng cho lý thuyết mới của họ."},
{u:3,w:"evidence",pos:"n. – bằng chứng",c:"find / gather / collect evidence",vi:"tìm / thu thập / góp nhặt bằng chứng",en:"1) Researchers find evidence by running experiments.<br>2) Detectives gather evidence at the scene.<br>3) We collect evidence from many different sources.",exvi:"1) Nhà nghiên cứu tìm bằng chứng bằng cách làm thí nghiệm.<br>2) Thám tử thu thập bằng chứng tại hiện trường.<br>3) Chúng tôi góp nhặt bằng chứng từ nhiều nguồn khác nhau."},
{u:3,w:"evidence",pos:"n. – bằng chứng",c:"clear / strong / conclusive evidence",vi:"bằng chứng rõ ràng / mạnh mẽ / thuyết phục",en:"1) There is clear evidence that smoking harms health.<br>2) Strong evidence supports this conclusion.<br>3) The court needed conclusive evidence to convict him.",exvi:"1) Có bằng chứng rõ ràng rằng hút thuốc gây hại sức khỏe.<br>2) Bằng chứng mạnh mẽ ủng hộ kết luận này.<br>3) Tòa cần bằng chứng thuyết phục để kết tội anh ta."},

{u:3,w:"hypothesis",pos:"n. – giả thuyết",c:"test / support / confirm a hypothesis",vi:"kiểm chứng / ủng hộ / xác nhận một giả thuyết",en:"1) Experiments are designed to test a hypothesis.<br>2) The results support the original hypothesis.<br>3) Further data confirmed the hypothesis.",exvi:"1) Các thí nghiệm được thiết kế để kiểm chứng một giả thuyết.<br>2) Kết quả ủng hộ giả thuyết ban đầu.<br>3) Dữ liệu sâu hơn đã xác nhận giả thuyết."},
{u:3,w:"hypothesis",pos:"n. – giả thuyết",c:"a null / testable / alternative hypothesis",vi:"giả thuyết không / có thể kiểm chứng / thay thế",en:"1) The null hypothesis assumes there is no real effect.<br>2) A good hypothesis must be a testable hypothesis.<br>3) Scientists also consider an alternative hypothesis.",exvi:"1) Giả thuyết không cho rằng không có tác động thực sự.<br>2) Một giả thuyết tốt phải là giả thuyết có thể kiểm chứng.<br>3) Các nhà khoa học cũng cân nhắc một giả thuyết thay thế."},

{u:3,w:"theory",pos:"n. – lý thuyết",c:"a theory of something",vi:"lý thuyết về điều gì",en:"Einstein developed a theory of relativity that changed physics.",exvi:"Einstein đã phát triển một lý thuyết về tính tương đối làm thay đổi vật lý."},
{u:3,w:"theory",pos:"n. – lý thuyết",c:"develop / propose / formulate a theory",vi:"phát triển / đề xuất / xây dựng một lý thuyết",en:"1) Scientists develop a theory to explain their findings.<br>2) She proposed a new theory about memory.<br>3) It took years to formulate the theory clearly.",exvi:"1) Các nhà khoa học phát triển một lý thuyết để giải thích phát hiện của họ.<br>2) Cô ấy đề xuất một lý thuyết mới về trí nhớ.<br>3) Phải mất nhiều năm để xây dựng lý thuyết một cách rõ ràng."},
{u:3,w:"theory",pos:"n. – lý thuyết",c:"a scientific / evolutionary theory",vi:"một lý thuyết khoa học / tiến hóa",en:"1) A scientific theory must be supported by evidence.<br>2) The evolutionary theory explains the diversity of life.",exvi:"1) Một lý thuyết khoa học phải được bằng chứng ủng hộ.<br>2) Lý thuyết tiến hóa giải thích sự đa dạng của sự sống."},

// ===== UNIT 4 =====
{u:4,w:"accompany",pos:"v. – đi cùng, hộ tống",c:"accompanied by someone",vi:"được ai đó đi cùng",en:"The children were accompanied by their teacher on the trip.",exvi:"Bọn trẻ được giáo viên đi cùng trong chuyến đi."},
{u:4,w:"accompany",pos:"v. – đi cùng, hộ tống",c:"accompanied by a bodyguard / adult / escort",vi:"được hộ tống bởi vệ sĩ / người lớn / người hộ tống",en:"1) The star was accompanied by a bodyguard everywhere.<br>2) Young travellers must be accompanied by an adult.<br>3) The convoy was accompanied by a police escort.",exvi:"1) Ngôi sao luôn được một vệ sĩ đi cùng khắp nơi.<br>2) Du khách nhỏ tuổi phải có người lớn đi kèm.<br>3) Đoàn xe được cảnh sát hộ tống."},

{u:4,w:"delay",pos:"v. – trì hoãn, làm chậm",c:"delay the onset / start of something",vi:"làm chậm sự khởi phát / bắt đầu của điều gì",en:"1) Exercise can delay the onset of many diseases.<br>2) Bad weather delayed the start of the journey.",exvi:"1) Tập thể dục có thể làm chậm sự khởi phát của nhiều bệnh.<br>2) Thời tiết xấu làm chậm thời điểm bắt đầu chuyến đi."},

{u:4,w:"encounter",pos:"v. – gặp phải",c:"encounter resistance / opposition",vi:"gặp phải sự kháng cự / phản đối",en:"1) The plan encountered resistance from local residents.<br>2) New ideas often encounter opposition at first.",exvi:"1) Kế hoạch gặp phải sự kháng cự từ người dân địa phương.<br>2) Ý tưởng mới thường gặp phản đối lúc đầu."},
{u:4,w:"encounter",pos:"v. – gặp phải",c:"encounter a difficulty / problem",vi:"gặp phải một khó khăn / vấn đề",en:"1) Travellers may encounter a difficulty crossing the border.<br>2) We encountered a serious problem with the booking.",exvi:"1) Du khách có thể gặp khó khăn khi qua biên giới.<br>2) Chúng tôi gặp một vấn đề nghiêm trọng với việc đặt chỗ."},

{u:4,w:"overcome",pos:"v. – vượt qua",c:"overcome a problem / difficulty / obstacle",vi:"vượt qua một vấn đề / khó khăn / trở ngại",en:"1) With effort, she overcame every problem on the way.<br>2) He overcame great difficulty to finish the race.<br>3) Determined people overcome any obstacle.",exvi:"1) Bằng nỗ lực, cô ấy vượt qua mọi vấn đề trên đường.<br>2) Anh ấy vượt qua khó khăn lớn để hoàn thành cuộc đua.<br>3) Người quyết tâm vượt qua mọi trở ngại."},
{u:4,w:"overcome",pos:"v. – vượt qua",c:"overcome an injury / deficit",vi:"vượt qua một chấn thương / sự thua kém",en:"1) The athlete worked hard to overcome an injury.<br>2) The team overcame a two-goal deficit to win.",exvi:"1) Vận động viên đã nỗ lực để vượt qua chấn thương.<br>2) Đội bóng lội ngược dòng từ thế thua hai bàn để chiến thắng."},

{u:4,w:"seek",pos:"v. – tìm kiếm",c:"seek help / advice / refuge / treatment",vi:"tìm kiếm sự giúp đỡ / lời khuyên / nơi trú ẩn / điều trị",en:"1) Don't be afraid to seek help when you struggle.<br>2) She sought advice from an experienced teacher.<br>3) Thousands sought refuge from the floods.<br>4) He sought treatment for his back pain.",exvi:"1) Đừng ngại tìm sự giúp đỡ khi bạn gặp khó khăn.<br>2) Cô ấy tìm lời khuyên từ một giáo viên giàu kinh nghiệm.<br>3) Hàng nghìn người tìm nơi trú ẩn khỏi lũ lụt.<br>4) Anh ấy tìm cách điều trị chứng đau lưng."},
{u:4,w:"seek",pos:"v. – tìm kiếm",c:"seek approval / permission / compensation",vi:"tìm kiếm sự chấp thuận / cho phép / bồi thường",en:"1) You must seek approval before starting the project.<br>2) Tourists seek permission to enter the reserve.<br>3) The victims sought compensation from the company.",exvi:"1) Bạn phải xin chấp thuận trước khi bắt đầu dự án.<br>2) Du khách xin phép để vào khu bảo tồn.<br>3) Các nạn nhân đòi bồi thường từ công ty."},
{u:4,w:"seek",pos:"v. – tìm kiếm",c:"actively / urgently / desperately seek",vi:"chủ động / khẩn cấp / tuyệt vọng tìm kiếm",en:"1) The company is actively seeking new partners.<br>2) Refugees urgently sought food and shelter.<br>3) He desperately sought a way out of debt.",exvi:"1) Công ty đang chủ động tìm kiếm đối tác mới.<br>2) Người tị nạn khẩn cấp tìm thức ăn và chỗ ở.<br>3) Anh ấy tuyệt vọng tìm cách thoát khỏi nợ nần."},

{u:4,w:"challenge",pos:"n. – thử thách",c:"present / pose / accept / face / meet a challenge",vi:"đặt ra / chấp nhận / đối mặt / vượt qua thử thách",en:"1) Climate change poses a huge challenge to the world.<br>2) She gladly accepted the challenge.<br>3) Every traveller must face the challenge of a new culture.<br>4) The team met the challenge and succeeded.",exvi:"1) Biến đổi khí hậu đặt ra một thử thách to lớn cho thế giới.<br>2) Cô ấy vui vẻ chấp nhận thử thách.<br>3) Mỗi du khách phải đối mặt với thử thách của một nền văn hóa mới.<br>4) Đội đã vượt qua thử thách và thành công."},
{u:4,w:"challenge",pos:"n. – thử thách",c:"a serious / real / major / great challenge",vi:"một thử thách nghiêm trọng / thực sự / lớn / to lớn",en:"1) Poverty remains a serious challenge for the region.<br>2) Learning a language is a real challenge.<br>3) Funding is a major challenge for the project.",exvi:"1) Nghèo đói vẫn là một thử thách nghiêm trọng với khu vực.<br>2) Học một ngôn ngữ là một thử thách thực sự.<br>3) Kinh phí là một thử thách lớn cho dự án."},

{u:4,w:"destination",pos:"n. – điểm đến",c:"a tourist / holiday / popular / favourite destination",vi:"điểm đến du lịch / nghỉ dưỡng / nổi tiếng / yêu thích",en:"1) The city is a famous tourist destination.<br>2) The island is a perfect holiday destination.<br>3) It has become a popular destination for students.<br>4) Japan is my favourite destination.",exvi:"1) Thành phố này là một điểm đến du lịch nổi tiếng.<br>2) Hòn đảo là một điểm nghỉ dưỡng hoàn hảo.<br>3) Nó đã trở thành điểm đến phổ biến với sinh viên.<br>4) Nhật Bản là điểm đến yêu thích của tôi."},
{u:4,w:"destination",pos:"n. – điểm đến",c:"a final / ultimate destination",vi:"điểm đến cuối cùng / sau cùng",en:"1) After three flights, we reached our final destination.<br>2) For many climbers, Everest is the ultimate destination.",exvi:"1) Sau ba chuyến bay, chúng tôi đến điểm đến cuối cùng.<br>2) Với nhiều người leo núi, Everest là điểm đến sau cùng."},

{u:4,w:"route",pos:"n. – tuyến đường",c:"take / follow / choose a route",vi:"đi theo / chọn một tuyến đường",en:"1) We took a different route to avoid traffic.<br>2) Just follow this route until you reach the river.<br>3) Hikers can choose an easier route.",exvi:"1) Chúng tôi đi một tuyến khác để tránh kẹt xe.<br>2) Cứ theo tuyến đường này cho đến khi tới con sông.<br>3) Người đi bộ đường dài có thể chọn một tuyến dễ hơn."},
{u:4,w:"route",pos:"n. – tuyến đường",c:"a main / direct / scenic route",vi:"tuyến đường chính / trực tiếp / có cảnh đẹp",en:"1) The main route into the city is often crowded.<br>2) The direct route saves an hour.<br>3) We took the scenic route along the coast.",exvi:"1) Tuyến đường chính vào thành phố thường đông đúc.<br>2) Tuyến đường trực tiếp tiết kiệm một giờ.<br>3) Chúng tôi đi theo tuyến đường có cảnh đẹp dọc bờ biển."},
{u:4,w:"route",pos:"n. – tuyến đường",c:"a trade / escape / supply route",vi:"tuyến thương mại / thoát hiểm / tiếp tế",en:"1) The river was once an important trade route.<br>2) The tunnel served as an escape route.<br>3) The army cut off the enemy's supply route.",exvi:"1) Con sông từng là một tuyến thương mại quan trọng.<br>2) Đường hầm được dùng làm lối thoát hiểm.<br>3) Quân đội cắt đứt tuyến tiếp tế của địch."},

{u:4,w:"intense",pos:"adj. – mãnh liệt, dữ dội",c:"intense heat / pain / pressure / scrutiny",vi:"sức nóng / cơn đau / áp lực / sự soi xét dữ dội",en:"1) The intense heat made walking exhausting.<br>2) She felt intense pain in her knee.<br>3) Athletes perform under intense pressure.<br>4) The decision came under intense scrutiny.",exvi:"1) Sức nóng dữ dội khiến việc đi bộ kiệt sức.<br>2) Cô ấy cảm thấy cơn đau dữ dội ở đầu gối.<br>3) Vận động viên thi đấu dưới áp lực dữ dội.<br>4) Quyết định bị soi xét gắt gao."},
{u:4,w:"intense",pos:"adj. – mãnh liệt, dữ dội",c:"intense competition / rivalry",vi:"sự cạnh tranh / kình địch gay gắt",en:"1) There is intense competition for top universities.<br>2) The two teams have an intense rivalry.",exvi:"1) Có sự cạnh tranh gay gắt để vào các trường đại học hàng đầu.<br>2) Hai đội có một sự kình địch gay gắt."},

{u:4,w:"pivotal",pos:"adj. – then chốt, mấu chốt",c:"a pivotal role / moment / figure",vi:"vai trò / khoảnh khắc / nhân vật then chốt",en:"1) Mentors play a pivotal role in a student's success.<br>2) That trip was a pivotal moment in my life.<br>3) She was a pivotal figure in the movement.",exvi:"1) Người cố vấn đóng vai trò then chốt trong thành công của học sinh.<br>2) Chuyến đi đó là một khoảnh khắc bước ngoặt trong đời tôi.<br>3) Cô ấy là một nhân vật then chốt trong phong trào."},
{u:4,w:"pivotal",pos:"adj. – then chốt, mấu chốt",c:"prove / become pivotal",vi:"trở nên / chứng tỏ là then chốt",en:"1) That single decision proved pivotal to our win.<br>2) The new evidence became pivotal in the case.",exvi:"1) Quyết định duy nhất đó hóa ra lại mang tính then chốt cho chiến thắng.<br>2) Bằng chứng mới trở nên mấu chốt trong vụ án."},

{u:4,w:"profound",pos:"adj. – sâu sắc",c:"a profound sense of something",vi:"một cảm giác sâu sắc về điều gì",en:"Travelling gave me a profound sense of freedom.",exvi:"Việc đi du lịch mang cho tôi một cảm giác tự do sâu sắc."},
{u:4,w:"profound",pos:"adj. – sâu sắc",c:"a profound change / impact / effect / influence",vi:"sự thay đổi / tác động / ảnh hưởng sâu sắc",en:"1) The internet has had a profound change on society.<br>2) The trip had a profound impact on her career.<br>3) Music can have a profound effect on mood.<br>4) His teacher had a profound influence on him.",exvi:"1) Internet đã tạo ra một sự thay đổi sâu sắc cho xã hội.<br>2) Chuyến đi có tác động sâu sắc đến sự nghiệp của cô ấy.<br>3) Âm nhạc có thể tác động sâu sắc đến tâm trạng.<br>4) Thầy của anh ấy có ảnh hưởng sâu sắc đến anh."},

{u:4,w:"valuable",pos:"adj. – quý giá, có giá trị",c:"a valuable asset / lesson / resource / experience",vi:"tài sản / bài học / nguồn lực / trải nghiệm quý giá",en:"1) Honest staff are a valuable asset to any company.<br>2) Failure taught me a valuable lesson.<br>3) Water is a valuable resource we must protect.<br>4) Studying abroad was a valuable experience.",exvi:"1) Nhân viên trung thực là tài sản quý giá của bất kỳ công ty nào.<br>2) Thất bại đã dạy tôi một bài học quý giá.<br>3) Nước là một nguồn tài nguyên quý mà chúng ta phải bảo vệ.<br>4) Du học là một trải nghiệm quý giá."},
{u:4,w:"valuable",pos:"adj. – quý giá, có giá trị",c:"a valuable contribution / item",vi:"đóng góp / món đồ có giá trị",en:"1) Volunteers make a valuable contribution to the community.<br>2) The museum displays many valuable items.",exvi:"1) Tình nguyện viên đóng góp giá trị cho cộng đồng.<br>2) Bảo tàng trưng bày nhiều món đồ có giá trị."},
{u:4,w:"valuable",pos:"adj. – quý giá, có giá trị",c:"prove / become valuable",vi:"trở nên / chứng tỏ có giá trị",en:"1) These skills will prove valuable in your career.<br>2) The old map became valuable to historians.",exvi:"1) Những kỹ năng này sẽ chứng tỏ giá trị trong sự nghiệp của bạn.<br>2) Tấm bản đồ cũ trở nên quý giá với các nhà sử học."},

// ===== UNIT 5 =====
{u:5,w:"circumference",pos:"n. – chu vi",c:"the circumference of something",vi:"chu vi của vật gì",en:"Scientists measured the circumference of the Earth long ago.",exvi:"Các nhà khoa học đã đo chu vi Trái Đất từ lâu."},
{u:5,w:"circumference",pos:"n. – chu vi",c:"measure the circumference",vi:"đo chu vi",en:"Use a tape to measure the circumference of the trunk.",exvi:"Dùng thước dây để đo chu vi của thân cây."},

{u:5,w:"height",pos:"n. – chiều cao",c:"reach a height of x",vi:"đạt tới độ cao x",en:"The tower reaches a height of 300 metres.",exvi:"Tòa tháp đạt độ cao 300 mét."},
{u:5,w:"height",pos:"n. – chiều cao",c:"of medium / normal / average height",vi:"có chiều cao trung bình / bình thường",en:"1) He is a man of medium height.<br>2) The plant grows to a normal height of one metre.<br>3) She is of average height for her age.",exvi:"1) Anh ấy là một người đàn ông có chiều cao trung bình.<br>2) Cây mọc đến chiều cao bình thường là một mét.<br>3) Cô ấy có chiều cao trung bình so với tuổi."},
{u:5,w:"height",pos:"n. – chiều cao",c:"the maximum / minimum height",vi:"độ cao tối đa / tối thiểu",en:"1) The maximum height of the building is fixed by law.<br>2) There is a minimum height for this ride.",exvi:"1) Độ cao tối đa của tòa nhà được luật quy định.<br>2) Có một chiều cao tối thiểu cho trò chơi này."},

{u:5,w:"length",pos:"n. – chiều dài",c:"the length of something",vi:"chiều dài của vật gì",en:"The length of the bridge is nearly two kilometres.",exvi:"Chiều dài của cây cầu gần hai ki-lô-mét."},
{u:5,w:"length",pos:"n. – chiều dài",c:"something stretches / extends the length of something",vi:"vật gì kéo dài suốt chiều dài của vật gì",en:"1) The beach stretches the length of the bay.<br>2) A wall extends the length of the garden.",exvi:"1) Bãi biển trải dài suốt vịnh.<br>2) Một bức tường kéo dài hết chiều dài khu vườn."},
{u:5,w:"length",pos:"n. – chiều dài",c:"the entire / full / overall length of something",vi:"toàn bộ / trọn / tổng chiều dài của vật gì",en:"1) We walked the entire length of the trail.<br>2) The full length of the river is mapped.<br>3) The overall length of the train is 200 metres.",exvi:"1) Chúng tôi đi bộ suốt toàn bộ con đường mòn.<br>2) Trọn chiều dài con sông đã được vẽ bản đồ.<br>3) Tổng chiều dài của đoàn tàu là 200 mét."},

{u:14,w:"consequence",pos:"n. – hậu quả",c:"suffer / face / accept the consequences",vi:"gánh chịu / đối mặt / chấp nhận hậu quả",en:"1) Future generations will suffer the consequences.<br>2) He must face the consequences of his choice.<br>3) You have to accept the consequences of your actions.",exvi:"1) Các thế hệ tương lai sẽ gánh chịu hậu quả.<br>2) Anh ấy phải đối mặt với hậu quả của lựa chọn của mình.<br>3) Bạn phải chấp nhận hậu quả của hành động của mình."},
{u:14,w:"consequence",pos:"n. – hậu quả",c:"serious / severe / unintended consequences",vi:"hậu quả nghiêm trọng / nặng nề / không lường trước",en:"1) Pollution has serious consequences for health.<br>2) The policy had severe consequences for farmers.<br>3) The change brought unintended consequences.",exvi:"1) Ô nhiễm gây ra những hậu quả nghiêm trọng cho sức khỏe.<br>2) Chính sách gây hậu quả nặng nề cho nông dân.<br>3) Sự thay đổi mang lại những hậu quả không lường trước."},

{u:14,w:"impact",pos:"n. – tác động, ảnh hưởng",c:"an impact on the environment / economy",vi:"tác động đến môi trường / nền kinh tế",en:"1) Plastic has a huge impact on the environment.<br>2) The pandemic had a major impact on the economy.",exvi:"1) Nhựa có tác động to lớn đến môi trường.<br>2) Đại dịch có tác động lớn đến nền kinh tế."},
{u:14,w:"impact",pos:"n. – tác động, ảnh hưởng",c:"a significant / profound / lasting impact",vi:"tác động đáng kể / sâu sắc / lâu dài",en:"1) The teacher had a significant impact on my life.<br>2) The war had a profound impact on the nation.<br>3) The reform had a lasting impact on schools.",exvi:"1) Người thầy đã có tác động đáng kể đến cuộc đời tôi.<br>2) Cuộc chiến có tác động sâu sắc đến quốc gia.<br>3) Cuộc cải cách có tác động lâu dài đến các trường học."},

{u:14,w:"influence",pos:"n. – sự ảnh hưởng",c:"have / exert influence on someone",vi:"có / gây ảnh hưởng lên ai đó",en:"1) Parents have a strong influence on their children.<br>2) Advertising exerts a powerful influence on buyers.",exvi:"1) Cha mẹ có ảnh hưởng mạnh mẽ lên con cái.<br>2) Quảng cáo gây ảnh hưởng mạnh mẽ lên người mua."},
{u:14,w:"influence",pos:"n. – sự ảnh hưởng",c:"a major / good / bad influence",vi:"một ảnh hưởng lớn / tốt / xấu",en:"1) Social media is a major influence on teenagers.<br>2) She was a good influence on the team.<br>3) Bad friends can be a bad influence.",exvi:"1) Mạng xã hội là một ảnh hưởng lớn đối với thanh thiếu niên.<br>2) Cô ấy là một ảnh hưởng tốt cho cả đội.<br>3) Bạn xấu có thể là một ảnh hưởng xấu."},

{u:14,w:"outcome",pos:"n. – kết quả, kết cục",c:"the outcome of something",vi:"kết quả của điều gì",en:"Nobody could predict the outcome of the election.",exvi:"Không ai có thể đoán trước kết quả của cuộc bầu cử."},
{u:14,w:"outcome",pos:"n. – kết quả, kết cục",c:"a successful / likely outcome",vi:"một kết quả thành công / nhiều khả năng",en:"1) Hard work leads to a successful outcome.<br>2) A compromise is the most likely outcome.",exvi:"1) Làm việc chăm chỉ dẫn đến một kết quả thành công.<br>2) Một sự thỏa hiệp là kết quả nhiều khả năng nhất."},

{u:14,w:"repercussion",pos:"n. – hệ lụy, hậu quả lan rộng",c:"serious / potential / negative repercussions",vi:"những hệ lụy nghiêm trọng / tiềm tàng / tiêu cực",en:"1) The decision had serious repercussions.<br>2) The plan carries potential repercussions.<br>3) The scandal had negative repercussions for the company.",exvi:"1) Quyết định này gây ra những hệ lụy nghiêm trọng.<br>2) Kế hoạch mang theo những hệ lụy tiềm tàng.<br>3) Vụ bê bối gây hệ lụy tiêu cực cho công ty."},
{u:14,w:"repercussion",pos:"n. – hệ lụy, hậu quả lan rộng",c:"have / fear repercussions",vi:"gây ra / lo sợ hệ lụy",en:"1) The new tax could have wide repercussions.<br>2) Workers feared repercussions for speaking out.",exvi:"1) Loại thuế mới có thể gây hệ lụy rộng khắp.<br>2) Người lao động lo sợ hệ lụy khi lên tiếng."},

{u:14,w:"affect",pos:"v. – ảnh hưởng đến",c:"badly / adversely / directly affect something",vi:"ảnh hưởng xấu / bất lợi / trực tiếp đến điều gì",en:"1) The drought badly affected the harvest.<br>2) Noise can adversely affect concentration.<br>3) The new rule directly affects students.",exvi:"1) Hạn hán ảnh hưởng xấu đến vụ mùa.<br>2) Tiếng ồn có thể ảnh hưởng bất lợi đến sự tập trung.<br>3) Quy định mới ảnh hưởng trực tiếp đến học sinh."},
{u:14,w:"affect",pos:"v. – ảnh hưởng đến",c:"affect the outcome / quality / performance",vi:"ảnh hưởng đến kết quả / chất lượng / hiệu suất",en:"1) Weather can affect the outcome of the game.<br>2) Poor materials affect the quality of the product.<br>3) Lack of sleep affects performance at work.",exvi:"1) Thời tiết có thể ảnh hưởng đến kết quả trận đấu.<br>2) Nguyên liệu kém ảnh hưởng đến chất lượng sản phẩm.<br>3) Thiếu ngủ ảnh hưởng đến hiệu suất làm việc."},

{u:14,w:"contribute",pos:"v. – góp phần",c:"contribute to something",vi:"góp phần vào điều gì",en:"Cars contribute to air pollution in cities.",exvi:"Ô tô góp phần gây ô nhiễm không khí ở các thành phố."},
{u:14,w:"contribute",pos:"v. – góp phần",c:"a contributing factor",vi:"một yếu tố góp phần",en:"Stress is a contributing factor in many illnesses.",exvi:"Căng thẳng là một yếu tố góp phần gây ra nhiều bệnh."},
{u:14,w:"contribute",pos:"v. – góp phần",c:"contribute greatly / significantly",vi:"đóng góp lớn / đáng kể",en:"1) Tourism contributes greatly to the local economy.<br>2) Exercise contributes significantly to good health.",exvi:"1) Du lịch đóng góp lớn cho nền kinh tế địa phương.<br>2) Tập thể dục góp phần đáng kể vào sức khỏe tốt."},

{u:14,w:"determine",pos:"v. – quyết định, xác định",c:"determine the outcome / future",vi:"quyết định kết quả / tương lai",en:"1) The final exam will determine the outcome.<br>2) Education can determine a child's future.",exvi:"1) Bài thi cuối kỳ sẽ quyết định kết quả.<br>2) Giáo dục có thể quyết định tương lai của một đứa trẻ."},
{u:14,w:"determine",pos:"v. – quyết định, xác định",c:"determine the cause / extent of something",vi:"xác định nguyên nhân / mức độ của điều gì",en:"1) Investigators will determine the cause of the fire.<br>2) Tests determine the extent of the damage.",exvi:"1) Điều tra viên sẽ xác định nguyên nhân vụ cháy.<br>2) Các xét nghiệm xác định mức độ thiệt hại."},

{u:14,w:"generate",pos:"v. – tạo ra, sinh ra",c:"generate excitement / publicity / controversy",vi:"tạo ra sự hào hứng / chú ý của truyền thông / tranh cãi",en:"1) The trailer generated huge excitement.<br>2) The event generated a lot of publicity.<br>3) His comments generated controversy.",exvi:"1) Đoạn giới thiệu tạo ra sự hào hứng lớn.<br>2) Sự kiện thu hút rất nhiều sự chú ý của truyền thông.<br>3) Những lời bình luận của anh ta gây tranh cãi."},
{u:14,w:"generate",pos:"v. – tạo ra, sinh ra",c:"generate income / electricity / power",vi:"tạo ra thu nhập / điện / năng lượng",en:"1) The business generates a steady income.<br>2) Wind farms generate clean electricity.<br>3) The dam generates power for the whole region.",exvi:"1) Doanh nghiệp tạo ra một nguồn thu nhập ổn định.<br>2) Các trang trại gió tạo ra điện sạch.<br>3) Con đập tạo ra năng lượng cho cả khu vực."},

{u:14,w:"provoke",pos:"v. – khơi dậy, gây ra",c:"provoke outrage / anger / controversy",vi:"khơi dậy sự phẫn nộ / tức giận / tranh cãi",en:"1) The decision provoked public outrage.<br>2) His rude remark provoked anger.<br>3) The film provoked controversy.",exvi:"1) Quyết định này khơi dậy sự phẫn nộ của công chúng.<br>2) Lời nói thô lỗ của anh ta gây ra sự tức giận.<br>3) Bộ phim gây tranh cãi."},
{u:14,w:"provoke",pos:"v. – khơi dậy, gây ra",c:"provoke a reaction / response / debate",vi:"gây ra một phản ứng / hồi đáp / cuộc tranh luận",en:"1) The advert provoked a strong reaction.<br>2) The speech provoked an angry response.<br>3) The report provoked a national debate.",exvi:"1) Quảng cáo gây ra một phản ứng mạnh mẽ.<br>2) Bài phát biểu gây ra một phản ứng giận dữ.<br>3) Báo cáo làm dấy lên một cuộc tranh luận toàn quốc."},

{u:14,w:"result",pos:"v. – dẫn đến / bắt nguồn",c:"result in a loss / increase / reduction",vi:"dẫn đến sự thua lỗ / gia tăng / sụt giảm",en:"1) The strike resulted in a big loss.<br>2) The campaign resulted in an increase in sales.<br>3) The new method resulted in a reduction of waste.",exvi:"1) Cuộc đình công dẫn đến khoản lỗ lớn.<br>2) Chiến dịch dẫn đến sự gia tăng doanh số.<br>3) Phương pháp mới giúp giảm bớt rác thải."},
{u:14,w:"result",pos:"v. – dẫn đến / bắt nguồn",c:"result from use / a failure / lack",vi:"bắt nguồn từ việc sử dụng / một sự thất bại / sự thiếu hụt",en:"1) Many accidents result from careless use.<br>2) The problem resulted from a failure to plan.<br>3) Illness can result from a lack of vitamins.",exvi:"1) Nhiều tai nạn bắt nguồn từ việc sử dụng bất cẩn.<br>2) Vấn đề bắt nguồn từ việc không lập kế hoạch.<br>3) Bệnh tật có thể bắt nguồn từ sự thiếu hụt vitamin."},

{u:14,w:"stem",pos:"v. – bắt nguồn từ",c:"stem from something",vi:"bắt nguồn từ điều gì",en:"Her confidence stems from years of practice.",exvi:"Sự tự tin của cô ấy bắt nguồn từ nhiều năm luyện tập."},
{u:14,w:"stem",pos:"v. – bắt nguồn từ",c:"a problem stems from a fact / misconception",vi:"một vấn đề bắt nguồn từ một sự thật / quan niệm sai",en:"1) The conflict stems from a simple misunderstanding.<br>2) The fear stems from a common misconception.",exvi:"1) Cuộc xung đột bắt nguồn từ một sự hiểu lầm đơn giản.<br>2) Nỗi sợ bắt nguồn từ một quan niệm sai phổ biến."},

{u:14,w:"trigger",pos:"v. – kích hoạt, làm bùng phát",c:"trigger a crisis / war / debate",vi:"làm bùng phát một cuộc khủng hoảng / chiến tranh / tranh luận",en:"1) The collapse triggered a financial crisis.<br>2) The incident triggered a war.<br>3) The proposal triggered a heated debate.",exvi:"1) Sự sụp đổ làm bùng phát một cuộc khủng hoảng tài chính.<br>2) Vụ việc làm bùng nổ một cuộc chiến.<br>3) Đề xuất làm dấy lên một cuộc tranh luận gay gắt."},
{u:14,w:"trigger",pos:"v. – kích hoạt, làm bùng phát",c:"trigger a tsunami / landslide / avalanche",vi:"gây ra một trận sóng thần / lở đất / lở tuyết",en:"1) The earthquake triggered a tsunami.<br>2) Heavy rain triggered a landslide.<br>3) The noise triggered an avalanche.",exvi:"1) Trận động đất gây ra một trận sóng thần.<br>2) Mưa lớn gây ra một vụ lở đất.<br>3) Tiếng ồn gây ra một trận lở tuyết."},

{u:15,w:"initial",pos:"adj. – ban đầu",c:"an initial reaction / response / impression",vi:"phản ứng / hồi đáp / ấn tượng ban đầu",en:"1) My initial reaction was one of shock.<br>2) The initial response to the plan was positive.<br>3) The initial impression of the city was wonderful.",exvi:"1) Phản ứng ban đầu của tôi là sự sốc.<br>2) Hồi đáp ban đầu với kế hoạch là tích cực.<br>3) Ấn tượng ban đầu về thành phố thật tuyệt vời."},
{u:15,w:"initial",pos:"adj. – ban đầu",c:"the initial stages / results",vi:"các giai đoạn / kết quả ban đầu",en:"1) The project is still in its initial stages.<br>2) The initial results look promising.",exvi:"1) Dự án vẫn đang ở giai đoạn ban đầu.<br>2) Kết quả ban đầu trông đầy hứa hẹn."},

{u:15,w:"latter",pos:"adj./n. – cái sau, phần sau",c:"choose / prefer the latter",vi:"chọn / thích cái sau",en:"Between coffee and tea, I always prefer the latter.",exvi:"Giữa cà phê và trà, tôi luôn thích cái sau (trà)."},
{u:15,w:"latter",pos:"adj./n. – cái sau, phần sau",c:"the latter stage / part / category",vi:"giai đoạn / phần / nhóm sau",en:"1) Mistakes happened in the latter stage of the game.<br>2) The latter part of the book is the best.",exvi:"1) Những sai lầm xảy ra ở giai đoạn sau của trận đấu.<br>2) Phần sau của cuốn sách là hay nhất."},

{u:15,w:"prior",pos:"adj. – trước đó",c:"prior approval / permission / consent",vi:"sự chấp thuận / cho phép / đồng ý trước",en:"1) You need prior approval to take leave.<br>2) Visitors must get prior permission to enter.<br>3) The data was used without prior consent.",exvi:"1) Bạn cần được chấp thuận trước để nghỉ phép.<br>2) Khách phải xin phép trước để vào.<br>3) Dữ liệu được dùng mà không có sự đồng ý trước."},
{u:15,w:"prior",pos:"adj. – trước đó",c:"prior knowledge / experience",vi:"kiến thức / kinh nghiệm trước đó",en:"1) The course requires no prior knowledge.<br>2) Prior experience is an advantage for this job.",exvi:"1) Khóa học không đòi hỏi kiến thức trước đó.<br>2) Kinh nghiệm trước đó là một lợi thế cho công việc này."},

{u:15,w:"subsequent",pos:"adj. – tiếp theo, sau đó",c:"a subsequent year / event / generation",vi:"một năm / sự kiện / thế hệ tiếp theo",en:"1) Sales grew in subsequent years.<br>2) The subsequent event was even bigger.<br>3) Subsequent generations enjoyed the benefits.",exvi:"1) Doanh số tăng trong những năm tiếp theo.<br>2) Sự kiện sau đó còn lớn hơn.<br>3) Các thế hệ sau được hưởng những lợi ích."},
{u:15,w:"subsequent",pos:"adj. – tiếp theo, sau đó",c:"a subsequent investigation / enquiry",vi:"một cuộc điều tra / truy vấn sau đó",en:"1) A subsequent investigation revealed the truth.<br>2) The subsequent enquiry took months.",exvi:"1) Một cuộc điều tra sau đó đã hé lộ sự thật.<br>2) Cuộc truy vấn sau đó kéo dài nhiều tháng."},

{u:15,w:"overall",pos:"adj. – tổng thể, nhìn chung",c:"overall spending / revenue",vi:"tổng chi tiêu / doanh thu",en:"1) Overall spending rose last year.<br>2) Overall revenue fell slightly.",exvi:"1) Tổng chi tiêu tăng vào năm ngoái.<br>2) Tổng doanh thu giảm nhẹ."},
{u:15,w:"overall",pos:"adj. – tổng thể, nhìn chung",c:"an overall impression / increase / majority",vi:"ấn tượng / mức tăng / đa số tổng thể",en:"1) The overall impression was very positive.<br>2) There was an overall increase in demand.<br>3) The party won an overall majority.",exvi:"1) Ấn tượng tổng thể rất tích cực.<br>2) Có một sự gia tăng chung về nhu cầu.<br>3) Đảng giành được đa số tuyệt đối."},

{u:16,w:"comparatively",pos:"adv. – tương đối, so ra thì",c:"comparatively little / small",vi:"tương đối ít / nhỏ",en:"1) The country spends comparatively little on defence.<br>2) The town is comparatively small.",exvi:"1) Quốc gia này chi tương đối ít cho quốc phòng.<br>2) Thị trấn này tương đối nhỏ."},
{u:16,w:"comparatively",pos:"adv. – tương đối, so ra thì",c:"comparatively rare / inexpensive",vi:"tương đối hiếm / rẻ",en:"1) Such storms are comparatively rare here.<br>2) The phone is comparatively inexpensive.",exvi:"1) Những cơn bão như vậy tương đối hiếm ở đây.<br>2) Chiếc điện thoại này tương đối rẻ."},

{u:16,w:"indefinitely",pos:"adv. – vô thời hạn",c:"continue indefinitely",vi:"tiếp diễn vô thời hạn",en:"The situation cannot continue indefinitely.",exvi:"Tình hình không thể tiếp diễn vô thời hạn."},
{u:16,w:"indefinitely",pos:"adv. – vô thời hạn",c:"be suspended / postponed indefinitely",vi:"bị đình chỉ / hoãn vô thời hạn",en:"1) The flights were suspended indefinitely.<br>2) The match was postponed indefinitely.",exvi:"1) Các chuyến bay bị đình chỉ vô thời hạn.<br>2) Trận đấu bị hoãn vô thời hạn."},

{u:16,w:"inevitably",pos:"adv. – tất yếu, không thể tránh khỏi",c:"inevitably lead to / result in something",vi:"tất yếu dẫn đến / gây ra điều gì",en:"1) Overuse of resources inevitably leads to shortages.<br>2) Carelessness inevitably results in mistakes.",exvi:"1) Việc lạm dụng tài nguyên tất yếu dẫn đến thiếu hụt.<br>2) Sự bất cẩn tất yếu gây ra sai lầm."},

{u:16,w:"particularly",pos:"adv. – đặc biệt là",c:"particularly useful / important / relevant",vi:"đặc biệt hữu ích / quan trọng / liên quan",en:"1) This tip is particularly useful for beginners.<br>2) Sleep is particularly important for children.<br>3) The example is particularly relevant here.",exvi:"1) Mẹo này đặc biệt hữu ích cho người mới.<br>2) Giấc ngủ đặc biệt quan trọng với trẻ em.<br>3) Ví dụ này đặc biệt liên quan ở đây."},

{u:16,w:"provisionally",pos:"adv. – tạm thời",c:"provisionally agreed / accepted / scheduled",vi:"được tạm đồng ý / chấp nhận / lên lịch",en:"1) The deal was provisionally agreed.<br>2) Her paper was provisionally accepted.<br>3) The meeting is provisionally scheduled for May.",exvi:"1) Thỏa thuận được tạm đồng ý.<br>2) Bài báo của cô ấy được tạm chấp nhận.<br>3) Cuộc họp tạm được lên lịch vào tháng Năm."},

const UNIT_TITLES = {
  1:"Unit 1 · People, relationships & character",
  2:"Unit 2 · Health – illness & treatment",
  3:"Unit 3 · Academic subjects & activities",
  4:"Unit 4 · Travel & experiences",
  5:"Unit 5 · Dimensions & actions",
  6:"Unit 6 · City life",
  7:"Unit 7 · Reporting verbs",
  8:"Unit 8 · Cultural interests",
  9:"Unit 9 · Natural processes & scientific study",
  10:"Unit 10 · Climate & weather",
  11:"Unit 11 · Graphs & figures (Writing Task 1)",
  12:"Unit 12 · Describing changes",
  13:"Unit 13 · Similarities & differences",
  14:"Unit 14 · Cause & effect",
  15:"Unit 15 · Signposting words",
  16:"Unit 16 · Qualifying adverbs",
  17:"Unit 17 · Problems & solutions",
  18:"Unit 18 · Ideas",
  19:"Unit 19 · Quantity, degree & certainty"
};
const ALL_UNITS = Object.keys(UNIT_TITLES).map(Number);

let flipState = new Array(DATA.length).fill(0);
let activeUnit = "all";
let searchQ = "";

function faceHTML(item, state){
  if(state===0){
    return `<div class="colloc">${item.c}</div><div class="hint">Nhấn để xem nghĩa →</div>`;
  }
  if(state===1){
    return `<div class="label">Nghĩa tiếng Việt</div><div class="vi">${item.vi}</div><div class="hint">Nhấn để xem ví dụ →</div>`;
  }
  return `<div class="label">Ví dụ</div><div class="ex-en">${item.en}</div><div class="ex-vi">${item.exvi}</div><div class="hint">Nhấn để quay lại →</div>`;
}

function dotsHTML(state){
  let d='<div class="dots">';
  for(let i=0;i<3;i++){ d+= `<span class="dot ${i<=state?'on':''}"></span>`; }
  d+='</div>';
  return d;
}

function matchesFilter(item){
  if(activeUnit!=="all" && String(item.u)!==activeUnit) return false;
  if(searchQ){
    const hay = (item.w+" "+item.c+" "+item.vi).toLowerCase();
    if(!hay.includes(searchQ)) return false;
  }
  return true;
}

function buildNav(){
  const nav = document.getElementById('unitNav');
  nav.innerHTML = ALL_UNITS.map(u=>`<a href="#unit-${u}">U${u}</a>`).join('');
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML='';
  ALL_UNITS.forEach(u=>{
    const items = DATA.map((it,idx)=>({it,idx})).filter(o=>o.it.u===u && matchesFilter(o.it));
    if(items.length===0) return;
    const block = document.createElement('div');
    block.className='unit-block';
    block.id = `unit-${u}`;
    block.innerHTML = `<div class="unit-title">${UNIT_TITLES[u]}</div>`;
    const groups = {};
    items.forEach(o=>{
      if(!groups[o.it.w]) groups[o.it.w]=[];
      groups[o.it.w].push(o);
    });
    Object.keys(groups).forEach(word=>{
      const wg = document.createElement('div');
      wg.className='word-group';
      wg.innerHTML = `<div class="word-head">▸ ${word} <span style="font-weight:normal; color:var(--sub)">(${groups[word][0].it.pos})</span></div>`;
      const grid = document.createElement('div');
      grid.className='grid';
      groups[word].forEach(o=>{
        const card = document.createElement('div');
        card.className='card';
        card.innerHTML = `<span class="tag">U${o.it.u}</span>` + faceHTML(o.it, flipState[o.idx]) + dotsHTML(flipState[o.idx]);
        card.addEventListener('click', ()=>{
          flipState[o.idx] = (flipState[o.idx]+1) % 3;
          card.innerHTML = `<span class="tag">U${o.it.u}</span>` + faceHTML(o.it, flipState[o.idx]) + dotsHTML(flipState[o.idx]);
          updateProgress();
        });
        grid.appendChild(card);
      });
      wg.appendChild(grid);
      block.appendChild(wg);
    });
    content.appendChild(block);
  });
  updateProgress();
}

function updateProgress(){
  const visible = DATA.filter(matchesFilter);
  const doneCount = DATA.filter((it,idx)=> matchesFilter(it) && flipState[idx]===2).length;
  document.getElementById('progress').textContent = `Đã xem đầy đủ: ${doneCount}/${visible.length} collocation`;
}

document.getElementById('flipAll0').onclick = ()=>{ flipState.fill(0); render(); };
document.getElementById('flipAll1').onclick = ()=>{ flipState.fill(1); render(); };
document.getElementById('flipAll2').onclick = ()=>{ flipState.fill(2); render(); };
document.getElementById('unitFilter').addEventListener('change',(e)=>{ activeUnit = e.target.value; render(); });
document.getElementById('filterBox').addEventListener('input',(e)=>{ searchQ = e.target.value.trim().toLowerCase(); render(); });


// ===== TAB FLASHCARDS / CHÍNH TẢ =====
document.querySelectorAll('.study-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.study-tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.study-panel').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.study==='cards' ? 'cardsPanel' : 'dictationPanel').classList.add('active');
  });
});

// ===== CHÍNH TẢ =====
const dictUnit = document.getElementById('dictUnit');
ALL_UNITS.forEach(u=>{
  const o=document.createElement('option');
  o.value=u;
  o.textContent=UNIT_TITLES[u];
  dictUnit.appendChild(o);
});

let dDeck=[], dIndex=0, dCorrect=0, dWrong=[], dAnswered=false;

function dShuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function dNorm(s){
  return String(s??'')
    .toLocaleLowerCase('vi')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')
    .replace(/<br\s*\/?>/gi,' ')
    .replace(/[“”"'.!?;,()[\]{}:–—]/g,' ')
    .replace(/\s*\/\s*/g,' / ')
    .replace(/\s+/g,' ')
    .trim();
}

function dStart(custom=null){
  const unit=dictUnit.value;
  let pool=custom || DATA.filter(x=>unit==='all' || String(x.u)===unit);
  const n=Math.min(parseInt(document.getElementById('dictCount').value,10),pool.length);
  dDeck=dShuffle([...pool]).slice(0,n);

  if(!dDeck.length){
    alert('Không có dữ liệu phù hợp.');
    return;
  }

  dIndex=0; dCorrect=0; dWrong=[]; dAnswered=false;
  document.getElementById('dictSetup').style.display='none';
  document.getElementById('dictEnd').style.display='none';
  document.getElementById('dictPlay').style.display='block';
  dRender();
}

function dRender(){
  const x=dDeck[dIndex];
  const dir=document.getElementById('dictDirection').value;
  dAnswered=false;

  document.getElementById('dictCounter').textContent=`Câu ${dIndex+1} / ${dDeck.length}`;
  document.getElementById('dictScore').textContent=`Đúng: ${dCorrect}`;
  document.getElementById('dictProgress').style.width=`${(dIndex/dDeck.length)*100}%`;

  document.getElementById('dictPrompt').innerHTML =
    dir==='en-vi' ? x.c : x.vi;

  document.getElementById('dictHint').textContent =
    `Unit ${x.u} · ${x.w} · ${x.pos}`;

  const a=document.getElementById('dictAnswer');
  a.value='';
  a.disabled=false;
  a.placeholder=dir==='en-vi' ? 'Nhập nghĩa tiếng Việt...' : 'Nhập collocation tiếng Anh...';
  a.focus();

  const fb=document.getElementById('dictFeedback');
  fb.className='dict-feedback';
  fb.innerHTML='';

  document.getElementById('dictCheck').style.display='';
  document.getElementById('dictNext').style.display='none';
}

function dCheck(){
  if(dAnswered) return;
  dAnswered=true;

  const x=dDeck[dIndex];
  const dir=document.getElementById('dictDirection').value;
  const ans=dNorm(document.getElementById('dictAnswer').value);
  const target=dNorm(dir==='en-vi' ? x.vi : x.c);

  let ok=false;

  if(dir==='vi-en'){
    // English collocation: require exact normalized phrase.
    ok = ans===target;
  }else{
    // Vietnamese: accept exact answer or a substantial contained phrase.
    const words=ans.split(' ').filter(Boolean);
    ok = ans===target || (words.length>=3 && target.includes(ans));
  }

  document.getElementById('dictAnswer').disabled=true;
  const fb=document.getElementById('dictFeedback');

  if(ok){
    dCorrect++;
    fb.className='dict-feedback good';
    fb.innerHTML=`✓ Đúng — <b>${x.c}</b> = ${x.vi}`;
  }else{
    dWrong.push(x);
    fb.className='dict-feedback bad';
    fb.innerHTML=`✗ Đáp án: <b>${x.c}</b> = ${x.vi}`;
  }

  document.getElementById('dictScore').textContent=`Đúng: ${dCorrect}`;
  document.getElementById('dictCheck').style.display='none';
  document.getElementById('dictNext').style.display='';
}

function dNext(){
  dIndex++;
  if(dIndex>=dDeck.length){
    document.getElementById('dictPlay').style.display='none';
    document.getElementById('dictEnd').style.display='block';
    document.getElementById('dictFinalScore').textContent=`${dCorrect} / ${dDeck.length}`;
    document.getElementById('dictFinalText').textContent =
      dWrong.length ? `Còn ${dWrong.length} collocation cần luyện lại.` : 'Hoàn thành toàn bộ chính xác.';
    document.getElementById('dictRetryWrong').style.display=dWrong.length ? '' : 'none';
    return;
  }
  dRender();
}

document.getElementById('dictStart').onclick=()=>dStart();
document.getElementById('dictCheck').onclick=dCheck;
document.getElementById('dictNext').onclick=dNext;

document.getElementById('dictAgain').onclick=()=>{
  document.getElementById('dictEnd').style.display='none';
  document.getElementById('dictSetup').style.display='block';
};

document.getElementById('dictRetryWrong').onclick=()=>dStart([...dWrong]);

document.getElementById('dictAnswer').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    dAnswered ? dNext() : dCheck();
  }
});

buildNav();
render();
</script>
</body>
</html>
